      { name: 'Application — Clog Clinic', test: function (k) { return /^app_(prep|clog|lever|followup)$/i.test(k); } },
      { name: 'My Executive ESRG Bias',   test: function (k, lensId) { return /^bias_[esrg]$/i.test(k) && lensId === 'u4m1_lens9'; } },
      { name: 'Functional ESRG Assessment', test: function (k) { return /^esrg_/i.test(k); } },
      { name: 'Enterprise ESRG Alignment Clinic', test: function (k, lensId) { return /^es_(scanner|interp|resp|plan)$/i.test(k) && lensId === 'u4m1_lens9'; } },
      { name: 'Cultural Operating Code',  test: function (k, lensId) { return /^coc\d+$/i.test(k) || /^coc_valueset$/i.test(k) || (/^app_commit$/i.test(k) && lensId === 'u4m1_lens9'); } },
      { name: 'Health Thermometer',       test: function (k) { return /^app_thermo$/i.test(k); } },
      { name: 'Cultural Operating Code', test: function (k, lensId) { return /^oh_(func|cons|rrr|resp|coc)$/i.test(k) && lensId === 'u4m1_lens10'; } },
      { name: 'ACE-IT Coaching Model',    test: function (k, lensId) { return /^app_scenario$/i.test(k) || /^app_prep_/i.test(k) || (/^app_commit$/i.test(k) && lensId === 'u4m1_lens10'); } },
      { name: 'KISS Navigation Response', test: function (k) { return /^app_kiss_/i.test(k); } },
      { name: 'Navigation Commitment',    test: function (k) { return /^app_nav_/i.test(k); } },
      { name: 'Performance Sustaining Key', test: function (k, lensId) { return /^qs_(strategic|operational|behavioural|kiss)$/i.test(k) && lensId === 'u4m2_lens11'; } }
    ];
    function familyOf(key, lensId) {
      for (var fi = 0; fi < FAMILY_DEFS.length; fi++) { if (FAMILY_DEFS[fi].test(key, lensId)) return FAMILY_DEFS[fi].name; }
      return null;
    }
    visibleKeys.forEach(function(key) {
      if (key === 'assessment') {
        if (lensId !== 'u1_foundations') assessmentData = responses[key];
        return;
      }
      const match = key.match(/^r_m(\d+)_(.+)$/);
      var bucket, fieldName;
      if (match) { bucket = match[1]; fieldName = match[2]; }
      else { var fam = familyOf(key, lensId); bucket = fam || '_other'; fieldName = key; }
      if (!buckets[bucket]) buckets[bucket] = [];
      buckets[bucket].push({ key: key, fieldName: fieldName, value: responses[key] });
    });

    const wrap = document.createElement('div');

    // Sort module bucket keys numerically; '_other' last
    const moduleNums = Object.keys(buckets)
      .filter(function(k) { return /^\d+$/.test(k); })
      .sort(function(a, b) { return Number(a) - Number(b); });

    moduleNums.forEach(function(num) {
      const moduleEl = document.createElement('div');
      moduleEl.className = 'response-module';

      const heading = document.createElement('div');
      heading.className = 'response-module-heading';
      heading.textContent = (lensId === 'u1_foundations' && U1_SECTIONS[num]) ? U1_SECTIONS[num] : 'Section ' + num;
      heading.addEventListener('click', function() {
        moduleEl.classList.toggle('collapsed');
      });
      moduleEl.appendChild(heading);

      const body = document.createElement('div');
      body.className = 'response-module-body';
      buckets[num].forEach(function(entry) {
        body.appendChild(renderFieldEntry(lensId === 'u1_foundations' ? entry.key : entry.fieldName, entry.value, 0, lensId));
      });
      moduleEl.appendChild(body);
      wrap.appendChild(moduleEl);
    });

    // ─── NAMED FAMILY sections (Reflections / Portfolio / Objectives / KISS) ──
    // Each renders as a collapsible section; with >1 section the block below
    // collapses them all by default, so the report is a short list of headings.
    FAMILY_DEFS.forEach(function (fam) {
      if (!buckets[fam.name]) return;
      const moduleEl = document.createElement('div');
      moduleEl.className = 'response-module';
      const heading = document.createElement('div');
      heading.className = 'response-module-heading';
      heading.textContent = fam.name;
      heading.addEventListener('click', function () { moduleEl.classList.toggle('collapsed'); });
      moduleEl.appendChild(heading);
      const body = document.createElement('div');
      body.className = 'response-module-body';
      if (fam.name === 'KISS Mapping') {
        // Sub-group KISS entries by domain (EV / OP / PC ...) into nested
        // collapsible sub-sections, so the section opens as a few domain headings
        // instead of one long list of Keep/Stop/Start rows.
        var kdomains = {}, korder = [];
        buckets[fam.name].forEach(function (entry) {
          var dm = String(entry.fieldName).match(/^kex_([^_]+)_/i);
          var dom = dm ? dm[1].toUpperCase() : 'Other';
          if (!kdomains[dom]) { kdomains[dom] = []; korder.push(dom); }
          kdomains[dom].push(entry);
        });
        korder.forEach(function (dom) {
          var sub = document.createElement('div');
          sub.className = 'response-module response-submodule';
          var subHeading = document.createElement('div');
          subHeading.className = 'response-module-heading';
          subHeading.textContent = 'KISS \u00B7 ' + dom;
          subHeading.addEventListener('click', function (e) { e.stopPropagation(); sub.classList.toggle('collapsed'); });
          sub.appendChild(subHeading);
          var subBody = document.createElement('div');
          subBody.className = 'response-module-body';
          kdomains[dom].forEach(function (entry) { subBody.appendChild(renderFieldEntry(entry.fieldName, entry.value, 0, lensId)); });
          sub.appendChild(subBody);
          body.appendChild(sub);
        });
      } else if (fam.name === 'Strategic Intent (SiP)') {
        // sip_data is { ROLE: [d0,d1,d2,d3] }; relabel each role's array by SiP
        // dimension, skip executive roles with no content, and render the filled
        // roles directly under the family heading.
        var SIP_DIM = ['Customer Experience & Value', 'Operational Capability & Execution Rhythm', 'People & Culture Dynamics', 'Enterprise Value Creation'];
        buckets[fam.name].forEach(function (entry) {
          var val = entry.value;
          if (val && typeof val === 'object' && !Array.isArray(val)) {
            var relabeled = {};
            Object.keys(val).forEach(function (role) {
              var rv = val[role];
              var hasAny = Array.isArray(rv)
                ? rv.some(function (x) { return x && String(x).trim(); })
                : (rv && String(rv).trim());
              if (!hasAny) return; // skip empty executive roles
              if (Array.isArray(rv)) {
                var obj = {};
                rv.forEach(function (txt, i) { obj[SIP_DIM[i] || ('Dimension ' + (i + 1))] = txt; });
                relabeled[role] = obj;
              } else { relabeled[role] = rv; }
            });
            val = relabeled;
          }
          body.appendChild(renderValue(val, 0, lensId));
        });
      } else {
        var famEntries = buckets[fam.name];
        // KISS Navigation Response: render the chosen scenario as the header line,
        // before the K/I/S/S responses it frames (stable sort preserves the rest).
        if (fam.name === 'Strategy Architecture' || fam.name === 'Success in Practice (SiP)') {
          famEntries = famEntries.slice().sort(function (a, b) { return a.fieldName < b.fieldName ? -1 : (a.fieldName > b.fieldName ? 1 : 0); });
        }
        if (fam.name === 'KISS Navigation Response') {
          famEntries = famEntries.slice().sort(function (a, b) {
            return (/scenario/i.test(a.fieldName) ? 0 : 1) - (/scenario/i.test(b.fieldName) ? 0 : 1);
          });
        }
        famEntries.forEach(function (entry) { body.appendChild(renderFieldEntry(entry.fieldName, entry.value, 0, lensId)); });
      }
      moduleEl.appendChild(body);
      wrap.appendChild(moduleEl);
    });

    // ─── ASSESSMENT RESULTS section ───────────────────────────────────────
    // Holds the non-module ('_other') reflections (e.g. portfolio prompts)
    // AND the interpreted Five Commitments assessment card. Both collapse
    // together under one heading. Section is created if EITHER is present.
    const hasOther = !!buckets['_other'];
    if (hasOther || assessmentData) {
      const moduleEl = document.createElement('div');
      moduleEl.className = 'response-module';

      // Heading + collapse toggle. When there were no numbered modules at all
      // AND no assessment card, the original code rendered '_other' headingless;
      // we preserve that only for the pure-flat-lens case (no assessment).
      const flatNoHeading = (moduleNums.length === 0 && !assessmentData);

      const body = document.createElement('div');
      body.className = 'response-module-body';

      if (!flatNoHeading) {
        const heading = document.createElement('div');
        heading.className = 'response-module-heading';
        heading.textContent = 'Assessment Results';
        heading.addEventListener('click', function() {
          moduleEl.classList.toggle('collapsed');
        });
        moduleEl.appendChild(heading);
      }

      // Portfolio / non-module reflections first
      if (hasOther) {
        buckets['_other'].forEach(function(entry) {
          body.appendChild(renderFieldEntry(entry.fieldName, entry.value, 0, lensId));
        });
      }
      // Then the interpreted assessment card, nested inside the same body
      if (assessmentData) {
        body.appendChild(renderAssessmentCard(assessmentData));
      }

      moduleEl.appendChild(body);
      wrap.appendChild(moduleEl);
    }

    // Collapsible UX: when a submission has more than one section, collapse them
    // all by default and offer an expand/collapse-all control, so a long review
    // opens as a compact list of section headings instead of one wall of text.
    // Gated on >1 heading so single-section (and headingless flat) submissions
    // are left fully expanded — every collapsed module is guaranteed a heading
    // to re-open it. To change the default to "first section open", remove the
    // collapse loop below; to default-expanded, delete this whole block.
    const collapsibleHeadings = wrap.querySelectorAll('.response-module-heading');
    if (collapsibleHeadings.length > 1 && lensId !== 'u1_foundations') {
      wrap.querySelectorAll('.response-module').forEach(function(m) {
        m.classList.add('collapsed');
      });
      const bar = document.createElement('div');
      bar.className = 'response-toolbar';
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'response-expand-all';
      btn.textContent = 'Expand all';
      btn.addEventListener('click', function() {
        const anyCollapsed = !!wrap.querySelector('.response-module.collapsed');
        wrap.querySelectorAll('.response-module').forEach(function(m) {
          m.classList.toggle('collapsed', !anyCollapsed);
        });
        btn.textContent = anyCollapsed ? 'Collapse all' : 'Expand all';
      });
      bar.appendChild(btn);
      wrap.insertBefore(bar, wrap.firstChild);
    }

    return wrap;
  }

  // ─── ASSESSMENT INTERPRETED CARD ───────────────────────────────────────────
  const _FAC_COMMIT_LABELS = [
    'I Know My Biases',
    'I Manage My Emotional Impact',
    'I Build Psychological Safety',
    'I Use Process to Protect Quality',
    'I Treat People as the Strategy'
  ];
  const _FAC_LEVEL_DATA = {
    'Leading Practice':    { badge:'background:rgba(26,122,106,.25);color:#4fd8c0;border:1px solid rgba(26,122,106,.4);', risk:'Low' },
    'Established Awareness':{ badge:'background:rgba(39,174,96,.12);color:#4fd88a;border:1px solid rgba(39,174,96,.3);', risk:'Moderate' },
    'Developing Awareness':{ badge:'background:rgba(201,168,76,.12);color:var(--gold);border:1px solid rgba(201,168,76,.3);', risk:'Moderate–High' },
    'Emerging Awareness':  { badge:'background:rgba(231,76,60,.1);color:#e74c3c;border:1px solid rgba(231,76,60,.25);', risk:'High' },
    'At Risk':             { badge:'background:rgba(192,57,43,.2);color:#ff6b5b;border:1px solid rgba(192,57,43,.4);', risk:'Critical' }
  };

  function renderAssessmentCard(data) {
    const card = document.createElement('div');
    card.className = 'assessment-card';

    const lbl = document.createElement('div');
    lbl.className = 'assessment-card-label';
    lbl.textContent = 'Five Commitments — Self-Assessment';
    card.appendChild(lbl);

    // Validate shape
    const tots = Array.isArray(data.tots) ? data.tots : [];
    const ov   = typeof data.ov === 'number' ? data.ov : tots.reduce(function(a,b){return a+(b||0);},0);
    const ts   = data.ts || null;

    // Score
    const scoreRow = document.createElement('div');
    scoreRow.className = 'assessment-score-row';
    scoreRow.innerHTML = '<span class="assessment-score-num">' + ov + '</span><span class="assessment-score-max"> / 100</span>';
    card.appendChild(scoreRow);

    // Level
    let lvl = 'At Risk';
    if (ov >= 85) lvl = 'Leading Practice';
    else if (ov >= 65) lvl = 'Established Awareness';
    else if (ov >= 45) lvl = 'Developing Awareness';
    else if (ov >= 25) lvl = 'Emerging Awareness';
    const ld = _FAC_LEVEL_DATA[lvl] || _FAC_LEVEL_DATA['At Risk'];

    const badge = document.createElement('div');
    badge.className = 'assessment-level-badge';
    badge.style.cssText = ld.badge;
    badge.textContent = lvl + ' · Risk: ' + ld.risk;
    card.appendChild(badge);

    // Commitment bars
    if (tots.length > 0) {
      const minVal = Math.min.apply(null, tots);
      const minIdx = tots.indexOf(minVal);

      const barsWrap = document.createElement('div');
      barsWrap.className = 'assessment-bars';
      tots.forEach(function(val, i) {
        const row = document.createElement('div');
        row.className = 'assessment-bar-row';
        const nameLbl = document.createElement('span');
        nameLbl.className = 'assessment-bar-label';
        nameLbl.title = _FAC_COMMIT_LABELS[i] || ('C' + (i+1));
        nameLbl.textContent = 'C' + (i+1) + ' · ' + (_FAC_COMMIT_LABELS[i] || '');
        const track = document.createElement('div');
        track.className = 'assessment-bar-track';
        const fill = document.createElement('div');
        fill.className = 'assessment-bar-fill' + (i === minIdx ? ' priority' : '');
        fill.style.width = Math.round((val||0) / 20 * 100) + '%';
        track.appendChild(fill);
        const valLbl = document.createElement('span');
        valLbl.className = 'assessment-bar-val';
        valLbl.textContent = (val||0) + '/20';
        row.appendChild(nameLbl);
        row.appendChild(track);
        row.appendChild(valLbl);
        barsWrap.appendChild(row);
      });
      card.appendChild(barsWrap);

      // Priority area note
      const pBox = document.createElement('div');
      pBox.className = 'assessment-priority-box';
      pBox.innerHTML = '<strong>Priority area: C' + (minIdx+1) + ' · ' + (_FAC_COMMIT_LABELS[minIdx]||'') + '</strong> (' + (tots[minIdx]||0) + '/20) — lowest-scoring commitment. Consider whether this participant would benefit from focused coaching on this dimension.';
      card.appendChild(pBox);
    }

    // Timestamp
    if (ts) {
      const tsEl = document.createElement('div');
      tsEl.className = 'assessment-ts';
      try {
        tsEl.textContent = 'Scored: ' + new Date(ts).toLocaleString('en-GB', {day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
      } catch(e) { tsEl.textContent = 'Scored: ' + ts; }
      card.appendChild(tsEl);
    }

    return card;
  }

  // Recursively determine whether a value carries any real content. Used to
  // auto-expand filled nested fields (e.g. a completed SiP role) while leaving
  // empty ones collapsed.
  function fieldHasContent(value) {
    if (value === null || value === undefined || value === '') return false;
    if (typeof value === 'string') return value.trim() !== '';
    if (typeof value === 'number' || typeof value === 'boolean') return true;
    if (Array.isArray(value)) return value.some(fieldHasContent);
    if (typeof value === 'object') {
      return Object.keys(value).some(function(k) {
        return !k.startsWith('__') && fieldHasContent(value[k]);
      });
    }
    return false;
  }

  function renderFieldEntry(fieldName, value, depth, lensId) {
    depth = depth || 0;
    const wrap = document.createElement('div');
    wrap.className = 'response-field';

    const label = document.createElement('div');
    label.className = 'response-label';
    label.textContent = labelFor(fieldName, lensId);
    wrap.appendChild(label);
    if (!depth) {
      const qText = questionFor(fieldName, lensId);
      if (qText && qText !== label.textContent) {
        const qEl = document.createElement('div');
        qEl.className = 'response-question';
        qEl.style.cssText = 'font-size:12px;line-height:1.6;font-style:italic;opacity:0.85;margin:2px 0 8px;white-space:pre-wrap;';
        qEl.textContent = qText;
        wrap.appendChild(qEl);
      }
      if (lensId === 'u1_foundations') {
        const fullKey = /^r_m\d+_/.test(fieldName) ? fieldName : '';
        const si = fullKey ? u1SkillOf(fullKey) : -1;
        if (si >= 0) {
          wrap.setAttribute('data-u1-key', fullKey);
          wrap.setAttribute('data-u1-skill', String(si));
          const tag = document.createElement('div');
          tag.style.cssText = 'display:inline-block;font-size:11px;font-weight:600;margin:0 0 6px;padding:2px 8px;border-radius:10px;border:1px solid rgba(201,168,76,0.6);color:#c9a84c;';
          tag.textContent = 'Skill ' + (si + 1) + ': ' + U1_SKILLS[si];
          wrap.appendChild(tag);
        }
      }
    }

    const valueEl = renderValue(value, depth, lensId);

    // Nested fields (the SiP roles under "Sip Data", and anything similarly
    // structured) collapse under their own label, so a many-role submission
    // reads as a list of headings rather than one long wall. Roles that contain
    // answers start expanded; empty ones start collapsed.
    const isExpandable = depth >= 1 && value !== null && typeof value === 'object' &&
      (Array.isArray(value)
        ? value.length > 0
        : Object.keys(value).some(function(k) { return !k.startsWith('__'); }));
    if (isExpandable) {
      wrap.classList.add('response-field-collapsible');
      if (!fieldHasContent(value)) wrap.classList.add('collapsed');
      label.addEventListener('click', function() {
        wrap.classList.toggle('collapsed');
      });
    }

    // Unit 1: an unanswered reflection carries its own Not answered note under the marking.
    if (!(lensId === 'u1_foundations' && wrap.hasAttribute('data-u1-key') && value === '')) wrap.appendChild(valueEl);
    return wrap;
  }

  function renderValue(value, depth, lensId) {
    // Empty / null
    if (value === null || value === undefined || value === '') {
      const e = document.createElement('span');
      e.className = 'response-empty-inline';
      e.textContent = '— not provided —';
      return e;
    }
    // String — preserve line breaks via CSS
    if (typeof value === 'string') {
      const t = document.createElement('div');
      t.className = 'response-text';
      t.textContent = value;  // textContent → no XSS
      return t;
    }
    // Number / boolean
    if (typeof value === 'number' || typeof value === 'boolean') {
      const t = document.createElement('div');
      t.className = 'response-text';
      t.textContent = String(value);
      return t;
    }
    // Array
    if (Array.isArray(value)) {
      if (value.length === 0) {
        const e = document.createElement('span');
        e.className = 'response-empty-inline';
        e.textContent = '— empty list —';
        return e;
      }
      const ul = document.createElement('ul');
      ul.className = 'response-list';
      value.forEach(function(item) {
        const li = document.createElement('li');
        if (item !== null && typeof item === 'object') {
          li.appendChild(renderValue(item, depth + 1, lensId));
        } else {
          li.textContent = String(item);
        }
        ul.appendChild(li);
      });
      return ul;
    }
    // Nested object
    if (typeof value === 'object') {
      if (depth >= 3) {
        const t = document.createElement('div');
        t.className = 'response-text';
        t.textContent = '[nested data — depth limit reached]';
        return t;
      }
      const wrap = document.createElement('div');
      wrap.className = 'response-nested';
      Object.keys(value).forEach(function(k) {
        if (k.startsWith('__')) return;
        wrap.appendChild(renderFieldEntry(k, value[k], depth + 1, lensId));
      });
      return wrap;
    }
    // Fallback
    const t = document.createElement('div');
    t.className = 'response-text';
    t.textContent = String(value);
    return t;
  }

  // ─── PER-LENS LABEL REGISTRY ─────────────────────────────────────────
  // lens_id → { savedKey: exerciseName }. Direct-lookup labels for the
  // facilitator report. Takes precedence over the generic rules in
  // humanizeFieldName (so e.g. ref1 in Lens 1 reads "Reflection 1 — The
  // Definition" rather than the generic "Reflection 1"). Add lenses as they
  // are migrated from generic numbered labels.
  var LENS_LABELS = {
    u2m1_lens1: {
      arch_e01_q1: "1 · ITERATIVE — What core hypotheses does the strategy depend on?",
      arch_e01_q2: "1 · ITERATIVE — How will reality test those hypotheses?",
      arch_e01_q3: "1 · ITERATIVE — What evidence would trigger refinement?",
      arch_e01_q4: "1 · ITERATIVE — How and when will strategic choices be revisited?",
      arch_e01_rs: "13 · ITERATIVE — How will our organisation test and refine this strategy over time?",
      arch_e02_q1: "2 · THINKING & LOGIC — What alternative possibilities were explored?",

    // Lens 8 — Strategic Unclogging (Clog Clinic)
    if (/^app_prep$/i.test(s))     return 'Clog Clinic · Individual Preparation';
    if (/^app_clog$/i.test(s))     return 'Commitment · Clog Diagnosed';
    if (/^app_lever$/i.test(s))    return 'Commitment · Lever to Pull';
    if (/^app_followup$/i.test(s)) return 'Commitment · Follow-Up Review Date';
    // Lens 9 — ESRG Alignment (Grounding)
    if (/^esrg_element$/i.test(s))  return 'ESRG Agenda · Friction Element';
    if (/^esrg_issue$/i.test(s))    return 'ESRG Agenda · Issue Observed';
    if (/^esrg_severity$/i.test(s)) return 'ESRG Agenda · Severity';
    if (/^esrg_compass$/i.test(s))  return 'ESRG Agenda · COMPASS Zone Most Impacted';
    if (/^esrg_why$/i.test(s))      return 'ESRG Agenda · Why Named Now';
    if ((m = s.match(/^coc(\d+)$/i))) return 'COC Norm ' + m[1];
    if (/^coc_valueset$/i.test(s))  return 'Chosen Value Set';
    if (/^app_commit$/i.test(s))    return lensId === 'u4m1_lens10' ? 'Coaching Commitment' : 'COC Commitment';
    // Lens 10 — Culture Reinforcement & Organisational Health
    if (/^app_thermo$/i.test(s))    return 'Health Thermometer';
    if (/^app_scenario$/i.test(s))  return 'Chosen Coaching Scenario';
    if (/^app_prep_accountability$/i.test(s)) return 'ACE-IT Prep · Accountability';
    if (/^app_prep_commitment$/i.test(s))     return 'ACE-IT Prep · Commitment';
    if (/^app_prep_engagement$/i.test(s))     return 'ACE-IT Prep · Engagement';
    if (/^app_prep_integrity$/i.test(s))      return 'ACE-IT Prep · Integrity';
    if (/^app_prep_transparency$/i.test(s))   return 'ACE-IT Prep · Transparency';
    // Lens 11 — Sustaining Performance
    if (/^app_kiss_scenario$/i.test(s)) return 'Chosen Navigation Scenario';
    if (/^app_kiss_keep$/i.test(s))     return 'KISS Response · Keep';
    if (/^app_kiss_improve$/i.test(s))  return 'KISS Response · Improve';
    if (/^app_kiss_stop$/i.test(s))     return 'KISS Response · Stop';
    if (/^app_kiss_start$/i.test(s))    return 'KISS Response · Start';
    if (/^app_nav_force$/i.test(s))     return 'Navigation Commitment · Force';
    if (/^app_nav_abcv$/i.test(s))      return 'Navigation Commitment · ABCV Finding';
    if (/^app_nav_commit$/i.test(s))    return 'Navigation Commitment · KISS Decision';
    s = s.replace(/^app_app_/i, '');
    s = s.replace(/^r_m\d+_/, '');
    s = s.replace(/^r_/, '');
    s = s.replace(/_/g, ' ');
    s = s.replace(/\b\w/g, function(c) { return c.toUpperCase(); });
    return s;
  }

  // ─── F4-2: FIVE COMMITMENTS ADAPTIVE DETECTION ───
  // Looks for known shapes; renders panel if found. No-op when absent.
  // Foundation's Test E payload doesn't carry it; first lens that does will trigger.
  function detectFiveCommitments(payload) {
    if (!payload || typeof payload !== 'object') return null;
    const candidates = [
      payload.five_commitments,
      payload.fiveCommitments,
      payload.responses && payload.responses.five_commitments,
      payload.responses && payload.responses.fiveCommitments
    ];
    for (let i = 0; i < candidates.length; i++) {
      const c = candidates[i];
      if (c && typeof c === 'object' && !Array.isArray(c)) {
        const keys = Object.keys(c);
        const hasOverall = keys.indexOf('overall') !== -1 || keys.indexOf('total') !== -1;
        const hasCommitments = keys.some(function(k) { return /^c\d+$/i.test(k) || /^commitment/i.test(k); });
        if (hasOverall || hasCommitments) return c;
      }
    }
    return null;
  }

  function renderFiveCommitmentsPanel(fc) {
    const panel = document.createElement('div');
    panel.className = 'fc-panel';

    const heading = document.createElement('div');
    heading.className = 'fc-panel-heading';
    heading.textContent = 'Five Commitments — Self-Score';
    panel.appendChild(heading);

    // Score grid: per-commitment scores (any keys matching c1..cN or commitmentX)
    const scoreKeys = Object.keys(fc).filter(function(k) {
      return /^c\d+$/i.test(k) || /^commitment\d+$/i.test(k) || /^commitment_\d+$/i.test(k);
    }).sort();

    if (scoreKeys.length > 0) {
      const grid = document.createElement('div');
      grid.className = 'fc-grid';
      scoreKeys.forEach(function(k) {
        const cell = document.createElement('div');
        cell.className = 'fc-cell';
        const labelEl = document.createElement('div');
        labelEl.className = 'fc-label';
        labelEl.textContent = humanizeFieldName(k);
        const scoreEl = document.createElement('div');
        scoreEl.className = 'fc-score';
        scoreEl.textContent = String(fc[k]);
        cell.appendChild(labelEl);
        cell.appendChild(scoreEl);
        grid.appendChild(cell);
      });
      panel.appendChild(grid);
    }

    // Overall row
    const overall = (fc.overall !== undefined) ? fc.overall : fc.total;
    const band    = fc.band || fc.tier || fc.level;
    if (overall !== undefined || band) {
      const row = document.createElement('div');
      row.className = 'fc-overall-row';
      if (overall !== undefined) {
        const lbl = document.createElement('span');
        lbl.className = 'fc-overall-label';
        lbl.textContent = 'Overall';
        const val = document.createElement('span');
        val.className = 'fc-overall-score';
        val.textContent = String(overall);
        row.appendChild(lbl);
        row.appendChild(val);
      }
      if (band) {
        const bandEl = document.createElement('span');
        bandEl.className = 'fc-band';
        bandEl.textContent = String(band);
        row.appendChild(bandEl);
      }
      panel.appendChild(row);
    }

    return panel;
  }

  // ─── F4-2: ACCESS-DENIED / NOT-FOUND CARDS ───
  
  // Group work that feeds the Capstone S2R® Blueprint is left out of the Learning Portfolio. It stays in the facilitator report (dashboard_F.html).
  var CAPSTONE_KEYS={ u1_foundations:/^(pc_|confirmed_items$)/i, u2m1_lens1:/^(arch_|org_name$|strategy_period$|intent_statement$|sip_d\d_(q\d|st)$|sip_integrated$|confirmed_items$)/i, u2m1_lens2:/^(kex_|kiss_(keep|improve|start|stop)$|sip_d\d_st$|okr_drafts$|ent_priorities$|ent_okrs$|confirmed_items$)/i, u2m1_lens3:/^(mbt_(record|arena|bound|comp|value|verify|blind)$|syn_(themes|disagree|top5)$|own_(internal|external|timeline)$|team_name$|exec_(name|role)$|confirmed_items$)/i, u3m1_lens4:/^(syn_(missing_compass|strong_compass|sequence)$|kit_(team|mind|heart|hands|habit|profile)$|oceavl_scores$|team_name$|exec_(name|role)$|confirmed_items$)/i, u3m1_lens5:/^(pm_(record|scoring|faces|execution|scorecards)$|cm_(record|map|faces|ward)$|confirmed_items$)/i, u3m1_lens6:/^(ex_(record|future|delivery|chain|ownership|dialogue)$|confirmed_items$)/i, u3m2_lens7:/^(rd_(record|warning|accountability|learning|credibility|ward)$|confirmed_items$)/i, u3m2_lens8:/^(uc_(record|challenge|clog|lever|review_realign|restore)$|confirmed_items$)/i, u4m1_lens9:/^(es_(scanner|interp|resp|plan)$|confirmed_items$)/i, u4m1_lens10:/^(oh_(func|cons|rrr|resp|coc)$|confirmed_items$)/i, u4m2_lens11:/^(qs_(strategic|operational|behavioural|kiss)$|confirmed_items$)/i };
  function portfolioPayload(payload,lensId){ var rx=CAPSTONE_KEYS[lensId]; if(!rx||!payload||!payload.responses) return payload; var out={}; Object.keys(payload).forEach(function(k){ out[k]=payload[k]; }); var r={}; Object.keys(payload.responses).forEach(function(k){ if(!rx.test(k)) r[k]=payload.responses[k]; }); out.responses=r; return out; }
  // prompt-primary label hook (spec §: extracted question prompt, else verbatim humanizeFieldName)
  function labelFor(name,lensId){ var m=PROMPTS[lensId]||{}; var p=m[name]; if(!p){ Object.keys(m).some(function(k){ if(k.replace(/^r_m\d+_/,"")===name){ p=m[k]; return true; } return false; }); } return (p&&String(p).trim())?p:humanizeFieldName(name,lensId); }

  // ───────────────────────── helpers ─────────────────────────
  function el(tag,cls,txt){ var e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; }
  function fatal(title,msg){ document.getElementById("root").innerHTML=""; var w=el("div","fatal"); w.appendChild(el("h2",null,title)); w.appendChild(el("p",null,msg)); document.getElementById("root").appendChild(w); }
  function fmtDate(iso){ if(!iso) return null; var d=new Date(iso); if(isNaN(d)) return null; return d.toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"}); }

  function renderMicroClimb(arr){
    var wrap=el("div","micro-climb");
    arr.forEach(function(s){
      var b=el("div","sum-block open");
      var h=el("div","sum-h"); h.appendChild(el("span","sum-arc",s.arc||"")); h.appendChild(el("span","sum-title",s.title||s.t||"")); b.appendChild(h);
      var body=el("div","sum-body"); body.appendChild(el("p",null,s.body||""));
      if(s.points&&s.points.length){ var ul=el("ul","sum-pts"); s.points.forEach(function(pt){ var li=el("li"); var k=String(pt).indexOf(": "); if(k>0&&k<60){ li.appendChild(el("strong",null,pt.slice(0,k+1))); li.appendChild(document.createTextNode(" "+pt.slice(k+2))); } else { li.textContent=pt; } ul.appendChild(li); }); body.appendChild(ul); }
      b.appendChild(body);
      wrap.appendChild(b);
    });
    return wrap;
  }

  // Print layout: drop a lone "Reflections" heading under the label; split "Section N · Arc · Question" labels into a tag and the question.
  function styleResponses(node){
    try{
      var mods=node.querySelectorAll(".response-module");
      if(mods.length===1){ var hd=mods[0].querySelector(".response-module-heading"); if(hd && /^reflections$/i.test(hd.textContent.trim())){ hd.parentNode.removeChild(hd); mods[0].classList.remove("collapsed"); } }
      Array.prototype.forEach.call(node.querySelectorAll(".response-label"), function(lb){
        var m=/^\s*(Section\s+\d+)\s*\u00b7\s*([^\u00b7]+?)\s*\u00b7\s*([\s\S]+)$/.exec(lb.textContent||"");
        if(!m) return;
        lb.textContent="";
        var tag=el("span","rf-tag",m[1]+" \u00b7 "); var arc=el("b",null,m[2]); tag.appendChild(arc);
        lb.appendChild(tag); lb.appendChild(el("span","rf-q",m[3]));
      });
    }catch(e){}
    return node;
  }

  function chapterNode(cat, subs){
    var ch=el("div","chapter"); ch.id="ch-"+cat.id;
    var head=el("div","chapter-head");
    var seq=Number(cat.sequence);
    head.appendChild(el("div","ch-kicker","Unit "+(seq+1)));
    var h2=el("h2", null, seq===0 ? "Behavioural Strategy Fundamentals" : (cat.title||cat.id));
    head.appendChild(h2);
    var latest = subs && subs.length ? subs[0] : null;
    if(latest){
      var chMeta=el("div","ch-meta");
      var sub=el("div","sub"); var dt=fmtDate(latest.submitted_at);
      var subText = dt ? ("Submitted "+dt) : "";
      sub.textContent = subText;
      if(typeof latest.score==="number"){
        var scoreEl = el("div","lens-score","Score: "+latest.score+" / 100");
        chMeta.appendChild(scoreEl);
      }
      chMeta.appendChild(sub);
      head.appendChild(chMeta);
    }
    ch.appendChild(head);

    if(!latest){
      ch.appendChild(el("div","not-submitted","Not yet submitted."));
    } else {
      var payload = portfolioPayload(latest.payload || {}, cat.id);
      ch.appendChild(el("div","section-label","Reflections"));
      ch.appendChild(styleResponses(renderResponses(payload, cat.id)));
      var fc = detectFiveCommitments(payload);
      if(fc) ch.appendChild(renderFiveCommitmentsPanel(fc));
    }

    var mc = MICRO_CLIMB[cat.id];
    if(latest && mc && mc.length){ ch.appendChild(el("div","section-label","Unit Summary")); ch.appendChild(renderMicroClimb(mc)); }

    // Unit 1 marking sheet, once the facilitator has selected Mark as reviewed.
    if(cat.id==="u1_foundations" && latest && String(latest.review_status||"")==="reviewed" && window.S2R_U1_SHEET){ var u1s=el("div"); ch.appendChild(u1s); window.S2R_U1_SHEET.render(supabaseClient, participantId, latest.cohort_id, u1s, { heading:"Marking Sheet", headingClass:"section-label", sub:false }); }

    if(feedbackOn && latest && latest.facilitator_feedback && String(latest.facilitator_feedback).trim()){
      ch.appendChild(el("div","section-label","Facilitator Feedback"));
      var fb=el("div","feedback-block"); fb.appendChild(el("div","fb-text", String(latest.facilitator_feedback))); ch.appendChild(fb);
    }
    return ch;
  }

  function buildCover(name, cohort){
    var c=el("div","cover");
    c.appendChild(el("div","cv-band"));
    var logo=el("img","cv-logo"); logo.src="/logo.png"; logo.alt="IBSL"; c.appendChild(logo);
    c.appendChild(el("div","wordmark","Strategy2Results\u00ae"));
    c.appendChild(el("h1","","Learning Portfolio"));
    c.appendChild(el("div","cv-rule"));
    c.appendChild(el("div","who", name||"\u2014"));
    var meta=el("div","meta"); meta.textContent=(cohort?("Cohort: "+cohort+"  \u00b7  "):"")+"Generated "+new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"}); c.appendChild(meta);
    c.appendChild(el("div","brand","Institute of Behavioural Strategy & Leadership"));
    return c;
  }
  function buildToc(cats){
    var t=el("div","toc"); t.appendChild(el("h2","","Contents"));
    var ol=el("ol");
    cats.forEach(function(cat){ var seq=Number(cat.sequence); var li=el("li"); var a=el("a"); a.href="#ch-"+cat.id; a.textContent = seq===0?"Unit 1 \u00b7 Behavioural Strategy Fundamentals":("Unit "+(seq+1)+" \u00b7 "+(cat.title||cat.id)); li.appendChild(a); ol.appendChild(li); });
    t.appendChild(ol); return t;
  }

  // ───────────────────────── boot ─────────────────────────
  var viewerIsSelf=false;   // participant viewing their own portfolio
  function boot(){
    if(!participantId){ fatal("Missing participant","This collection link needs a ?participantId=<uuid> parameter."); return; }
    supabaseClient.auth.getSession().then(function(sres){
      var session=sres&&sres.data&&sres.data.session;
      if(!session){ fatal("Not signed in","Sign in to the S2R Portal, then reopen this collection."); return; }
      var uid=session.user.id;
      supabaseClient.from("profiles").select("role").eq("id",uid).maybeSingle().then(function(pr){
        var role=(pr&&pr.data&&pr.data.role)||"";
        // Participant self-view: allowed when (uid === participantId).
        viewerIsSelf=(uid===participantId);
        var allowed=(role==="facilitator"||role==="admin"||viewerIsSelf);
        if(!allowed){ fatal("Access restricted","This collection is viewable by its participant, facilitators and admins only."); return; }
        loadAndRender();
      }, function(){ fatal("Access check failed","Could not verify your role. Please refresh and try again."); });
    }, function(){ fatal("Session error","Could not read your session. Please refresh and try again."); });
  }

  function loadAndRender(){
    var catP=supabaseClient.from("lens_catalog").select("id,unit,module,sequence,title,requires_lens").order("sequence",{ascending:true});
    var subP=supabaseClient.from("submissions").select("lens_id,cohort_id,payload,submitted_at,review_status,facilitator_feedback").eq("profile_id",participantId).order("submitted_at",{ascending:false});
    Promise.all([catP,subP]).then(function(res){
      var cat=res[0], sub=res[1];
      if(cat.error||!cat.data||!cat.data.length){ console.error("[collection] lens_catalog read:",cat.error); fatal("Could not load chapters","The lens catalogue could not be read in this session (this needs a facilitator SELECT policy on lens_catalog). "+(cat.error?cat.error.message:"")); return; }
      if(sub.error){ console.error("[collection] submissions read:",sub.error); fatal("Could not load submissions", sub.error.message||"Read failed."); return; }
      var cats=cat.data; var subs=sub.data||[];
      // group submissions by lens_id (already newest-first)
      var byLens={}; subs.forEach(function(r){ (byLens[r.lens_id]=byLens[r.lens_id]||[]).push(r); });
      var cohortId=null; for(var i=0;i<subs.length;i++){ if(subs[i].cohort_id){ cohortId=subs[i].cohort_id; break; } }
      resolveWho(cohortId).then(function(who){
        var root=document.getElementById("root"); root.innerHTML="";
        root.appendChild(buildCover(who.name, who.cohort));
        root.appendChild(buildToc(cats));
        cats.forEach(function(c){ root.appendChild(chapterNode(c, byLens[c.id]||null)); });
        appendCompetencyProfile(root, cohortId);
      });
    }, function(err){ console.error("[collection] load error:",err); fatal("Could not load","An unexpected error occurred. Please refresh."); });
  }

  // [COMPETENCY] My Competency Profile closes the portfolio. Facilitators have no access to it, so for them nothing is added.
  function appendCompetencyProfile(root, cohortId){
    if(!cohortId) return;
    supabaseClient.rpc("get_competency_profile",{p_cohort_id:cohortId,p_profile_id:participantId}).then(function(r){
      if(!r||r.error||!r.data||!r.data.length) return;
      var esc=function(s){ var d=document.createElement("div"); d.textContent=s==null?"":String(s); return d.innerHTML; };
      var h="<h2>My Competency Profile</h2>";
      var area="", open=false;
      r.data.forEach(function(x){
        if(x.area!==area){ if(open) h+="</table>"; area=x.area; open=true;
          h+="<h3>"+esc(area)+"</h3><table><tr><th>Competency</th><th>Beginning</th><th>Progressive</th><th>Unit mark</th></tr>"; }
        h+="<tr><td>"+esc(x.competency)+"</td><td>"+esc(x.beginning||"")+"</td><td>"+esc(x.progressive||"")+"</td><td>"+(typeof x.unit_mark==="number"?x.unit_mark+" / 100":"")+"</td></tr>";
      });
      if(open) h+="</table>";
      var sec=document.createElement("section"); sec.className="cp-sec"; sec.innerHTML=h;
      root.appendChild(sec);
    },function(){ /* no access: the profile is left out */ });
  }

  // Resolve participant name + cohort name via the dashboard\u2019s RPCs (RLS-safe). Best-effort.
  function resolveWho(cohortId){
    var who={name:null,cohort:null};
    var jobs=[];
    jobs.push(supabaseClient.from("profiles").select("full_name").eq("id",participantId).maybeSingle().then(function(r){ if(r&&r.data&&r.data.full_name) who.name=r.data.full_name; },function(){}));
    jobs.push(supabaseClient.rpc("get_facilitator_cohorts").then(function(r){ if(r&&r.data){ for(var i=0;i<r.data.length;i++){ if(cohortId&&r.data[i].cohort_id===cohortId){ who.cohort=r.data[i].cohort_name; break; } } } },function(){}));
    if(cohortId){ jobs.push(supabaseClient.rpc("get_cohort_participants",{p_cohort_id:cohortId}).then(function(r){ if(r&&r.data){ for(var i=0;i<r.data.length;i++){ var p=r.data[i]; if((p.profile_id||p.id)===participantId&&p.full_name){ who.name=p.full_name; break; } } } },function(){})); }
    if(viewerIsSelf&&cohortId){ jobs.push(supabaseClient.rpc("get_my_capstone",{p_cohort_id:cohortId}).then(function(r){ if(r&&r.data&&r.data.cohort&&r.data.cohort.name&&!who.cohort) who.cohort=r.data.cohort.name; },function(){})); }
    return Promise.all(jobs).then(function(){ return who; });
  }

  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot); else boot();
})();
</script>
