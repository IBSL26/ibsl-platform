<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Competency — S2R® Portal</title>
<meta name="copyright" content="© 2026 Institute of Behavioural Strategy &amp; Leadership. Strategy2Results® and S2R® are trade marks of IBSL. All rights reserved." />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { min-height:100vh; font-family:'Montserrat',sans-serif; background:linear-gradient(160deg,#0d1f15 0%,#1a3a2a 60%,#0f2419 100%); color:rgba(255,255,255,0.85); padding:32px 16px 48px; }
  .wrap { max-width:820px; margin:0 auto; }
  .brand { text-align:center; margin-bottom:18px; }
  .brand img { width:72px; height:auto; }
  .card { background:rgba(255,255,255,0.04); border:1px solid rgba(201,168,76,0.3); border-radius:6px; padding:32px; }
  .kicker { font-size:9px; font-weight:700; letter-spacing:3px; text-transform:uppercase; color:#c9a84c; }
  h1 { font-family:'Cormorant Garamond',Georgia,serif; font-size:2rem; font-weight:400; color:#fff; margin-top:6px; line-height:1.2; }
  h2 { font-family:'Cormorant Garamond',Georgia,serif; font-size:1.45rem; font-weight:500; color:#c9a84c; margin:30px 0 4px; }
  h3 { font-size:14px; font-weight:600; color:#fff; line-height:1.5; }
  p, li { font-size:13px; line-height:1.75; }
  .lead { margin-top:10px; }
  .muted { color:rgba(255,255,255,0.6); }
  .block { padding:18px 0; border-top:1px solid rgba(255,255,255,0.1); }
  .block ul { margin:6px 0 10px 18px; }
  .levels { width:100%; border-collapse:collapse; margin-top:14px; font-size:12px; }
  .levels th, .levels td { text-align:left; vertical-align:top; padding:9px 10px; border-bottom:1px solid rgba(255,255,255,0.1); line-height:1.6; }
  .levels th { font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:#c9a84c; }
  .levels td:first-child { color:#fff; font-weight:600; white-space:nowrap; }
  .choices { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .pill { display:inline-flex; align-items:center; gap:7px; padding:9px 13px; font-size:12px; border:1px solid rgba(201,168,76,0.4); border-radius:4px; cursor:pointer; }
  .pill:has(input:checked), .opt:has(input:checked) { border-color:#c9a84c; background:rgba(201,168,76,0.16); color:#fff; }
  .opt { display:flex; gap:11px; padding:12px 14px; margin-top:8px; font-size:13px; line-height:1.65; border:1px solid rgba(255,255,255,0.16); border-radius:4px; cursor:pointer; }
  .opt input { margin-top:4px; flex:none; }
  textarea { width:100%; min-height:96px; margin-top:10px; padding:11px 12px; font:inherit; font-size:13px; color:#fff; background:rgba(255,255,255,0.06); border:1px solid rgba(201,168,76,0.4); border-radius:4px; }
  .btn { display:inline-block; margin-top:22px; padding:13px 30px; font:inherit; font-size:.78rem; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:#1c1c1c; background:#c9a84c; border:none; border-radius:4px; cursor:pointer; text-decoration:none; }
  .btn[disabled] { opacity:.45; cursor:not-allowed; }
  .link { display:inline-block; margin-top:18px; font-size:12px; color:#c9a84c; }
  .howto { margin-top:16px; padding:14px 16px; border-left:3px solid #c9a84c; background:rgba(201,168,76,0.08); font-size:13px; line-height:1.7; }
  .howto strong { color:#fff; }
  .howto ol { margin:6px 0 0 18px; }
  .ask { margin-top:10px; font-size:12px; font-weight:600; color:#c9a84c; }
  .levelpick .opt strong { color:#fff; }
  .err { margin-top:12px; font-size:12px; color:#ff9d8f; }
  .tbl { width:100%; table-layout:fixed; border-collapse:collapse; margin-top:8px; font-size:13px; }
  .tbl th, .tbl td { text-align:left; vertical-align:top; padding:10px; border-bottom:1px solid rgba(255,255,255,0.1); }
  .tbl th { font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:#c9a84c; }
  .tbl th:first-child { width:40%; } .tbl td.c { color:#fff; }
  .mark { display:block; margin-top:3px; font-size:11px; color:rgba(255,255,255,0.55); }
  footer { text-align:center; font-size:11px; line-height:1.7; color:rgba(255,255,255,0.4); margin-top:24px; }
  @media (max-width:600px) { .card { padding:22px 16px; } .levels td:first-child { white-space:normal; } .tbl { font-size:12px; } .tbl th, .tbl td { padding:9px 6px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><img src="logo.png" alt="IBSL"></div>
  <div class="card" id="card"><p class="muted">Loading…</p></div>
  <footer>© 2026 Institute of Behavioural Strategy &amp; Leadership. Strategy2Results® and S2R® are trade marks of IBSL. All rights reserved.</footer>
</div>
<script src="/s2r-protect.js"></script>
<script src="supabase.umd.js"></script>
<script>
(function () {
  'use strict';
  var sb = supabase.createClient('https://tayrxqbrttlrdowrzobm.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRheXJ4cWJydHRscmRvd3J6b2JtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3ODAyOTUsImV4cCI6MjA5MjM1NjI5NX0.8eaQauK1GPI3OXyHLdRAfbSwLfaYLB3_amHt6FhZxG0', {
    auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: false }
  });
  var q = new URLSearchParams(location.search);
  var view = q.get('view') || 'profile';
  var unit = parseInt(q.get('unit'), 10);
  var ret = q.get('return') || '';
  if (!/^(unit[0-9a-z_]+_[pP]\.html|certificate\.html[?&=a-zA-Z0-9-]*)$/.test(ret)) ret = '';
  var LEVELS = [
    ['Developing', 'I demonstrate some of these skills and am building them into my leadership practice'],
    ['Practising', 'I demonstrate most of these skills consistently in my own area of responsibility'],
    ['Accomplished', 'I demonstrate all of these skills across functions and in complex situations, with visible impact on enterprise results'],
    ['Leading', 'I demonstrate all of these skills, set the standard for them and develop them in other leaders across the organisation']
  ];
  var SCALE = ['Strongly disagree', 'Disagree', 'Neutral', 'Agree', 'Strongly agree'];
  var card = document.getElementById('card');
  var uid = null, cohortId = null;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function fail(msg) { card.innerHTML = '<h1>Competency</h1><p class="lead">' + esc(msg) + '</p><a class="link" href="index.html">Return to portal</a>'; }
  function done(title, msg) {
    var next = ret || 'index.html';
    card.innerHTML = '<h1>' + esc(title) + '</h1><p class="lead">' + esc(msg) + '</p><a class="btn" href="' + esc(next) + '">Continue</a>' +
      '<br><a class="link" href="competency.html">View My Competency Profile</a>';
  }

  function renderSelf(fw) {
    var html = '<div class="kicker">Start of the programme</div><h1>Competency Self-Rating</h1>' +
      '<p class="lead">This framework sets out the 12 competencies you will build through the programme, organised by the DIG Framework: Direction, Influence and Grounding. You complete this once.</p>' +
      '<div class="howto"><strong>How to complete this page</strong><ol><li>Read the competency and its demonstrable skills.</li><li>Select the one proficiency level that best describes you today, based on how many of those skills you demonstrate.</li><li>Repeat for all 12 competencies, then select Save my self-rating at the end of the page.</li></ol></div>' +
      '<table class="levels"><tr><th>Proficiency level</th><th>Description</th></tr>' +
      LEVELS.map(function (l) { return '<tr><td>' + l[0] + '</td><td>' + l[1] + '</td></tr>'; }).join('') + '</table>';
    var area = '';
    fw.forEach(function (c) {
      if (c.area !== area) { area = c.area; html += '<h2>' + esc(area) + '</h2>'; }
      html += '<div class="block"><h3>' + esc(c.name) + '</h3><p class="muted">' + esc(c.narrative) + '</p><p class="ask">Demonstrable skills:</p><ul>' +
        c.skills.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + '</ul><p class="ask">Select your proficiency level:</p><div class="levelpick">' +
        LEVELS.map(function (l, i) { return '<label class="opt"><input type="radio" name="c' + c.unit_no + '" value="' + (i + 1) + '"><span><strong>' + l[0] + ':</strong> ' + l[1] + '</span></label>'; }).join('') +
        '</div></div>';
    });
    html += '<button class="btn" id="go" disabled>Save my self-rating</button><div class="err" id="err"></div>';
    card.innerHTML = html;
    var go = document.getElementById('go');
    function picks() { var o = {}, n = 0; fw.forEach(function (c) { var r = card.querySelector('input[name=c' + c.unit_no + ']:checked'); if (r) { o[c.unit_no] = parseInt(r.value, 10); n++; } }); return { o: o, n: n }; }
    function sync() { var p = picks(); go.disabled = p.n !== fw.length; go.textContent = p.n === fw.length ? 'Save my self-rating' : 'Rated ' + p.n + ' of ' + fw.length; }
    card.addEventListener('change', sync); sync();
    go.onclick = function () {
      go.disabled = true; document.getElementById('err').textContent = '';
      sb.rpc('save_competency_self_ratings', { p_cohort_id: cohortId, p_ratings: picks().o }).then(function (r) {
        if (r.error) { document.getElementById('err').textContent = r.error.message; go.disabled = false; return; }
        done('Self-rating saved', 'Your ratings are now in the Beginning column of My Competency Profile.');
      });
    };
  }

  function renderUnit(f) {
    var scale = function (name) {
      return '<div class="choices">' + SCALE.map(function (s, i) { return '<label class="pill"><input type="radio" name="' + name + '" value="' + (i + 1) + '">' + (i + 1) + ' ' + s + '</label>'; }).join('') + '</div>';
    };
    var html = '<div class="kicker">Unit feedback</div><h1>Unit Feedback: Unit ' + f.unit_no + '</h1>' +
      '<div class="howto"><strong>How to complete this form</strong><ol><li>Answer the three questions about this unit.</li><li>Select Submit at the end of the form. You submit once.</li></ol></div>' +
      '<div class="block"><h3>1. The content was clear.</h3>' + scale('clear') + '</div>' +
      '<div class="block"><h3>2. The facilitator\u2019s delivery helped me learn.</h3>' + scale('delivery') + '</div>' +
      '<div class="block"><h3>3. One thing that would improve this unit.</h3><textarea id="imp" maxlength="2000"></textarea></div>';
    html += '<button class="btn" id="go" disabled>Submit</button><div class="err" id="err"></div>';
    card.innerHTML = html;
    var go = document.getElementById('go'), imp = document.getElementById('imp');
    function val(n) { var r = card.querySelector('input[name=' + n + ']:checked'); return r ? r.value : null; }
    function sync() { go.disabled = !(val('clear') && val('delivery') && imp.value.trim().length >= 3); }
    card.addEventListener('change', sync); imp.addEventListener('input', sync);
    go.onclick = function () {
      go.disabled = true; document.getElementById('err').textContent = '';
      sb.rpc('submit_unit_feedback', { p_cohort_id: cohortId, p_unit_no: f.unit_no, p_content_clear: parseInt(val('clear'), 10), p_delivery_helped: parseInt(val('delivery'), 10),
        p_improvement: imp.value }).then(function (r) {
        if (r.error) { document.getElementById('err').textContent = r.error.message; go.disabled = false; return; }
        done('Feedback received', 'Your feedback for Unit ' + f.unit_no + ' has been submitted.');
      });
    };
  }

  function renderProfile(rows) {
    var html = '<div class="kicker">Strategy2Results®</div><h1>My Competency Profile</h1>' +
      '<p class="lead">Beginning shows your self-rating at the start of the programme. Progressive shows the level your unit reflections evidence, once your facilitator has reviewed them. Unit mark is the score your facilitator gave for the unit.</p>';
    var area = '', open = false;
    rows.forEach(function (r) {
      if (r.area !== area) {
        if (open) html += '</table>';
        area = r.area; open = true;
        html += '<h2>' + esc(area) + '</h2><table class="tbl"><tr><th>Competency</th><th>Beginning</th><th>Progressive</th><th>Unit mark</th></tr>';
      }
      html += '<tr><td class="c">' + esc(r.competency) + '</td><td>' + esc(r.beginning || '') + '</td><td>' + esc(r.progressive || '') + '</td><td>' +
        (typeof r.unit_mark === 'number' ? r.unit_mark + ' / 100' : '') + '</td></tr>';
    });
    if (open) html += '</table>';
    html += '<a class="link" href="index.html">Return to portal</a>';
    card.innerHTML = html;
  }

  sb.auth.getSession().then(function (s) {
    var session = s && s.data && s.data.session;
    if (!session) { location.replace('index.html'); return; }
    uid = session.user.id;
    return sb.from('cohort_memberships').select('cohort_id,joined_at').eq('profile_id', uid).order('joined_at', { ascending: false }).then(function (m) {
      if (m.error || !m.data || !m.data.length) { fail('You are not in a cohort yet.'); return; }
      cohortId = m.data[0].cohort_id;
      return sb.rpc('get_my_competency_state', { p_cohort_id: cohortId }).then(function (st) {
        if (st.error) { fail('This page could not load. Please refresh and try again.'); return; }
        var state = st.data || {};
        if (!state.participant) { fail('This page is for participants.'); return; }
        if (view === 'unit' && !state.self_rated) view = 'self';
        if (view === 'self') {
          if (state.self_rated) { done('Self-rating complete', 'You have already completed your Competency Self-Rating.'); return; }
          return sb.rpc('get_competency_framework').then(function (r) { if (r.error) fail('This page could not load. Please refresh and try again.'); else renderSelf(r.data); });
        }
        if (view === 'unit') {
          if (!(unit >= 1 && unit <= 12)) { fail('Unit not found.'); return; }
          return sb.rpc('get_unit_feedback_form', { p_cohort_id: cohortId, p_unit_no: unit }).then(function (r) {
            if (r.error || !r.data) { fail('This form could not load. Please refresh and try again.'); return; }
            if (r.data.submitted) { done('Already submitted', 'You have already submitted your feedback for Unit ' + unit + '.'); return; }
            if (!r.data.due) { fail('This form opens once Unit ' + unit + ' has been taught.'); return; }
            renderUnit(r.data);
          });
        }
        return sb.rpc('get_competency_profile', { p_cohort_id: cohortId, p_profile_id: uid }).then(function (r) { if (r.error) fail('Your profile could not load. Please refresh and try again.'); else renderProfile(r.data); });
      });
    });
  }).catch(function () { fail('This page could not load. Please refresh and try again.'); });
})();
</script>
</body>
</html>
