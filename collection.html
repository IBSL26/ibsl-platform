  var SB_URL="https://tayrxqbrttlrdowrzobm.supabase.co", SB_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRheXJ4cWJydHRscmRvd3J6b2JtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3ODAyOTUsImV4cCI6MjA5MjM1NjI5NX0.8eaQauK1GPI3OXyHLdRAfbSwLfaYLB3_amHt6FhZxG0";
  if(typeof supabase==="undefined"){ document.getElementById("root").innerHTML="<div class=\"fatal\"><h2>Could not load</h2><p>The Supabase library failed to load. Check your connection and refresh.</p></div>"; return; }
  var supabaseClient=supabase.createClient(SB_URL,SB_ANON,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});

  var MICRO_CLIMB={"u1_foundations":[{"arc":"Awareness — What","t":"What Was Established","body":"Strategy is a human process: people sit on both sides of it, as those who shape it and those who must make it happen.","points":["Behavioural Strategy (S2R® definition): the application of behavioural science to understand and improve how people think, decide and behave throughout the process of strategy, from shaping strategic choices to delivering results.","The behavioural question: traditional strategy asks 'What should we do?'; behavioural strategy asks first how the way we think shapes what we believe we should do, and what will shape how people respond and act.","How we think: the assumptions, mental models and biases that shape what we notice and how we interpret it.","How we decide: the judgements, trade-offs and influences that shape what we choose, prioritise and commit to.","How we behave: how people respond, contribute, coordinate and act, which determines whether commitments reach the intended outcomes.","Dual-process framework (Kahneman): System 1 is fast, automatic, intuitive and pattern-based, vulnerable to bias and dominant under pressure; System 2 is slow, deliberate and analytical, more reliable for complex problems, easily overridden under time pressure and dependent on psychological safety.","Functional bias: the tendency to interpret a strategic issue, and what should be done about it, primarily from the perspective of our own function, expertise or area of responsibility.","The Elephant Perspective: each leader holds a partial truth; strategic quality depends on the organisation's ability to surface partial truths, hold them in tension and integrate them into one understanding of reality.","Cognitive bias: a pattern in our thinking that systematically influences how we interpret information, make judgements and arrive at decisions.","Action-Oriented Biases: Overconfidence, Optimism, Illusion of Control, Planning Fallacy, Confirmation.","Stability Biases: Anchoring, Status Quo, Loss Aversion, Sunk-Cost Fallacy, Endowment Effect.","Interest Biases: Self-Interest, Functional/Silo, Incentive, Career-Risk, Perspective.","Social Biases: Conformity, Authority, Groupthink, Availability, Halo Effect."],"title":"What Was Established"},{"arc":"Intelligence — Why","t":"Why It Matters","body":"Unexamined bias turns one strategy into competing functional priorities, and its cost shows in decisions, delays and lost value.","points":["Biases are systematic, predictable and cumulative; left unmanaged they compromise even technically rigorous strategic frameworks.","The MyHealth case: every executive hears the same strategy through a professional filter (the CFO for financial exposure, the COO for operational feasibility, the CHRO for capability, the CMO for the customer promise); unspoken, these perspectives reshape the strategy.","The White Space: the gap between what individual functions deliver and what the organisation needs those contributions to produce together, where no one function is in charge and where the customer experience, the dependencies and the enterprise outcome come together.","Three-point check: Functional Success (does my 'done' create work or consequences for someone else?), White Space (if my dashboard is green and another part of the system is red, where is the disconnect?), Enterprise Consequence (when all contributions come together, has the enterprise won?).","Disciplined, bias-mitigating decision-making delivers returns approximately 6% higher than peers (McKinsey).","Misallocated Capital: Stability and Action biases (Sunk-Cost, Endowment, Overconfidence, Illusion of Control) keep resources in legacy lines and fuel ego acquisitions.","Strategic Inertia: Stability biases (Anchoring, Status Quo, Loss Aversion) hold the organisation to old models despite visible disruption.","Execution Failure: Action-Oriented biases (Planning Fallacy, Optimism, Confirmation) build plans that ignore internal friction.","Innovation Suppression: Social and Interest biases (Groupthink, Conformity, Career-Risk) filter out transformative ideas and silence dissent.","Purpose Drift: Interest and Social biases (Self-Interest, Incentive, Halo Effect of a quick win) sacrifice long-term intent to short-term pressure."],"title":"Why It Matters"},{"arc":"Extrapolating — Where","t":"Where Bias Appears","body":"Every phase of the strategy journey carries its own biases, and the emotional climate decides whether leaders surface them or defend them.","points":["Bias lives in processes as well as in people, wherever someone must interpret information, imagine options, make a choice or turn intent into action.","Phase 1 Diagnosis (wrong reality enters the strategy): Availability, Anchoring, Confirmation. Scanner: if we stripped out everything we already believed, what would the remaining evidence tell us?","Phase 2 Option Generation (solution space narrowed before debate): Status Quo, Functional/Silo, Career-Risk, Groupthink and Conformity. Scanner: what is the most disruptive option not yet on the table, and why is it not there?","Phase 3 Decision (chosen path flawed or skewed): Overconfidence, Loss Aversion, Authority and Halo Effect, Sunk-Cost and Endowment. Scanner: if the proposer had no stake and no relationship with the team, would we make the same decision?","Phase 4 Execution (strategy decays in delivery): Planning Fallacy, Confirmation, Incentive, Self-Interest and Functional bias. Scanner: how are people interpreting what the strategy means for them, and are their contributions producing the intended enterprise outcome?","Emotional climate as atmospheric pressure: the conditions around people shape their judgement; emotional maturity is regulating your own responses so pressure does not distort how you think, decide or engage, and managing the climate is a fiduciary responsibility of leadership.","Fear-Dominated climate (pressure to protect): driver anxiety and defence; outcome strategic paralysis; threat narrows thinking.","Narcissism-Dominated climate (pressure to validate): driver ego and validation; outcome strategic delusion; thinking becomes one-sided.","Grounded Confidence climate (pressure to examine): driver curiosity and security; outcome strategic agility; thinking stays open.","Emotional alignment: naming the state through which strategy is experienced (Ekman's six emotions: Joy, Sadness, Anger, Fear, Disgust, Surprise), read through five factors: Engagement Energy, Morale Drain, Friction Load, Psychological Safety, Values Alignment.","Seven signals from emotion to evidence: name the emotional state, ask directly, observe behaviour, notice attention, watch energy and challenge, listen to the language, connect emotion to behaviour (Name → Observe → Connect).","Six principles for debiasing strategy: separate ideation from evaluation; name the emotional temperature before the content; assign a designated challenger; use pre-mortem analysis as standard; make the reference class visible; create after-action protocols."],"title":"Where Bias Appears"},{"arc":"Integration — Collective","t":"What Was Built","body":"The quality of strategy execution is a direct function of the quality of the thinking environment: the conditions under which thinking happens.","points":["Integration moves the leadership team from functional silos to an enterprise-wide perspective, from defending the part to designing the whole, trading individual opinion for collective intelligence.","Pillar 1 Cognitive Integration: build a single version of the truth by requiring every function to explain how its information affects the others (the stress test).","Pillar 2 Behavioural Guardrails: build friction into decisions so the loudest or fastest voice does not win by default (the Challenge Clock).","Pillar 3 Emotional Stabilisation: move the team from defensiveness to curiosity, with leaders admitting they do not have all the answers (naming the feeling).","In the strategy room: 72-Hour Pre-Read Mandate (Anchoring); Rotating Neutral Facilitation (Authority Bias, Groupthink); Blind Ideation (Conformity, Halo Effect); the Challenge Clock (the action-oriented rush); Silent Deliberation (Availability).","In leadership culture: Public Cognitive Humility (Overconfidence); Behavioural 360s (Self-Interest, Perspective); Debiasing Coaching (System 1 dominance); Safety Metrics (Innovation Suppression, Career-Risk); Strategic Post-Mortems (Hindsight Bias)."],"title":"What Was Built"},{"arc":"Application — In Practice","t":"What You Applied","body":"You assessed your own bias profile, and your group set out the challenge it will address through the Capstone.","points":["Self Reflection Bias Assessment: five areas scored out of 100 (A1 I Know My Biases, A2 I Manage My Emotional Impact, A3 I Build Psychological Safety, A4 I Use Process to Protect Quality, A5 I Treat People as the Strategy); the area where you are most exposed is your development priority.","Problem Charter: your group's simulated company and executive team; the strategy redesign trigger (the one internal or external change that means the current strategy no longer delivers); the challenges in strategy design, strategy execution and sustaining performance; how they manifest; their consequences for results; the three challenges chosen per area; and the central problem statement.","The Problem Charter is Section 1 of your team's Capstone S2R® Blueprint, and every later unit builds on its problem statement."],"title":"What You Applied"}],"u2m1_lens1":[{"arc":"Awareness — What","t":"What Was Established","body":"A strategy becomes usable when its architecture sets the choices, its intent states the ambition and its Success in Practice describes the reality the enterprise must produce.","points":["Strategy (S2R® definition): the output of iterative thinking, logic and process to determine what, why, how and when an organisation creates, delivers and sustains value to its stakeholders while navigating the forces within its operating environment.","Strategy Architecture: the interconnected choices and logic beneath a strategy; each concept in the definition is part of it.","Output: a tangible, expressible, decided position.","Iterative: a hypothesis that loops: form, test against reality, revise, repeat.","Thinking & Logic: thinking explores options; logic tests what must be true for the strategy to hold. Both are needed, in that order.","Process: the structured container that sets who is involved, what inputs are used and what is decided at each stage.","WHAT · WHY · HOW · WHEN: WHAT sets the domain, WHY the differentiating logic, HOW the operating model, WHEN the timing and sequencing.","Creates · Delivers · Sustains (the Value Triad): value is created, reaches its intended recipients and is kept durable; all three layers are designed explicitly.","Stakeholders: customers, employees, investors, communities, regulators and partners.","Navigating: the deliberate reading of forces and the choice of how to move in response, continuously.","The Forces: competitive, macro-environmental, disruptive, social and environmental, and internal.","Operating Environment: the bounded context of industry, economy, regulation, technology, social context and physical environment.","Strategy Intent Statement: WHAT, WHY, HOW and WHEN brought forward from the architecture and crystallised into one crisp, directional statement; the directional anchor for choices, alignment and execution.","Success in Practice (SiP): what must be seen, experienced and executed for the intent to become reality within a time horizon. It answers: 'If our Strategy Intent is successful, what should we see in practice?'","The four SiP domains: D1 Customer Experience & Value; D2 Operational Capability & Execution Rhythm; D3 People & Culture Dynamics; D4 Enterprise Value Creation.","SiP describes observable reality. Initiatives, projects and activities stay out of it."],"title":"What Was Established"},{"arc":"Intelligence — Why","t":"Why It Matters","body":"Once agreed, the Strategy Intent tests every initiative for strategic fit and Success in Practice tests it for strategic contribution.","points":["Strategic Alignment: the Intent anchors leaders to the same WHAT, WHY, HOW and WHEN; SiP gives one shared picture of the organisational reality they are working towards.","Decision Filter: the Intent tests whether a choice is consistent with the strategic ambition; SiP tests whether it contributes to the conditions of success.","Execution Coherence: the Intent anchors how each function reads its mandate; SiP shows what the combined contributions must produce across customer value, operational capability, people and culture, and enterprise value."],"title":"Why It Matters"},{"arc":"Extrapolating — Where","t":"Where Success Shows Up","body":"A credible picture of success shows observable evidence in every domain and holds the four domains in balance.","points":["Observable indicators: each indicator is read in two positions, When Working and Signal of Absence.","D1 indicators (the CARE Model): Connection, Access, Results and Effort Value.","D2 indicators: Priority Clarity, Decision Flow, Cross-Functional Coordination, Delivery Rhythm.","D3 indicators: Cross-Boundary Collaboration, Ownership Culture, Strategic Alignment, Dialogue Quality.","D4 indicators: Growth Trajectory, Profitability Quality, Market Position, Value Durability.","SiP Flammables: the balance test, showing when one perspective defines success for the whole organisation.","Customer Only: the customer promise outruns execution capacity.","Operations Only: the machine improves while its purpose drifts.","People Only: culture work loses its link to commercial outcomes.","Value Only: metrics are met while the conditions that produce them weaken.","Two disciplines: depth within each SiP domain and balance across all four."],"title":"Where Success Shows Up"},{"arc":"Integration — Collective","t":"What Was Shown","body":"Kestrel Point Services was taken through the three connected outputs, each built from the one before it.","points":["The 14 elements are answered in the order of the definition, one question each, in one or two sentences carrying the actual strategic choice.","Five headings: Strategic Position (WHAT, WHY); Strategic Model (HOW, WHEN); Value Architecture (Creates, Delivers, Sustains, Stakeholders); Strategic Navigation (Operating Environment, The Forces, Navigating); Strategy Discipline (Thinking & Logic, Iterative, Process).","Architecture test: 'What is this architecture collectively saying about our organisation's strategy?'","Strategy Intent deduction: WHAT gives the ambition, WHY the reason it holds together, HOW the mechanism, WHEN the order. Test: 'Does this statement faithfully express the strategic ambition contained in our Architecture?'","Success in Practice: each domain answers what will be experienced differently and what evidence will show it; four statements are tested for depth and balance and drawn together into one Success in Practice statement."],"title":"What Was Shown"},{"arc":"Application — In Practice","t":"What Was Built","body":"Your group built the three outputs for its own simulated company and carried them into the Capstone S2R® Blueprint.","points":["Strategy Architecture: the 14 elements answered against your group's Charter problem statement.","Strategy Intent Statement: your group's ambition deduced from WHAT, WHY, HOW and WHEN.","Success in Practice: the four domain statements and the one Success in Practice statement.","The Architecture provides the logic, the Intent crystallises the ambition and SiP makes the ambition observable; together they are the foundations every later unit builds on."],"title":"What Was Built"}],"u2m1_lens2":[{"arc":"Awareness — What","t":"What Was Established","body":"KISS reads the organisation against its Success in Practice; OKRs turn that reading into measurable commitments.","points":["The translation question: if the Success in Practice we described is the future organisation, what must change in the organisation today to make that future possible?","KEEP: protect the practices, capabilities and behaviours already moving the organisation towards the SiP.","IMPROVE: strengthen areas moving in the right direction where performance, coordination or capability must grow.","START: introduce the practices, capabilities or initiatives the SiP requires that do not yet exist.","STOP: eliminate the activities, routines or commitments that consume energy and resources without contributing to the SiP.","Critical principle: every KISS reflection is anchored to the SiP statements.","Objectives: define strategic ambition; qualitative, ambitious, action-oriented, inspirational and memorable.","Key Results: define measurable progress through the formula Verb of Change + Metric + From X to Y + By Deadline.","Critical distinction: OKRs define outcomes; anything that can be checked off a task list is an activity that supports a Key Result.","Step 1 Find Themes: read each domain's SiP statement with its Improve and Start entries and name the one shift they point to (Stop entries are acted on directly; Keep entries are protected); output: four themes, one per SiP domain.","Step 2 Inspiring Objectives: turn each theme into a bold, qualitative statement of the transformation, starting with a verb.","Step 3 Define Key Results: two or three measurable results per Objective, each following the formula.","Step 4 Alignment Test: does it move the organisation closer to the shared SiP; would fellow leaders see it as a win for the whole organisation; does it visibly improve culture, operations or value creation; is accountability clear?","Step 5 Prioritisation Matrix: each OKR placed by Impact and Effort; Strategic Catalysts, Accelerated Enablers and Core Strategic Drivers carry the highest leverage, Resource Pitfalls consume energy without strategic value."],"title":"What Was Established"},{"arc":"Intelligence — Why","t":"Why It Matters","body":"Objectives and Key Results hold when they rest on an honest assessment of what to keep, improve, start and stop.","points":["Moving straight from vision to targets produces three human problems: Disconnected Targets (numbers set without acknowledging the hurdles), Fragmented Efforts (functions pulling in different directions) and the Activity Trap (measuring busyness in place of outcomes).","The Strategy2Results® sequence: Success in Practice (where the organisation wants to be) → KISS (the honest bridge from present reality to that future) → OKRs (the measurable steps that prove movement).","When the sequence is respected, OKRs become a way for the organisation to learn, align and prove progress."],"title":"Why It Matters"},{"arc":"Extrapolating — Where","t":"Where OKR Hot Zones Appear","body":"Enterprise OKRs emerge when leaders recognise their functional emphasis and balance it across the four Success in Practice domains.","points":["Natural emphasis: commercial leaders lean to Customer and Enterprise Value; operational leaders to Operations and Enterprise Value; people leaders to People & Culture and Operations; financial leaders to Enterprise Value and Operations.","Four execution risks: competing definitions of success, fragmented measurement systems, functional optimisation that stalls enterprise progress, and slow decisions from misaligned incentives, all created when emphasis goes unexamined.","Typical hot zone: the point where a role's natural emphasis distorts the OKRs it proposes. Alignment question: the question that brings the role back to the enterprise.","CEO: Objectives become visionary and insufficiently grounded in capability. CFO: Key Results become overly financial. COO: Objectives drift towards operational optimisation. CHRO: culture initiatives lack a link to enterprise results. CTO/CIO: Key Results become technology delivery milestones.","CMO: Objectives promise perception beyond what the organisation can deliver. CCO: Key Results prioritise sales over the customer experience system. CPO: cost optimisation at the expense of strategic capability. CRO: defensive safeguards slow strategic movement. CSO: Objectives strong in concept and disconnected from operational ownership.","Naming natural biases explicitly shifts the conversation from functional interpretation of success to collective definition of success."],"title":"Where OKR Hot Zones Appear"},{"arc":"Integration — Collective","t":"What Was Practised","body":"Strategic imagination becomes executable once each objective clears the tests of operating reality and measurable change.","points":["Strategy Airport, Gate 1 Baggage Check: for a medical health company's SiP, deciding what to keep, improve, start and stop.","Strategy Airport, Gate 2 Flight Plan: converting one KISS theme into one Objective, two Key Results and the contributing roles."],"title":"What Was Practised"},{"arc":"Application — In Practice","t":"What Was Built","body":"Your group translated its own Success in Practice into a KISS map and then into OKRs, carried into the Capstone S2R® Blueprint.","points":["KISS map: the four SiP domains read against Keep, Improve, Start and Stop.","Four themes, one per SiP domain.","Four OKRs: each theme turned into an Objective with its Key Results and contributing roles, tested against the four alignment questions.","Prioritisation: the four OKRs placed on the Impact–Effort matrix to show where to move first.","Your OKRs trace back through the KISS map to Success in Practice, giving the enterprise one measurable trajectory."],"title":"What Was Built"}],"u2m1_lens3":[{"arc":"Awareness — What","t":"What Was Established","body":"An Objective is strategically sound when the conditions it depends on hold at each of the four checkpoints.","points":["ABCV interrogates whether an agreed direction is sound enough to carry into execution; an OKR can be clear, measurable and ambitious and still rest on untested assumptions.","MBT (Must-Be-True): the specific condition that must remain true for an Objective to survive; one is named at each checkpoint for each Objective, creating an early-warning system.","A — Arena (Customer End Game): what the customer is ultimately trying to achieve. The industry tells you who you think you compete with; the Arena tells you who you actually compete with.","Three depths of the Customer End Game: Functional (what they are trying to achieve), Experiential (what matters about how they achieve it: speed, convenience, reliability, safety, flexibility, simplicity, confidence, accessibility, effort) and Consequential (what achieving it ultimately enables).","B — Boundaries (Friction Architecture): the conditions that could materially slow, restrict or prevent delivery of the end game: regulatory, operational, technological, structural, financial and behavioural.","Three kinds of boundary: one we must accept, one we can influence, and one we created ourselves, which our own organisation can change.","C — Competition (the True Landscape): who or what else can enable the customer to achieve the same end game; alternatives include doing it internally, doing it themselves, using technology, postponing, choosing a different solution or doing nothing.","V — Value Proposition (Coherent Advantage): why the customer should choose the value we create, given the alternatives.","Three tests of the Value Proposition: Relevant (it matters in the end game) + Distinctive (credible alternatives cannot make the same claim) + Deliverable (the organisation can produce it consistently) = Strategic Value.","MBT questions: Arena — what must remain true about customer need, behaviour or demand; Boundaries — what must remain true operationally, structurally or regulatorily; Competition — what must remain true about our advantage relative to the alternatives; Value Proposition — what must remain true about our value architecture for it to stay relevant, distinctive and economically sustainable.","What the test secures: priorities anchored in customer reality, designed to withstand constraints, positioned accurately against the competitive landscape and coherent with the organisation's core value."],"title":"What Was Established"},{"arc":"Intelligence — Why","t":"Why It Matters","body":"Defining the market by customer outcomes widens the field of competition leaders see and test.","points":["The Industry Illusion: the industry we understand becomes the boundary of the world we examine.","Familiarity ('We know this industry'): we interpret the future through patterns established by the past.","Exclusion ('We discount what doesn't fit it'): signals outside the industry frame are seen and then underestimated.","Complacency ('We become confident in the world we can see'): evidence of current success becomes reassurance about future relevance.","The Industry Illusion Game (Apex University) tested each of the three traps against a Board's strategic choices."],"title":"Why It Matters"},{"arc":"Extrapolating — Where","t":"Where Integrity Breaks Down","body":"Each executive brings a predictable blind spot; collective review covers the checkpoints any one function overlooks.","points":["CEO overlooks Boundaries: vision without friction-mapping stalls in execution.","CFO overlooks Arena: revenue can hold while the underlying customer end game shifts.","COO overlooks Competition: efficiency accelerates the organisation in the wrong direction if alternatives serve the customer better.","CHRO overlooks Competition: an engaged team building capability for yesterday's contest.","CTO overlooks Value Proposition: a delivered system the customer does not value is not adopted.","CMO overlooks Boundaries: demand the organisation cannot fulfil becomes brand erosion.","CCO overlooks Value Proposition: winning the wrong business dilutes distinctiveness.","CPO overlooks Arena: savings unconnected to the customer end game do not become strategic progress.","CSO overlooks Boundaries: strategies coherent in design break repeatedly in execution."],"title":"Where Integrity Breaks Down"},{"arc":"Integration — Collective","t":"What Was Shown","body":"Strategic failures were traced to the illusion that hid them and the checkpoint where it sat, and one Objective was stress-tested through all four checkpoints.","points":["Cause of Death: each failure scenario answers one investigation question that reveals an illusion (Familiarity, Exclusion or Complacency) and sits at one ABCV checkpoint.","Worked example: one Objective taken through Arena (its functional, experiential and consequential need), Boundaries, Competition and Value Proposition, with a Must-Be-True condition named at each step."],"title":"What Was Shown"},{"arc":"Application — In Practice","t":"What Was Built","body":"Your group stress-tested its own Objectives and assigned accountability for the conditions they depend on, carried into the Capstone S2R® Blueprint.","points":["Integrity Table: each Objective from Unit 3 taken through the four checkpoints with its Must-Be-True conditions.","Critical Conditions: for each Objective, in Prioritisation Matrix order, the one condition whose failure would cost the impact it was ranked for.","Accountability Assignment: the executive accountable for verifying each critical condition, the evidence that confirms it holds and the date of the first check."],"title":"What Was Built"}],"u3m1_lens4":[{"arc":"Awareness — What","t":"What Was Established","body":"Strategy enters an organisation through people: it is interpreted through thinking, experienced through feeling, converted through deciding and delivered through behaving.","points":["Two human filters: Cognition (Mind), how people interpret what the strategy means; Emotion (Heart), how they experience it. Together they decide clarity or confusion, commitment or compliance, momentum or hesitation.","Principle 1, Strategy Moves Through People: Interpretation → Experience → Choices → Actions → Results; when any link is weak, execution leaks.","Principle 2, Misalignment Fragments Effort: Chinese Whispers (intent mutates as it travels), Clarification Debt (leadership time spent re-explaining) and Silent Disengagement (outward compliance, inward withdrawal).","Principle 3, Alignment Must Be Designed: the OCEAVL Assessment and the Emotional Climate Assessment (Joy, Sadness, Anger, Fear, Disgust, Surprise) make interpretation and climate visible.","Principle 4, Human Reactions Are Predictable: the SCARF Model names the five social threats that provoke resistance.","Principle 5, Execution Must Be Visible in Behaviour: ACE-IT defines five observable behaviours (Accountability, Commitment, Engagement, Integrity, Transparency).","Change management: the leadership discipline of moving people from current practice to the practice the strategy requires.","The event and the transition: a change is announced on a date; the transition is what each person goes through to adopt it, and leaders who decided earlier are further through it than those who hear it on the day.","The 4 Checks: Mind (they understand the change, why it matters and what they do differently), Heart (they want it to succeed), Hands (they are able to do it), Habit (it has become the way they work). Industry parallel: Prosci ADKAR®.","Why the order matters: each check depends on the one before; a change stalls at the first check it fails, and that check is where effort belongs.","The leader's four jobs: Mind, 3S, Explain; Heart, SCARF, Involve; Hands, STAT, Equip; Habit, ACE-IT, Reinforce.","3S Check (Mind): Shift (what stops, what starts, for whom, from when), Stake (what we gain if we change and what we lose if we stay as we are), Step (each person's own part, in the first person, small enough to do next week).","SCARF (Heart): Status (will this reduce my importance?), Certainty (do I know what success looks like?), Autonomy (am I losing control of my work?), Relatedness (do I still belong here?), Fairness (is this being applied equitably?), each with its counter.","STAT Check (Hands): Skill (practised ability to do the new work), Time (capacity, with old work taken away), Authority (a stated decision limit), Tools (systems and resources that fit the new practice). One missing element is enough to stop people.","ACE-IT (Habit): Accountability (one named owner per practice), Commitment (the practice holds under pressure), Engagement (problems raised while they can be fixed), Integrity (slips reported), Transparency (results visible)."],"title":"What Was Established"},{"arc":"Intelligence — Why","t":"Why It Matters","body":"Execution ignites when people move from compliance to genuine adoption of the change.","points":["Potential and kinetic energy: the Objectives and Key Results hold potential energy; it becomes kinetic energy at the ignition point, when a person decides 'This matters to me, and I will put my effort into making it succeed.'","Compliance (Mind only): people act because authority requires it; progress needs supervision and fades when attention moves. Mechanical and brittle.","Commitment (Mind and Heart): people act because they understand the Objectives, believe they matter and own their part; progress continues without leaders present. Self-driven and resilient.","Installed: the new system, structure or measure exists; it delivers cost. Adopted: people work the new way every day without being watched; it delivers value.","The adoption gap: the time between installed and adopted, when two ways of working run, leaders spend more time checking and the counted benefits are not earned.","Three steps from installed to adopted: 1 name the practice and every group that must adopt it; 2 take each group through Mind, Heart and Hands, starting at the first check not yet passed; 3 reinforce with ACE-IT until the practice holds through a full review period without you."],"title":"Why It Matters"},{"arc":"Extrapolating — Where","t":"Where the Leadership Team Stands","body":"The OCEAVL Assessment gives the leadership team a reflection of the behavioural profile it brings to the strategy, and a guardrail for strategic risk.","points":["Seven dimensions: Openness, Conscientiousness, Extraversion, Agreeableness, Emotional Stability, Values Alignment, Learning Orientation.","Levels: 4–5 High, 3 Balanced, 1–2 Low; every level carries a strategic risk, a response and routines that keep it in check.","Your own profile stays on your page; the team's level on each dimension is the level held by most members, shown in the Capstone."],"title":"Where the Leadership Team Stands"},{"arc":"Integration — Collective","t":"What Was Built","body":"A leadership team that reads the strategy as one and speaks with one voice operates as a single leadership system.","points":["Collective Intelligence: direction stays clear across all layers, resources reinforce priorities, systems enable execution and people move with coordinated effort.","Four commitments of one voice: One message (protects Mind: the same Shift, Stake and Step from every leader); One example (protects Heart: leaders show the ACE-IT behaviours first); One sequence (protects Hands: changes landing on the same group are pooled, ordered and paced); One owner (protects Habit: one named leader answers for adoption).","One-Voice Contribution: the part of the shared reading only your role can supply. Alignment Hot Zone: the one element of 3S, SCARF, STAT or ACE-IT where your role is most likely to lose people.","Hot zones by role: CEO Shift; CFO Transparency; COO Time; CHRO Skill; CTO/CIO Tools; CMO Engagement; CCO Fairness; CPO Authority; CRO Autonomy; CSO Stake."],"title":"What Was Built"},{"arc":"Application — In Practice","t":"What Was Built","body":"Your group built the case for the change its strategy asks of people, carried into the Capstone S2R® Blueprint.","points":["3S Check: your group's Shift, Stake and Step for the strategy, drawn from the Start and Stop lists confirmed in Unit 3.","ACE-IT: the two OCEAVL dimensions on which your team carries the highest risk, the response to each, and the leadership behaviours your team commits to."],"title":"What Was Built"}],"u3m1_lens5":[{"arc":"Awareness — What","t":"What Was Established","body":"Performance management connects enterprise results to the contributions of people and the conditions the organisation provides.","points":["The design sequence: 1 define success; 2 design how performance will be managed (the conversations, decisions, actions and accountability that respond to the evidence); 3 identify the evidence those decisions require; 4 use the evidence to recognise contribution, correct constraints and improve delivery.","Enterprise performance is the combined result of individual and collective contributions, supported by the organisational conditions required to deliver them.","Human Operating System: whether individuals and teams deliver their expected results, through two dimensions: performance against KPIs and objectives, and performance against behavioural expectations.","Organisational Operating System, read through ESRG: Environment · FIT (Facilities, Infrastructure, Technology); Systems · SIP (Standardisation, Integration, Process Efficiency); Resources · AIR (Asset Availability, Investment, Resource Utilisation); Governance · PAR (Policies & Procedures, Authority, Risk Management).","The two systems are interdependent: the same shortfall may come from a human performance gap, an organisational constraint or both, and each calls for a different management response.","The Enterprise Performance Principle: two connected lines of accountability, Human Performance (KPIs, OKRs and behavioural expectations) and Organisational Performance (ESRG effectiveness), both visible, measured, reviewed and managed.","S2R® Contribution Map™: identifies the interconnected contributions required from business functions, individuals and teams, and organisational conditions to achieve enterprise results.","Contribution Map logic: Step 1 OKR (what must the organisation achieve?); Step 2 Required Functional Contributions (what must each function deliver?); Step 3 Human and Organisational Contributions (what people must deliver and what the organisation must enable for each function).","FACES, five functions of an integrated EPM system, each applied to people and to organisational performance: F Foster a Results Culture; A Align Performance; C Create Measurement Transparency; E Embed Shared Accountability; S Support Continuous Development.","The Contribution Map sets what must be delivered and enabled; FACES sets the management disciplines that keep those commitments delivered."],"title":"What Was Established"},{"arc":"Intelligence — Why","t":"Why It Matters","body":"Performance management bridges strategy and execution when it builds commitment to results.","points":["Bridge 1 Decomposing the Big Picture: connecting strategic outcomes to actionable performance expectations.","Bridge 2 Defining the Logic of Success: establishing how successful performance is understood and evaluated.","Bridge 3 Calibrating the Rhythm: keeping progress visible early enough for leaders to influence the outcome.","Bridge 4 Structuring the Dialogue: converting performance evidence into decisions and action.","Compliance-driven architecture: ensures minimum standards and corrects deviations; the leader holds accountability; tone of assessment; performance management done to the individual.","Commitment-driven architecture: generates shared ownership and continuous improvement; the team co-owns accountability; tone of inquiry; performance management done with the individual.","Commitment strengthens accountability when employees answer for their contributions and leaders answer equally for the enabling conditions within their authority.","Performance scorecard categories: Strategy (OKRs; 30–50% at senior levels; reviewed quarterly), Operational (KPIs; 30–50%; monthly or fortnightly), Behavioural (values and leadership behaviours; 20–40%; bi-annually through 360° feedback).","Developing a scorecard: start from the Key Results, add the Operational KPIs, add the Behavioural measures, weight the three to 100%, and make it transparent. A CEO's scorecard carries a higher Strategy weight than a frontline role's."],"title":"Why It Matters"},{"arc":"Extrapolating — Where","t":"Where Performance Management Becomes Vulnerable","body":"Executive perspectives on performance converge when performance management becomes continuous, developmental and team-based.","points":["Unity in Diversity: integrating different executive performance perspectives (what they notice, prioritise and how they interpret evidence) into one understanding of enterprise progress.","Executive performance blind spots: CEO accepts positive functional reports without testing the combined outcome; CFO reads cost containment as success while capability weakens; COO concentrates on efficiency and output; CHRO on individual achievement while conditions constrain delivery; CIO/CTO reports technical performance without business enablement.","CMO reads campaign results as success without delivery capability; CCO prioritises sales volumes over delivery capacity and profitability; CPO prioritises savings over supplier quality and lead times; CRO concentrates on control compliance over timely execution; CSO on milestones and reported alignment over actual outcomes.","Three shifts in practice: from annual to continuous; from rating-centric to development-centric; from individual to team performance."],"title":"Where Performance Management Becomes Vulnerable"},{"arc":"Integration — Collective","t":"What Was Shown","body":"One worked example mapped the contributions a Key Result requires and showed how FACES manages them.","points":["Contribution Map worked example: improving customer service, with each function's required contribution, people performance and organisational conditions.","FACES applied across four functions (Customer Service, IT, Operations, HR / Workforce Planning), separating human performance gaps from organisational constraints."],"title":"What Was Shown"},{"arc":"Application — In Practice","t":"What Was Built","body":"Your group built three connected components of its Enterprise Performance Management System, carried into the Capstone S2R® Blueprint.","points":["S2R® Contribution Map™: one Key Result and the two key business functions it depends on, each with its contribution, people performance and organisational conditions.","FACES application: how each FACES element is applied to the two functions.","CEO Performance Scorecard: the Strategy, Operational and Behavioural measures on which the CEO is assessed, and the weight of each."],"title":"What Was Built"}],"u3m1_lens6":[{"arc":"Awareness — What","t":"What Was Established","body":"An expectation becomes owned when it is clear, realistic and accepted by the person who delivers it, with the conditions the organisation provides, at every level from the Key Result to the individual.","points":["Setting expectations: a top-down declaration where the target is communicated and assigned; the KPI becomes a metric to be monitored and enabling conditions are assumed.","Establishing expectations: a leadership alignment process where the result is defined and ownership secured through structured dialogue; the KPI becomes a personal leadership promise and enabling conditions are agreed with the owners of ESRG.","The Delivery Line: Level 1 Key Result (owned by the accountable executive) → Level 2 function contribution (owned by the function leader) → Level 3 KPI (owned by the person who delivers it). A KPI that cannot be traced back to a Key Result has lost its line of sight.","Human expectations describe the result, contribution, standard, timing and behaviours people take responsibility for; organisational expectations specify the Environment, Systems, Resources and Governance the organisation will provide. Both are agreed at every level.","Clarity: shared understanding of the strategic contribution, performance expectation, standard, behaviours and evidence, and of what ESRG must provide. Test: the person describes success as you do.","Capability: people have the competence, capacity, readiness and coordination; the organisation's ESRG is fit for the required performance; every significant gap has what must be resolved, by whom, by when and the interim arrangement.","Commitment: the individual consciously accepts delivery, behaviours, reporting, raising risks early and corrective action; enabling leaders accept providing resources, resolving constraints and deciding on time. Together this is mutual accountability.","The Expectations Chain: the people with whom expectations must be established for a contribution to succeed: Upline (those who authorise, resource or enable), Downline (those who perform the work), Crossline (those whose contributions are interdependent).","The Delivery Line names the owner at each level; the Expectations Chain maps the relationships each owner depends on. A Contribution Map establishes a dependency; the Expectations Chain establishes what the people responsible must agree.","The Alignment Dialogue: 'On a scale of 1–10, how aligned are you with the expectation for you to deliver this outcome?' tests what the person will deliver and what the organisation must enable; below 9, Commitment is not yet established.","Score → Evaluate → Resolve: 9–10 proceed and document; 7–8 partial alignment, surface what is unresolved; 5–6 significant concerns; below 5 the expectation must be redesigned. Resolve asks: 'What would help move your alignment to a 9 or 10?'","GROW coaching model (Whitmore): Goal at Score It, Reality at Evaluate It, Options and Will at Resolve It.","The Expectation Architecture: Step 1 build the Delivery Line; Step 2 map the Expectations Chain; Step 3 hold the Alignment Dialogue until each owner reaches a 9 or 10."],"title":"What Was Established"},{"arc":"Intelligence — Why","t":"Why It Matters","body":"Expectations established through dialogue turn assigned targets into owned commitments at every level of the Delivery Line.","points":["Compliance-driven response: expectations acknowledged and not owned; people wait for direction, escalate problems and own activities ('I completed everything that was asked of me').","Commitment-driven response: expectations owned; people anticipate risks, coordinate across functions and own the outcome ('I'll make sure this gets delivered').","Five mechanisms: from instruction to ownership; reducing interpretation ambiguity; surfacing constraints before execution begins; strengthening accountability; building the behavioural foundation.","First casualty, Engagement: discretionary effort is withheld, people wait for direction and coordination slows; work happens and energy is not invested.","Second casualty, Accountability: performance discussions turn to explanations and constraints, and accountability disperses until no team is fully accountable. The Delivery Line prevents this by naming one owner at each level."],"title":"Why It Matters"},{"arc":"Extrapolating — Where","t":"Where the Expectations Gap Emerges","body":"An expectation placed on another function without its enabling promise is an alignment gap.","points":["CEO: strategic direction is clear, and ownership of the conditions for delivery is assumed to cascade.","CFO: the finance number is clear; ownership of delivering it is not.","COO: process compliance is achieved; outcome ownership is not.","CHRO: people feel culturally aligned and may lack clear delivery commitments.","CTO/CIO: the technical milestone is clear; the business owner's commitment to use it is not established.","CMO: the campaign target is clear; operational and commercial ownership of enabling it is not confirmed.","CCO: the commercial target is understood; operational capacity to deliver it sustainably is not confirmed.","CPO: supplier expectations are clear; internal expectations for converting supplier performance into value are not.","CRO: the governance rule is understood; ownership of risk-aware behaviour remains procedural.","CSO: the strategic plan is clear; operational leaders' daily ownership of it is assumed.","Each role has a likely Expectations Chain of Upline, Downline and Crossline contributors it depends on."],"title":"Where the Expectations Gap Emerges"},{"arc":"Integration — Collective","t":"What Was Practised","body":"You prepared an Alignment Dialogue with your board chair on a Key Result the chair disagreed with.","points":["The dialogue moved through Goal, Reality, Options and Will, ending with the actions agreed and the chair's alignment confirmed at a 10."],"title":"What Was Practised"},{"arc":"Application — In Practice","t":"What Was Built","body":"Your group established expectations on one Key Result through one contributing function, carried into the Capstone S2R® Blueprint.","points":["Delivery Line: an owner at each level, from the Key Result to the function contribution to the KPI.","Expectations Chain: the Upline, Downline and Crossline people with whom expectations are established on the Key Result, the function contribution and the KPI.","Alignment Dialogue with the board chair: conducted as a group to move the chair to a 10."],"title":"What Was Built"}],"u3m2_lens7":[{"arc":"Awareness — What","t":"What Was Established","body":"Performance measurement makes execution visible, and leaders use the Review–Realign–Restore cycle to turn what it shows into recovery.","points":["The Execution Visibility Infrastructure: the discipline that shows whether the organisation is moving closer to its Success in Practice, moving leaders from activity visibility to progress visibility.","From activity to progress: the question moves from 'What work was done?' to 'What changed because of the work?'; for people, from 'How busy are our people?' to 'What has their work changed in the Key Result?'; for the organisation, from 'Has the support been put in place?' to 'Does the support enable the individuals' tasks to move the Key Result?'","Purpose 01 Creates Visibility: where KPIs and organisational conditions gain momentum and where they stall.","Purpose 02 Establishes Accountability: every component of the goal is tracked and delivery recorded as evidence, for individuals and for the conditions leaders undertook to provide.","Purpose 03 Execution Intelligence: each review answers what progress was achieved, what obstacles prevent more and what adjustment will restore momentum.","Purpose 04 Enables Timely Correction: early signals allow intervention while progress is still recoverable.","Review–Realign–Restore Cycle (R3), applied to people and organisational performance: Review establishes execution reality along the Delivery Line; Realign diagnoses and addresses a gap (only when one is found); Restore rebuilds momentum through corrective actions, reaffirmed responsibilities, follow-up dates and an updated alignment state.","The Accountability Loop: diagnosing the source of a gap, run through GROW, with the goal of restored ownership.","Root Cause A, Lack of Accountability: the task is understood and the motivational connection lost. Recovery: reconnect purpose and ownership.","Root Cause B, Lack of Skill: the person is committed and lacks capability. Recovery: coaching, peer support, training or an adjusted timeline, with no added pressure.","Root Cause C, Misfit of Role or Structural Constraint: strengths and responsibilities do not match. Recovery: redistribute the task, adjust responsibilities or reposition, in a separate role conversation.","The correct root cause determines the correct recovery; pressure does not solve a skill gap, and coaching does not solve a structural misfit.","WARD, the Key Result's vital check-up: W Waypoints (the dates it is checked and the level it must reach by each); A Alert (how far off a waypoint before a red flag); R Recovery (the corrective action for individuals and conditions); D Decider (the executive who decides the recovery and sees it through)."],"title":"What Was Established"},{"arc":"Intelligence — Why","t":"Why It Matters","body":"Review discipline sustains execution momentum; when it weakens, warning signals, accountability, learning and credibility weaken with it.","points":["Execution velocity: the rate at which an organisation converts strategic intent into measurable results. Performance measurement provides the evidence; review discipline converts it into timely decisions.","Consequence 01 Early Warning Signals Are Missed: falling evidence quality, drifting alignment and migrating effort lead a missed KPI by weeks; weakening conditions show only through the people working around them.","Consequence 02 Gradual Diffusion of Accountability: KPIs absent from reviews are managed for appearance; commitments on organisational conditions diffuse first, and mutual accountability becomes one-sided.","Consequence 03 Loss of Organisational Learning: practices that accelerate progress, recurring capability gaps and constraints that repeat across reviews go unrecorded, so the next strategy is set on the same conditions.","Consequence 04 Erodes Leadership Credibility: priorities that fade, standards applied unevenly and leaders' own commitments left unreviewed show accountability running one way."],"title":"Why It Matters"},{"arc":"Extrapolating — Where","t":"Where Measurement Breaks Down","body":"Performance measurement is a leadership conversation discipline, and it fractures in how leaders review and interpret the measures.","points":["Fracture 01 The Horizontal Coordination Gap: reviews happen inside functions, so hand-offs and cross-functional conditions are never examined. Closed by cross-functional executive reviews.","Fracture 02 The Evidence Quality Gap: narrative, activity or asserted conditions replace verifiable evidence, and reviews become debates about the data.","Fracture 03 The Review Rhythm Breakdown: irregular reviews turn measurement into a reporting event, and conditions are reviewed more slowly than the KPIs they support.","Fracture 04 The Learning Suppression Gap: reviews that only judge make people defend, and condition failures in senior leaders' areas go unexamined. The question shifts to 'What is the system teaching us about how execution actually works?'","CXO gap contributors: CEO (Rhythm, Learning Suppression); CFO (Evidence, Learning Suppression); COO (Horizontal Coordination); CHRO (Evidence, Rhythm); CTO/CIO (Evidence, Horizontal); CMO (Evidence, Horizontal); CCO (Horizontal, Learning Suppression); CPO (Horizontal, Evidence); CRO (Learning Suppression, Rhythm); CSO (Rhythm, Learning Suppression)."],"title":"Where Measurement Breaks Down"},{"arc":"Integration — Collective","t":"What Was Shown","body":"The executive team applies the Review–Realign–Restore Cycle together through the Enterprise Performance Intelligence Circle.","points":["EPIC in four steps: 1 bring the results (each executive's Key Results and KPIs with evidence); 2 Review (the three signals: where Key Results stand, what is starting to break, what execution is teaching); 3 Realign (the root cause for people through the Accountability Loop, the condition and its owner for the organisation); 4 Restore (recovery, owner and report-back date, returning to EPIC until the gap closes).","Worked EPIC review: a Key Result gap traced to a people gap and an organisational gap, each with its recovery.","Accountability Loop role play: the leader runs the conversation through GROW and identifies the root cause; the observer records it."],"title":"What Was Shown"},{"arc":"Application — In Practice","t":"What Was Built","body":"Your group set the measurement discipline for its own Key Result, carried into the Capstone S2R® Blueprint.","points":["WARD: the waypoints, alert, recovery and decider for the Key Result mapped in Unit 6.","EPIC: a lagging KPI serving that Key Result taken through the Review–Realign–Restore Cycle and the Accountability Loop."],"title":"What Was Built"}],"u3m2_lens8":[{"arc":"Awareness — What","t":"What Was Established","body":"A strategic clog sits where people or organisational conditions block the flow from intent to execution, and the Clog Trace locates it.","points":["Strategic Clog: an internal blockage that prevents strategic intent from flowing into real-world execution. Strategy sets the destination; flow determines whether you have the power to arrive.","Every clog interferes with ABCV Directional Integrity, through Arena, Boundaries, Competition or Value Proposition.","Clogs form where the strategy stretches today's organisation beyond what it was designed to carry; they show in people performance (decisions wait, tasks complete while the KPI holds still) and in organisational performance (conditions no longer support the individuals' tasks).","Clog 01 Structural Misfit (Boundaries): the organisational design no longer supports the work. Are results constrained by how responsibilities, authority and work are organised?","Clog 02 Capability Gaps (Arena): the organisation lacks the capabilities its chosen arena requires. Does it possess and deploy them?","Clog 03 Decision Bottlenecks (Boundaries): decision rights, delegation or approvals prevent decisions at the right level and speed. Are decisions made by the right people, with the authority, information and speed needed?","Clog 04 Misaligned Metrics & Incentives (Value Proposition): measures and rewards reinforce activity that does not reflect the intended value. Are people rewarded for contributions that produce it?","Clog 05 Cultural Resistance (Value Proposition): norms and everyday practices do not support the required behaviours. Which beliefs and norms reinforce or obstruct the strategy?","Clog 06 Technology / Infrastructure Lag (Competition): technology and infrastructure are not reliable, integrated or scalable enough. Can they support the speed, reliability, visibility and scale required?","Clog 07 Leadership Avoidance (Arena + Boundaries): leaders fail to resolve material trade-offs and repeated underperformance. Are leaders making and following through on the decisions that remove constraints?","Each clog is read through its organisational condition, its effect on people, observable patterns, early warning signals and strategic impact.","The Clog Trace: 1 Performance outcome (the Key Result, actual result and gap); 2 Performance behaviour (what people are doing or unable to do that produces the gap); 3 Performance condition (the clog that causes or sustains the behaviour). The clog is confirmed when the condition explains the behaviour and the behaviour explains the gap.","The trace keeps people accountable for what is within their control and holds the organisation accountable for the conditions it provides; it runs in the Review step whenever a Key Result shows a gap."],"title":"What Was Established"},{"arc":"Intelligence — Why","t":"Why It Matters","body":"Clogs compound, so leaders clear them through early identification, accurate classification and targeted intervention.","points":["Discipline 1 Early Identification: signal literacy, reading the rhythm of work for friction before it shows in results.","Discipline 2 Accurate Classification: name the clog from the Clog Trace evidence before acting; where several act together, name the primary clog whose removal releases the others.","Discipline 3 Targeted Intervention: match the lever to the root cause, name what will change, who changes it and the evidence that will show the clog clearing; the lever that changes the condition usually comes first.","The leadership rhythm: Identify the Clog → Select the Lever → Targeted Intervention.","Lever 01 Standardise (ensure consistency): Structural Misfit, Misaligned Metrics & Incentives, Technology / Infrastructure Lag.","Lever 02 Streamline (increase speed): Decision Bottlenecks, Structural Misfit.","Lever 03 Clarify (eliminate confusion): Decision Bottlenecks, Structural Misfit, Leadership Avoidance.","Lever 04 Upgrade (remove bottlenecks): Technology / Infrastructure Lag, Capability Gaps.","Lever 05 Reinforce (strengthen behaviour): Capability Gaps, Cultural Resistance.","Lever 06 Realign (focus on results): Misaligned Metrics & Incentives.","Lever 07 Rebuild Trust (restore credibility): Cultural Resistance, Leadership Avoidance."],"title":"Why It Matters"},{"arc":"Extrapolating — Where","t":"Where Clogs Originate","body":"A clog can form when a decision or practice in one executive function creates difficulties for people working elsewhere.","points":["CEO: postponed priority trade-offs (Leadership Avoidance).","CFO: senior approvals for routine expenditure (Decision Bottlenecks).","COO: separate departmental responsibilities for end-to-end work (Structural Misfit).","CHRO and CCO and CPO: measures and rewards that pull effort away from shared outcomes (Misaligned Metrics & Incentives).","CTO/CIO: systems that cannot carry the strategy's demands (Technology / Infrastructure Lag).","CMO and CSO: arrangements that leave cross-functional work without one owner (Structural Misfit).","CRO: controls positioned too far from routine decisions (Decision Bottlenecks)."],"title":"Where Clogs Originate"},{"arc":"Integration — Collective","t":"What Was Shown","body":"Normalising the unclog makes early detection and removal of performance constraints part of how the executive team operates.","points":["Collective leadership principle: every executive makes emerging friction visible, and the leaders who control the contributing conditions act together, with clear individual ownership.","The Unclogging Cycle: REVIEW (the Clog Trace confirms the gap, the evidence and the clog); REALIGN (what must change, who acts together under one coordinating executive, and what is agreed for people and organisational performance); RESTORE (activate the levers, with owners, dates and evidence).","Worked example: one clog taken through Review, Realign and Restore into the Unclogging Record."],"title":"What Was Shown"},{"arc":"Application — In Practice","t":"What Was Built","body":"Your group ran the Unclogging Cycle on its own lagging KPI, carried into the Capstone S2R® Blueprint.","points":["Review: the Clog Trace on the lagging KPI from Unit 8, identifying the strategy clog.","Lever: the Strategic Unclogging Lever that clears it.","Realign and Restore: the agreed ownership, changes and recovery."],"title":"What Was Built"}],"u4m1_lens9":[{"arc":"Awareness — What","t":"What Was Established","body":"Each Objective depends on specific organisational capabilities, and ESRG names them domain by domain.","points":["ESRG Alignment grounds performance at the level of the Objective: before demand arrives, leaders specify what each component must provide for the Objective to be delivered.","Strategic Unclogging works at the Key Result, when a result is slowing in EPIC, and asks what is blocking it and how to clear it. ESRG Alignment works at the Objective, at the annual ESRG review and when an Objective is approved, launched or scaled, and asks whether operating conditions can carry the commitment and where capability must be built.","The two disciplines feed each other: a shortfall traced to a condition becomes a component to score and strengthen; recurring clogs in one component show a capability gap; a low-scoring component shows where clogs are likely to form.","Environment · FIT: Facilities (functional and suited to the planned activity), Infrastructure (utilities and connectivity carry operational demand), Technology (available, reliable and fit). Are our facilities, infrastructure and technology fit for the strategic requirement?","Systems · SIP: Standardisation (processes defined and consistently applied), Integration (hand-offs connect across functions), Process Efficiency (output without unnecessary steps, delay or waste). Are our processes standardised, integrated and efficient?","Resources · AIR: Asset Availability (productive assets sufficient for the output), Investment (financial provision adequate), Resource Utilisation (assets and funding used productively against priorities). Are our assets and financial resources sufficient and effectively utilised?","Governance · PAR: Policies & Procedures (established and suitable), Authority (decision rights and approval pathways support timely decisions), Risk Management (material risks identified, assessed, mitigated and monitored). Is our governance up to PAR?"],"title":"What Was Established"},{"arc":"Intelligence — Why","t":"Why It Matters","body":"Each ESRG domain enables execution through one capability, and the executive team reads those capabilities together through convergence, divergence and dependency.","points":["The ESRG Ignition Point: reached when operating conditions can meet the performance demands of the strategy.","Environment enables Operational Readiness; Systems enables Operational Flow; Resources enables Delivery Capacity; Governance enables Decision Responsiveness.","Functional Intelligence reads Convergence (functions score a component alike) and calls for Coordinate: one shared response under one accountable executive.","Cross-Functional Intelligence reads Divergence (functions score the same component differently) and calls for Reconcile: test the evidence behind each score and agree the actual requirement.","Enterprise Intelligence reads Dependency (one function relies on a capability another supplies) and calls for Align: agree the shared requirement, the order of action and what each function commits to the other."],"title":"Why It Matters"},{"arc":"Extrapolating — Where","t":"Where Bias Distorts Capability","body":"Executive decisions shape operating conditions, and a portfolio's bias enters through an approval, investment, sourcing or design choice.","points":["Each CXO card shows the decision where the bias enters, the ESRG component it weakens, the capability affected and the debiasing action that protects it.","CEO Strategic Optimism; CFO Short-Term Cost Preference; COO Standardisation Fixation; CHRO People-Centred Attribution; CTO/CIO Legacy Loyalty.","CMO Brand-Led Investment; CCO Revenue Prioritisation; CPO Consolidation Efficiency; CRO Compliance Framing; CSO Planning Optimism.","Current performance does not by itself demonstrate readiness for future strategic demands."],"title":"Where Bias Distorts Capability"},{"arc":"Integration — Collective","t":"What Was Shown","body":"A worked example of the annual ESRG review showed how collective ESRG intelligence is built in three steps.","points":["Step 1: each function scores the 12 components for the Objective in its Functional ESRG Performance Scanner, from evidence of how policies, systems and plans perform in practice.","Step 2: the executive team consolidates the functional scans.","Step 3: the ESRG Alignment Key reads each capability for convergence, divergence and dependency and records the Collective Intelligence Response and the executive functions that carry it.","A difference in ratings does not by itself prove misalignment, and a shared low rating does not by itself prove a shared root cause; executive dialogue validates both."],"title":"What Was Shown"},{"arc":"Application — In Practice","t":"What You Applied","body":"In the Enterprise ESRG Alignment Clinic your group carried out its company's annual ESRG review, carried into the Capstone S2R® Blueprint.","points":["Each member scored the 12 components for the function they lead: one score per component per function.","The consolidated scan built the enterprise view from those scores.","ESRG Alignment Key: for each execution-enabling capability, what the scores show, your Collective Intelligence Response and the executive functions that carry it."],"title":"What You Applied"}],"u4m1_lens10":[{"arc":"Awareness — What","t":"What Was Established","body":"Values establish the principles that guide behaviour, culture reflects how those principles become established ways of working, and organisational health reveals how effectively they are lived.","points":["Organisational values: the fundamental principles that guide how an organisation conducts itself; they establish behavioural expectations and provide a basis for accountability, and influence conduct only when expressed as observable behavioural standards.","Organisational culture: the system of shared behavioural norms that determines how people conduct themselves and work together.","The Cultural Operating Code: Value → Norm (the expected behaviour) → Demonstrable behaviours, so every leader applies the same standard.","Anatomy of a norm: the value; the definition (one line on what it means here); the norm (three actions whose first letters form a short acronym); the norm statement (one sentence on the norm in daily practice).","What makes the Code real: Demonstrable, Assessed (in 360-degree feedback), Enforced (regardless of seniority), Maintained. It is embedded in recruitment and onboarding, meetings and decision forums, recognition and promotion, career development and leadership development.","Three tests for every norm: the New Employee Test, the Pressure Test and the Mirror Test.","Organisational health: the condition that results from how effectively values are lived within the culture.","The Five Observable Health Traits: Minimal Politics, Minimal Confusion, High Morale, High Productivity, Low Turnover.","The Organisational Health Pyramid: Trust → Experiences → Beliefs → Actions → Results (the visible traits). A weak trait is strengthened at the layer where the weakness starts.","The Code acts on the experiences layer; a weak health trait points to a norm that is missing, unclear or inconsistently applied.","Vulnerable health signals: territorial behaviour and withheld information (Politics); conflicting instructions (Confusion); withdrawal and reduced initiative (Morale); missed commitments and less discretionary effort (Productivity); rising voluntary departures (Turnover).","The Organisational Health Thermometer: 20 statements, four per trait, rated 1 (Never) to 5 (Always); each trait out of 20 and the total out of 100. 80–100 Healthy & Thriving; 60–79 Stable but Uneven; 40–59 Caution Zone; 20–39 Unhealthy.","Functional Trait Score = sum of individual trait totals ÷ number of valid responses; the five trait scores add to the Functional Health Score out of 100. Responses are confidential and executives see function-level results only."],"title":"What Was Established"},{"arc":"Intelligence — Why","t":"Why It Matters","body":"Organisational health multiplies how effectively and how fast strategy execution capability converts into results, and sustains that momentum over time.","points":["The Multiplier Effect acts on Strategic Direction, Execution Accountability, Performance Management, Enterprise Collaboration and Organisational Adaptability, and sets execution velocity.","Sustained performance depends on values embedded in everyday practice, which reduces dependence on constant intervention.","Hidden costs by weakened trait: Minimal Confusion → Lost Time; High Productivity → Employee Disengagement; Minimal Politics → Declining Trust; High Morale → Emotional Fatigue; Low Turnover → Talent Loss.","Each hidden cost can be quantified from organisational data (hours lost × hourly cost, absence days, replacement costs) to direct leadership attention, adjusting for overlap to avoid double counting."],"title":"Why It Matters"},{"arc":"Extrapolating — Where","t":"Where the Signals Show","body":"Each executive reads organisational health through the signals their function encounters, and debiasing techniques establish an evidence-based assessment.","points":["Functional bias in health diagnosis: an executive's professional perspective shapes how health signals are interpreted, risking an incomplete or inaccurate diagnosis.","Debiasing techniques include: test across levels; examine employee experiences; separate effort from conditions; examine retention quality; examine reinforced norms; trace expectations and experiences; test lived expectations; triangulate evidence.","Further techniques: challenge the assumption; test use, not availability; separate activity from contribution; look beyond the message; examine competing incentives; examine how results are achieved; test applied understanding; test for silence; separate compliance from commitment; verify understanding."],"title":"Where the Signals Show"},{"arc":"Integration — Collective","t":"What Was Shown","body":"The Thermometer shows the condition of health in each function; the Cultural Operating Code is the lever that strengthens it.","points":["Conducting the Health Thermometer: Step 1 the thermometer results; Step 2 quantifying the loss; Step 3 the consolidated picture across functions.","The IBSL Cultural Operating Code: each value translated into a norm with its demonstrable behaviours, tested against the three tests."],"title":"What Was Shown"},{"arc":"Application — In Practice","t":"What You Applied","body":"Your group built your company's Cultural Operating Code, carried into the Capstone S2R® Blueprint.","points":["Each of your company's values translated into a norm, with three actions, a norm statement and demonstrable behaviours."],"title":"What You Applied"}],"u4m2_lens11":[{"arc":"Awareness — What","t":"What Was Established","body":"Performance Gravity pulls achieved results back towards average. The Three Lines of Sight show where that pull is acting, and the four KISS decisions hold the result against it.","points":["Achieving a result and holding it are two separate leadership tasks.","Performance Gravity: the pull that draws achieved results back towards average, working quietly while the conditions and behaviours that produced them weaken underneath.","Sustaining performance: the leadership discipline of seeing that pull early and responding to it every cycle.","Strategic line of sight: is the Key Result still moving towards its Success in Practice? Read through the Key Result against its WARD waypoint (Unit 8).","Operational line of sight: are the organisational conditions still enabling the people's tasks? Read through the ESRG scan: Operational Readiness, Operational Flow, Delivery Capacity and Decision Responsiveness (Unit 10).","Behavioural line of sight: are people still delivering the agreed behaviours? Read through the Organisational Health Thermometer: the functional health score and the five traits (Unit 11).","WARD filters each line: Strategic (waypoint the Key Result level for the quarter; alert more than the agreed margin below it); Operational (waypoint each capability Aligned at 4.0–5.0; alert a capability below 3.0); Behavioural (waypoint Healthy & Thriving at 80–100; alert below 60). Each has its recovery and the same Decider.","KISS, the four sustaining decisions at every quarter close: Keep (protect what produces reliable results), Improve (recalibrate what is starting to work less well while the gap is a signal), Stop (eliminate what consumes energy without commensurate value), Start (introduce the capability the next level of performance needs).","KISS is made on each line of sight: what to keep, improve, stop and start on the strategic, operational and behavioural lines.","The Performance Sustaining Key (PSK): the output of every quarter close, bringing together for each line the result, its waypoint and alert, whether an alert was raised, the recovery and Decider check, and the KISS decisions for next quarter with their owners."],"title":"What Was Established"},{"arc":"Intelligence — Why","t":"Why It Matters","body":"Performance drifts through a different mechanism on each line of sight, and each KISS decision counters one of them.","points":["Strategic line, Momentum Illusion: the market moves after the strategy is set while the organisation keeps running the approach that worked. Countered by Keep what still earns the result and Start what the moved market requires.","Operational line, Complexity Creep: structural responses to each change accumulate until the organisation is slowed by them. Countered by Stop structures built for conditions that no longer exist and Improve conditions beginning to constrain delivery.","Behavioural line, Execution Regression: old habits pull behaviour back once attention moves. Countered by Keep the agreed behaviours under leadership attention and Improve behaviours that have started to slip.","Execution Regression weakens the response on the other two lines, because the routines that detect drift are the first to loosen."],"title":"Why It Matters"},{"arc":"Extrapolating — Where","t":"Where Drift Shows First","body":"Drift surfaces first in the executive domain closest to it; each executive reads one line first and usually leads one KISS decision.","points":["CEO (Strategic): priorities interpreted differently; Keep priorities clear, Stop competing initiatives.","CFO (Operational): strategic initiatives underfunded; Stop legacy spending, Start strategic funding.","COO (Operational and Behavioural): reviews shortened or postponed; Keep the review rhythm, Improve escalation discipline.","CHRO (Behavioural): less willingness to raise problems; Keep the agreed behaviours, Improve their reinforcement.","CTO/CIO (Operational): manual workarounds; Improve constraining systems, Start needed capability.","CMO (Strategic): outdated customer insight; Start renewed intelligence, Stop campaigns on the old view.","CCO (Strategic and Behavioural): pipeline without revenue; Improve conversion, Keep commercial discipline.","CPO (Operational): declining supplier reliability; Improve supplier arrangements, Stop cost-only sourcing.","CRO (Strategic): risk questions governance does not yet address; Start risk input into strategic decisions, Improve risk reporting.","CSO (all three lines): OKRs drifting from strategic objectives; Keep the line from strategy to OKRs, Improve how the three lines are read in reviews."],"title":"Where Drift Shows First"},{"arc":"Integration — Collective","t":"What Was Shown","body":"One worked example followed the Section 1 logic through a quarter close.","points":["Step 1 WARD: each line of sight read against its waypoint and alert, with the recovery and Decider.","Step 2 KISS: the Keep, Improve, Stop and Start decisions on each line.","Step 3 PSK: one table bringing WARD and KISS together per line of sight."],"title":"What Was Shown"},{"arc":"Application — In Practice","t":"What You Applied","body":"Your group closed a quarter for its own Key Result and built its Performance Sustaining Key, carried into the Capstone S2R® Blueprint.","points":["Step 1 WARD on the three lines of sight, from your group's results in Units 8, 10 and 11.","Step 2 KISS decisions on each line.","Step 3 your group's PSK."],"title":"What You Applied"}]};
