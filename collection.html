 results.<\/p><\/div>"},"u3m1_lens6":{"html":"<div class=\"usum\" data-unit=\"7\" data-title=\"ESTABLISHING PERFORMANCE EXPECTATIONS\"><div class=\"usum-comp\"><div class=\"usum-comp-l\">COMPETENCE DEVELOPED<\/div><div class=\"usum-comp-n\">Accountability and Expectation Setting<\/div><p>The competent leader establishes jointly owned expectations and secures commitment across functions. Dependencies and enabling conditions are agreed, so that delivery has clear ownership.<\/p><\/div><h2>Demonstrable skills<\/h2><ol type=\"1\"><li>Establish expectations through clarity, capability and commitment<\/li><li>Map the Expectations Chain and the enabling promises it depends on<\/li><li>Conduct an Alignment Dialogue using the GROW model<\/li><\/ol><h2>The unit concept<\/h2><p>A performance target becomes either an instruction people comply with or a commitment people own. The difference lies between setting expectations and establishing them. Execution begins when the people responsible for a result internalise the expectation and accept ownership of it. Expectations are established along one Delivery Line, from the Key Result to the function contribution to each KPI, with one owner at each level. At every level, three conditions must hold (Clarity, Capability and Commitment) for people performance and for the organisational conditions that enable it. The Expectations Chain names everyone with whom expectations must be agreed, and the Alignment Dialogue tests whether each owner has moved from instruction to commitment. Where this step is skipped, engagement and accountability are the first casualties.<\/p><h2>1. Setting and establishing expectations<\/h2><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Dimension<\/strong><\/th><th><strong>Setting expectations<\/strong><\/th><th><strong>Establishing expectations<\/strong><\/th><\/tr><\/thead><tbody><tr><td>Approach<\/td><td>Top-down declaration; target communicated and assigned<\/td><td>Leadership alignment process; result defined and ownership secured<\/td><\/tr><tr><td>Focus<\/td><td>Clarity of instruction<\/td><td>Mutual readiness for execution<\/td><\/tr><tr><td>Dialogue<\/td><td>Limited; understanding is assumed to equal commitment<\/td><td>Structured; tests feasibility, surfaces constraints, secures commitment<\/td><\/tr><tr><td>Execution dynamic<\/td><td>Compliance-driven; cautious behaviour, upward escalation<\/td><td>Commitment-driven; initiative, early risk surfacing, problem-solving<\/td><\/tr><tr><td>Result<\/td><td>KPI as a metric to be monitored<\/td><td>KPI as a personal leadership promise<\/td><\/tr><tr><td>Enabling conditions<\/td><td>Assumed to be in place<\/td><td>Agreed with the owners of Environment, Systems, Resources and Governance<\/td><\/tr><tr><td>Accountability<\/td><td>Conditional; defensive ownership<\/td><td>Personal; proactive ownership of the outcome<\/td><\/tr><\/tbody><\/table><\/div><p>An expectation that has only been assigned remains a proposed expectation until its owner and the relevant enabling owners have confirmed what delivery requires.<\/p><h2>2. The Delivery Line<\/h2><p>The line along which a Key Result is delivered, with one owner at each level:<\/p><ul><li><strong>Level 1 · Key Result:<\/strong> what the organisation must achieve. Owned by the executive accountable for it.<\/li><li><strong>Level 2 · Function contribution:<\/strong> what one function must deliver towards the Key Result. Owned by the leader of that function.<\/li><li><strong>Level 3 · KPI:<\/strong> what each person must deliver towards the function's contribution. Owned by the person who delivers it.<\/li><\/ul><p>Each KPI is that person's contribution to the function's contribution, and through it to the Key Result. A KPI that cannot be traced back to a Key Result has lost its line of sight to the strategy. At every level, both <strong>human expectations<\/strong> (the result, contribution, standard, timing and behaviours people take responsibility for) and <strong>organisational expectations<\/strong> (the Environment, Systems, Resources and Governance the organisation will provide or resolve) must be explicitly agreed.<\/p><h2>3. The three conditions of established expectations<\/h2><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Condition<\/strong><\/th><th><strong>Leadership question<\/strong><\/th><th><strong>People performance<\/strong><\/th><th><strong>Organisational performance<\/strong><\/th><th><strong>Established when<\/strong><\/th><\/tr><\/thead><tbody><tr><td>Clarity<\/td><td>Does everyone understand what is expected, why it matters and what successful delivery requires?<\/td><td>Strategic contribution, performance expectation, performance standard, behavioural expectations and the evidence of success<\/td><td>What Environment, Systems, Resources and Governance must support delivery<\/td><td>The parties share the same understanding of the contribution and the conditions required. Test: someone describes success for their Key Result the same way you do<\/td><\/tr><tr><td>Capability<\/td><td>Can the people and the organisation realistically deliver what is expected?<\/td><td>Competence, capacity, readiness and coordination with the colleagues who affect the result<\/td><td>Whether the environment, systems, resources and governance are fit, standardised, available and responsive. Every significant gap gets what must be resolved, who is accountable, by when, and the interim arrangement<\/td><td>Human abilities and organisational conditions are confirmed, or gaps have accountable resolution arrangements<\/td><\/tr><tr><td>Commitment<\/td><td>Have the people responsible consciously accepted their responsibilities for delivering and enabling the result?<\/td><td>Delivering the contribution and standard, showing the behaviours, providing reliable evidence, raising risks early and correcting within their authority<\/td><td>Enabling leaders provide agreed resources, resolve constraints, decide on time and remove barriers<\/td><td>The relevant parties have consciously accepted their responsibilities. An alignment score below 9 means Commitment is not yet established<\/td><\/tr><\/tbody><\/table><\/div><p>Commitment creates mutual accountability: individuals own their performance commitments; organisational leaders own the conditions they have undertaken to provide.<\/p><h2>4. The Expectations Chain<\/h2><p>Very few results are achieved by one person alone. The Expectations Chain uses the Contribution Map to identify everyone whose work directly affects delivery, and answers: with whom must performance expectations be established for each contribution to succeed?<\/p><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Direction<\/strong><\/th><th><strong>Who<\/strong><\/th><th><strong>What must be established<\/strong><\/th><th><strong>Key question<\/strong><\/th><\/tr><\/thead><tbody><tr><td>↑ Upline<\/td><td>Those who authorise, resource or enable delivery (executives, board, sponsors, budget holders)<\/td><td>Decisions, support, approvals and removal of constraints<\/td><td>Who must approve or resource this outcome for delivery to be possible?<\/td><\/tr><tr><td>↓ Downline<\/td><td>Those who perform the work (direct reports, project teams)<\/td><td>Results, standards, behaviours and evidence of performance<\/td><td>Who must deliver specific activities for this outcome to be achieved?<\/td><\/tr><tr><td>↔︎ Crossline<\/td><td>Those whose contributions are interdependent (peer and shared service functions, suppliers, partners, vendors)<\/td><td>Handovers, coordination, shared responsibilities and delivery commitments<\/td><td>Whose contributions must connect with this one for the outcome to be delivered?<\/td><\/tr><\/tbody><\/table><\/div><p>The Delivery Line gives each level of the result its owner; the Expectations Chain maps the relationships each owner depends on. The Contribution Map establishes a dependency; the Expectations Chain establishes what must be agreed between the people responsible for it. An expectation placed on another function without its enabling promise is an alignment gap.<\/p><h2>5. The Alignment Dialogue<\/h2><p>A structured conversation held at each level of the Delivery Line that tests two questions together: \"What contribution will you deliver?\" and \"What must the organisation enable for you to deliver it?\" The leader asks: \"On a scale of 1–10, how aligned are you with the expectation for you to deliver this outcome?\" A score of 9 or 10 indicates genuine ownership. A lower score is data: something is unresolved between the expectation and the person's readiness to own it.<\/p><ul><li><strong>Score It:<\/strong> 9–10, proceed and document the commitment; 7–8, partial alignment, evaluate; 5–6, significant concerns, evaluate; below 5, the expectation is not viable and must be redesigned.<\/li><li><strong>Evaluate It:<\/strong> understand what is preventing full alignment (\"What influenced the score you gave?\", \"What feels unclear?\", \"Where do you anticipate obstacles?\"). Common concerns: unclear success criteria, unconfirmed dependencies, capacity or resource constraints, confidence in the pathway or timeline. Separate a clarity gap, a skill or commitment gap, and a constraint in organisational conditions.<\/li><li><strong>Resolve It:<\/strong> \"What would help move your alignment from where it is now to a 9 or 10?\" Clarify the outcome, adjust priorities or timelines, add support, confirm collaboration across the chain, then ask the alignment question again.<\/li><\/ul><p>After the dialogue, record the alignment rating, the primary concern identified and the action for elevation, with a resolution owner and review date.<\/p><h2>6. The GROW coaching model<\/h2><p>GROW (popularised by Sir John Whitmore, Coaching for Performance) is how the leader coaches inside the dialogue. The individual does the thinking, so the answers are their own.<\/p><ul><li><strong>Goal<\/strong> (at Score It): ownership of the expectation, an alignment score of 9 or 10. \"What would a 9 or 10 look like for you on this outcome?\"<\/li><li><strong>Reality<\/strong> (Evaluate It): what is true today, explored without defending the expectation. \"What concerns do you have about delivering this outcome?\"<\/li><li><strong>Options<\/strong> (opens Resolve It): the individual's ideas first, then the leader's. \"What would help move your alignment to a 9 or 10?\"<\/li><li><strong>Will<\/strong> (closes Resolve It): what will be done and by whom, then the alignment question again. \"What will you do, and what do you need me to do?\"<\/li><\/ul><h2>7. The Expectation Architecture<\/h2><p>Three steps, starting from the Success in Practice statement the Key Result serves:<\/p><ol type=\"1\"><li><strong>Build the Delivery Line:<\/strong> the Key Result, the function contribution and its KPI, with the owner at each level.<\/li><li><strong>Map the Expectations Chain:<\/strong> the Upline, Downline and Crossline around the function contribution, and what must be established with each.<\/li><li><strong>Hold the Alignment Dialogue:<\/strong> test Clarity, Capability and Commitment with each owner until each reaches a 9 or 10.<\/li><\/ol><p>The result: one Delivery Line from a Key Result to the individual, with every level owned.<\/p><h2>8. Compliance and commitment: the execution dynamic<\/h2><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Dimension<\/strong><\/th><th><strong>Compliance-driven<\/strong><\/th><th><strong>Commitment-driven<\/strong><\/th><\/tr><\/thead><tbody><tr><td>How it looks<\/td><td>Expectations acknowledged but not owned<\/td><td>Expectations established through dialogue and owned<\/td><\/tr><tr><td>Behaviour<\/td><td>Wait for direction; escalate problems; focus on reporting<\/td><td>Anticipate risks; coordinate across functions; solve obstacles<\/td><\/tr><tr><td>When obstacles arise<\/td><td>Defer resolution to leadership<\/td><td>Surface issues early and co-design solutions<\/td><\/tr><tr><td>Accountability<\/td><td>Activity ownership<\/td><td>Outcome ownership<\/td><\/tr><tr><td>Energy<\/td><td>Discretionary effort withheld<\/td><td>Discretionary effort freely given<\/td><\/tr><tr><td>How it sounds<\/td><td>\"I completed everything that was asked of me.\"<\/td><td>\"I'll make sure this gets delivered.\"<\/td><\/tr><\/tbody><\/table><\/div><p>Compliance emerges when people are held accountable for results while essential conditions remain outside their control. Commitment strengthens when leaders visibly fulfil their side of the agreement.<\/p><h2>9. Five mechanisms: why expectation alignment determines outcomes<\/h2><ol type=\"1\"><li><strong>From instruction to ownership:<\/strong> structured dialogue moves the individual from acknowledging a requirement to accepting ownership of the result.<\/li><li><strong>Reducing interpretation ambiguity:<\/strong> a shared interpretation of what must be delivered, why it matters and how success will be recognised.<\/li><li><strong>Surfacing constraints before execution:<\/strong> resources, dependencies and risks become visible before they become crises.<\/li><li><strong>Strengthening accountability:<\/strong> clear, achievable and meaningful expectations turn accountability from a formal obligation into a shared commitment.<\/li><li><strong>Building the behavioural foundation:<\/strong> people are psychologically prepared to take responsibility for doing the work.<\/li><\/ol><h2>10. Engagement and accountability: the two casualties<\/h2><ul><li><strong>Engagement weakens:<\/strong> the expectation is acknowledged cognitively and not internalised. Discretionary effort is limited, people wait for direction, coordination slows and engagement becomes transactional. Work is happening, but energy is not invested.<\/li><li><strong>Accountability dilutes:<\/strong> people feel responsible for activities and not for the result. Reviews revolve around explanations and constraints, dependencies cause delays, and many teams feel partly responsible while none is fully accountable. The Delivery Line prevents this by naming one owner at each level.<\/li><\/ul><p>The paradox: teams appear to work hard and update in detail, yet the organisation keeps missing what it set out to deliver, because ownership of the outcome was assigned without being secured.<\/p><\/div>"},"u3m2_lens7":{"html":"<div class=\"usum\" data-unit=\"8\" data-title=\"PERFORMANCE MEASUREMENT\"><div class=\"usum-comp\"><div class=\"usum-comp-l\">COMPETENCE DEVELOPED<\/div><div class=\"usum-comp-n\">Performance Measurement and Recovery<\/div><p>The competent leader interprets performance evidence with balanced judgement and acts on it early. Meaningful progress is separated from activity, and execution stays on course.<\/p><\/div><h2>Demonstrable skills<\/h2><ol type=\"1\"><li>Lead an Enterprise Performance Intelligence Circle<\/li><li>Recover performance through Review–Realign–Restore and the Accountability Loop<\/li><li>Diagnose measurement fractures across functions<\/li><\/ol><h2>The unit concept<\/h2><p>Strategy execution fails at the level of visibility. Performance measurement is the execution visibility infrastructure of the strategy: it shows whether the organisation is actually moving closer to its Success in Practice, and moves leaders from activity visibility to progress visibility. It serves four purposes: visibility, accountability, execution intelligence and timely correction. The Review–Realign–Restore Cycle (R3) turns what measurement shows into recovery, the Accountability Loop diagnoses the root cause of a gap, and WARD sets in advance when each Key Result is checked and what follows a red flag. Review discipline determines execution velocity: where it weakens, warnings are missed, accountability diffuses, learning is lost and leadership credibility erodes. At executive level, the Enterprise Performance Intelligence Circle (EPIC) brings every function's results into one view of enterprise execution.<\/p><h2>1. The execution visibility infrastructure<\/h2><p>Without measurement, strategy remains interpretive: each function develops its own sense of progress and activity is mistaken for advancement. Measurement changes the question from \"What work was done?\" to \"What changed because of the work?\"<\/p><ul><li><strong>People performance:<\/strong> from \"How busy are our people?\" to \"What has their work changed in the Key Result?\"<\/li><li><strong>Organisational performance:<\/strong> from \"Has the support been put in place?\" to \"Does the support enable the individuals' tasks to move the Key Result?\" (the ESRG conditions agreed in Unit 6).<\/li><\/ul><p>Regular review cycles create execution rhythm and prevent the most common leadership surprise: discovering failure only at the end of the reporting period.<\/p><h2>2. The four strategic purposes of performance measurement<\/h2><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Purpose<\/strong><\/th><th><strong>What it does<\/strong><\/th><th><strong>People performance<\/strong><\/th><th><strong>Organisational performance<\/strong><\/th><\/tr><\/thead><tbody><tr><td>01 · Creates Visibility<\/td><td>Shows where the organisation is gaining momentum and where it is stalling<\/td><td>Where KPIs are gaining momentum or stalling<\/td><td>Where conditions support execution or hold it back<\/td><\/tr><tr><td>02 · Establishes Accountability<\/td><td>Records delivery as evidence that commitments are kept, including parts with no visible victory<\/td><td>People know which part of the strategy they advance<\/td><td>Leaders account for the conditions they undertook to provide<\/td><\/tr><tr><td>03 · Execution Intelligence<\/td><td>Turns data into decision insight through disciplined conversation: what progress has been achieved, what obstacles prevent further progress, what adjustment will restore momentum<\/td><td>What accelerates and slows people's progress<\/td><td>Which conditions enable and which constrain execution<\/td><\/tr><tr><td>04 · Enables Timely Correction<\/td><td>Early signals allow intervention while progress is recoverable; a signal in week four costs less than the same signal in week twelve<\/td><td>Intervention while the KPI is recoverable<\/td><td>Action on a condition before delivery is affected<\/td><\/tr><\/tbody><\/table><\/div><p>Accountability without measurement is aspiration without a feedback loop.<\/p><h2>3. The Review–Realign–Restore Cycle (R3)<\/h2><p>Review takes place at every agreed review point. Realign and Restore follow only when the Review finds a gap, in KPI execution or in a function contribution, from a people or an organisational perspective.<\/p><ul><li><strong>Review: establish execution reality.<\/strong> Applies visibility, accountability and execution intelligence along the Delivery Line: the KPI owner's performance first, then whether the enabling function contributions were delivered, then the link to the Key Result. Questions: what progress has been achieved against the target, what does the evidence show, where does progress fall short? Outcome: a shared, evidence-based understanding of progress and emerging gaps.<\/li><li><strong>Realign: diagnose and address the gap.<\/strong> People performance: the Accountability Loop identifies whether the gap arises from ownership, capability or a role or structural constraint. Organisational performance: what is preventing a condition from supporting the individuals' tasks. Outcome: the underlying constraint and an agreed corrective response.<\/li><li><strong>Restore: rebuild execution momentum.<\/strong> Applies timely correction: agree corrective actions and expected progress, reaffirm responsibilities, set follow-up dates and support, and update the KPI alignment state. Outcome: a recovery pathway, renewed ownership and agreed follow-through.<\/li><\/ul><p>The cycle is continuous: the next Review tests whether the corrective actions worked, for the individuals and for the organisational conditions.<\/p><h2>4. The Accountability Loop<\/h2><p>Pressure alone rarely solves execution challenges because it does not identify the cause. The Accountability Loop diagnoses which of three root causes lies behind a gap, and the leader achieves the recovery through GROW, with the goal of restoring an alignment score of 9 or 10.<\/p><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Root cause<\/strong><\/th><th><strong>What it is<\/strong><\/th><th><strong>Recovery<\/strong><\/th><\/tr><\/thead><tbody><tr><td>A · Lack of Accountability<\/td><td>The individual understands the task but has lost the motivational connection to it: the work feels detached, priorities compete, energy has shifted<\/td><td>Reconnect purpose and ownership: revisit the enterprise outcome the KPI supports and restore line of sight<\/td><\/tr><tr><td>B · Lack of Skill<\/td><td>The individual is committed but lacks the capability required: technical, analytical, leadership or process knowledge<\/td><td>Develop capability with no added pressure: coaching, peer support, formal training, an adjusted timeline where needed<\/td><\/tr><tr><td>C · Misfit of Role or Structural Constraint<\/td><td>The individual's strengths do not fit the responsibilities, or the structure prevents delivery<\/td><td>Structural alignment: redistribute the task, adjust responsibilities or, separately, reposition the individual<\/td><\/tr><\/tbody><\/table><\/div><p>The performance conversation stays separate from the role conversation, protecting fairness and clarity. The correct root cause determines the correct recovery: pressure will not solve a skill gap, and coaching will not solve a structural misfit.<\/p><h2>5. WARD: the Key Result's vital check-up<\/h2><p>Every Key Result has a baseline, a target and a deadline. WARD sets in advance when it is checked and what follows a red flag, so that corrective action starts while the gap is small.<\/p><ul><li><strong>W · Waypoints:<\/strong> the dates on which the Key Result is checked, and the level it must have reached by each.<\/li><li><strong>A · Alert:<\/strong> how far off a waypoint the result can be before it raises a red flag.<\/li><li><strong>R · Recovery:<\/strong> the corrective action that follows a red flag, for the individuals and for the organisational conditions.<\/li><li><strong>D · Decider:<\/strong> the executive who decides on the recovery and sees it through.<\/li><\/ul><p>Waypoints are checked in Review; the Alert moves a gap to Realign; Recovery and the Decider act in Restore.<\/p><h2>6. Execution velocity and the four consequences of weak review discipline<\/h2><p>Execution velocity is the rate at which an organisation converts strategic intent into measurable results. Measurement provides the evidence; review discipline converts it into timely decisions.<\/p><ul><li><strong>01 · Early warning signals are missed.<\/strong> Deterioration begins with small signals months before a KPI target is at risk. In people performance, warnings show in the review before the KPI: falling evidence quality, drifting alignment, effort migrating to what senior leaders ask about. In organisational performance, a weakening condition seldom carries its own number and is seen only when leaders ask for its evidence.<\/li><li><strong>02 · Accountability diffuses.<\/strong> When a KPI disappears from review conversations, owners read it as no longer a priority; KPIs become managed for appearance, shared ownership spreads thin and the original commitment loses force. Leaders' commitments on organisational conditions diffuse first, because they seldom appear on a scorecard, and mutual accountability becomes one-sided.<\/li><li><strong>03 · Organisational learning is lost.<\/strong> When reviews only record results, the organisation never learns why results occurred. Practices that accelerate progress stay one manager's habit, recurring capability gaps go unrecognised, and the same constraint in several reviews goes unseen as evidence that a condition is not equal to the strategy.<\/li><li><strong>04 · Leadership credibility erodes.<\/strong> Priorities that fade from the review agenda teach people that announcements are symbolic; standards applied unevenly read as unfairness. When leaders review individuals' targets and leave their own commitments on conditions unreviewed, accountability is seen to run one way.<\/li><\/ul><h2>7. Four fractures in performance measurement<\/h2><p>Performance measurement is ultimately a leadership conversation discipline. The breakdown usually occurs in how leaders review and interpret measures together.<\/p><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Fracture<\/strong><\/th><th><strong>What happens<\/strong><\/th><th><strong>How the leadership team closes it<\/strong><\/th><\/tr><\/thead><tbody><tr><td>01 · Horizontal Coordination Gap<\/td><td>Each function reviews its own KPIs; hand-offs and conditions spanning functions fall between reviews, and each function reports strong progress while the enterprise result stays inconsistent<\/td><td>Periodic cross-functional reviews of how KPIs across functions interact to produce enterprise outcomes<\/td><\/tr><tr><td>02 · Evidence Quality Gap<\/td><td>Reviews rest on narrative, activity or late information; conditions are asserted with no evidence; reviews turn into debates about whether the data can be trusted<\/td><td>Anchor every review in verifiable, timely evidence of observable movement, clearly connected to the KPI, target or Key Result<\/td><\/tr><tr><td>03 · Review Rhythm Breakdown<\/td><td>Infrequent or irregular reviews let deviations accumulate; people work in reporting bursts; conditions are reviewed only when they fail<\/td><td>A predictable rhythm in which leaders know when reviews occur and owners know when evidence is due, with conditions reviewed on the same rhythm as the KPIs they support<\/td><\/tr><tr><td>04 · Learning Suppression Gap<\/td><td>Reviews that only judge make people defend results and hide obstacles; conditions in senior leaders' areas go unexamined<\/td><td>Balance accountability with curiosity: \"What is the system teaching us about how execution actually works?\"<\/td><\/tr><\/tbody><\/table><\/div><h2>8. The Enterprise Performance Intelligence Circle (EPIC)<\/h2><p>The executive team's structured review of enterprise execution, guided by one question: \"Is the chain of execution across our functions holding together?\" Each executive brings the results of their function's reviews to one conversation, so the team sees how progress, risks and learning in one function affect the others.<\/p><ul><li><strong>Step 1 · Bring the results:<\/strong> the Key Results and KPIs each executive owns, with evidence.<\/li><li><strong>Step 2 · Review:<\/strong> each executive shares three signals in order:<ul><li><strong>Collective Trajectory, \"Where are we on execution?\":<\/strong> \"We are at [X]% progress, supported by [evidence], and momentum is [accelerating, stable or slowing].\" Uneven progress becomes visible.<\/li><li><strong>Early Warnings, \"What is starting to break?\":<\/strong> \"An emerging risk is [signal], supported by [evidence].\" Isolated issues show themselves as cross-functional dependencies.<\/li><li><strong>Execution Learning, \"What is execution teaching us?\":<\/strong> \"A key execution learning is [insight], supported by [evidence].\" The organisation builds practical execution intelligence.<\/li><\/ul><\/li><li><strong>Step 3 · Realign:<\/strong> for each gap, the root cause through the Accountability Loop (people performance), or the function contribution or condition that falls short and its owner (organisational performance).<\/li><li><strong>Step 4 · Restore:<\/strong> the recovery for each gap, its owner and when progress is reported back; each recovery returns to EPIC until the gap is closed.<\/li><\/ul><p>EPIC produces a clear snapshot of enterprise progress, emerging risks visible early enough for coordinated intervention, and execution learning captured to strengthen future performance. Performance measurement becomes the organisation's radar system for strategy execution.<\/p><\/div>"},"u3m2_lens8":{"html":"<div class=\"usum\" data-unit=\"9\" data-title=\"STRATEGIC UNCLOGGING\"><div class=\"usum-comp\"><div class=\"usum-comp-l\">COMPETENCE DEVELOPED<\/div><div class=\"usum-comp-n\">Execution Problem Solving<\/div><p>The competent leader diagnoses what is constraining people and organisational performance, and separates symptoms from causes. They mobilise a coordinated response that restores the flow of execution.<\/p><\/div><h2>Demonstrable skills<\/h2><ol type=\"1\"><li>Diagnose the Seven Performance Clogs and your function's part in them<\/li><li>Select the right Strategic Unclogging Lever<\/li><li>Run the Unclogging Cycle across people and organisational performance<\/li><\/ol><h2>The unit concept<\/h2><p>Strategy sets the destination; flow determines whether the organisation has the power to arrive. A Strategic Clog is an internal blockage that prevents strategic intent from flowing into execution: the widening gap between what the organisation said it would do and what is actually happening. Clogs form where the strategy stretches today's organisation beyond what it was designed to carry, and they act on people performance and organisational performance together. Leaders become Engineers of Execution Flow: they trace a clog from the result to its cause, identify it early, classify it accurately and clear it with the lever that matches it. The executive team normalises the unclog, so that surfacing and removing friction becomes a shared leadership habit run through the Unclogging Cycle.<\/p><h2>1. What a Strategic Clog is<\/h2><ul><li>A fundamental misalignment in which the organisation's current state (its habits, structures and DNA) works against its future goals.<\/li><li>Every clog interferes with ABCV Directional Integrity (Arena, Boundaries, Competition, Value Proposition). When execution is clogged, strategy loses directional integrity gradually and silently.<\/li><li><strong>System logic:<\/strong> a clog acts as a pressure distortion point. It redirects effort away from intended outcomes, weakens coherence across functions and creates misinterpretation of strategic intent.<\/li><li><strong>Where clogs form:<\/strong> in people performance (decisions wait, effort pulls in different directions, tasks are completed while the KPI holds still) and in organisational performance (ESRG conditions no longer support the individuals' tasks as the strategy places new weight on them). Organisational performance seldom carries its own number, so it stays unseen until leaders ask for it.<\/li><\/ul><h2>2. Why clogs form<\/h2><p>The organisation executes a new direction through what it has today: its structure, decision rights, culture, measures, capabilities and technology. Where any of these has not adapted, friction appears. Each strategy places its weight on known parts of the organisation, so leaders can anticipate where clogs will form. Two dimensions of performance operate in one system:<\/p><ul><li><strong>Organisational performance:<\/strong> the enterprise's ability to create, deliver and sustain value through its structures, processes, resources, capabilities, governance and operating systems.<\/li><li><strong>People performance:<\/strong> how effectively individuals and teams understand expectations, decide, apply capability, collaborate and deliver.<\/li><\/ul><p>Weak conditions defeat capable people; weak people performance defeats sound conditions. The two often reinforce each other: unclear decision rights create hesitation, and repeated hesitation leads senior leaders to centralise further.<\/p><h2>3. The Seven Performance Clogs<\/h2><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Clog<\/strong><\/th><th><strong>ABCV<\/strong><\/th><th><strong>Organisational condition<\/strong><\/th><th><strong>Effect on people<\/strong><\/th><th><strong>Strategic impact<\/strong><\/th><\/tr><\/thead><tbody><tr><td>01 · Structural Misfit<\/td><td>Boundaries<\/td><td>Roles, reporting lines, governance and interfaces still reflect earlier priorities; integrated work is divided without shared ownership<\/td><td>People cannot see how their contribution connects; managers protect territory; people are held to outcomes they cannot deliver alone<\/td><td>Effort is absorbed by internal friction; functional targets are met while enterprise outcomes stay weak<\/td><\/tr><tr><td>02 · Capability Gaps<\/td><td>Arena<\/td><td>The organisation lacks the expertise, capacity, processes, partnerships or scale the chosen arena requires<\/td><td>People lack skills, tools or support for new expectations; reliance on a few specialists creates overload<\/td><td>The enterprise cannot consistently deliver the value its positioning promises<\/td><\/tr><tr><td>03 · Decision Bottlenecks<\/td><td>Boundaries<\/td><td>Decision rights, delegation limits and approval layers keep decisions away from the right level and speed<\/td><td>Managers hesitate; teams seek approval for what they could resolve; responsibility comes without authority<\/td><td>Execution velocity slows; ownership is lost; the organisation becomes less responsive<\/td><\/tr><tr><td>04 · Misaligned Metrics &amp; Incentives<\/td><td>Value Proposition<\/td><td>Measures and rewards reinforce activities that do not reflect the strategic value intended<\/td><td>People prioritise targets over customer value, quality or collaboration<\/td><td>Measurable activity without the intended value; the system reinforces behaviours that undermine the strategy<\/td><\/tr><tr><td>05 · Cultural Resistance<\/td><td>Value Proposition<\/td><td>Norms, assumptions and informal rules do not support the behaviours the strategy requires<\/td><td>People understand the direction but doubt its permanence, feel unsafe or see leaders acting inconsistently<\/td><td>Change is adopted superficially; habits pull performance back to established practice<\/td><\/tr><tr><td>06 · Technology / Infrastructure Lag<\/td><td>Competition<\/td><td>Technology, information architecture or assets are not reliable, integrated or scalable enough<\/td><td>Time goes on correcting data, reconciling records and workarounds; decisions rest on outdated information<\/td><td>Speed, information quality and the ability to scale are lost; competitive responsiveness weakens<\/td><\/tr><tr><td>07 · Leadership Avoidance<\/td><td>Arena + Boundaries<\/td><td>Leadership mechanisms fail to resolve trade-offs, repeated underperformance, conflicts or accountability gaps<\/td><td>Mixed signals on priorities and consequences; people stop raising problems and protect themselves<\/td><td>Unresolved issues accumulate; over time it reinforces all six other clogs<\/td><\/tr><\/tbody><\/table><\/div><p>Each clog has observable performance patterns (for example duplication of work, repeated handoff bottlenecks, recurring agenda items without closure, strong departmental KPIs beside weak enterprise results) and early warning signals that appear before the result moves.<\/p><h2>4. The Clog Trace: from the result to its cause<\/h2><p>A clog is seen through its effects. The Clog Trace checks three levels of evidence in order, and names the clog only when all three connect:<\/p><ol type=\"1\"><li><strong>Performance outcome:<\/strong> what result is falling short? The Key Result, the actual result and the size of the gap. This confirms a blockage affecting the strategy and what it costs.<\/li><li><strong>Performance behaviour:<\/strong> what are people or teams doing, or unable to do, that produces the gap, judged against the expectations established?<\/li><li><strong>Performance condition:<\/strong> which organisational arrangement, capability, incentive or leadership practice causes or sustains that behaviour? Test the seven clogs against it.<\/li><\/ol><p>The clog is confirmed when the condition explains the behaviour and the behaviour explains the gap. Without the outcome check, leaders chase friction that does not affect the strategy; without the behaviour check, they guess the clog from a number; without the condition check, they treat the gap as individual failure and the clog stays. The trace runs in the Review step of Review–Realign–Restore whenever a Key Result shows a gap.<\/p><h2>5. Three disciplines of execution engineering<\/h2><p>A clog compounds: a delay in one function becomes the constraint on the next.<\/p><ul><li><strong>Early identification: detect signals before they compound.<\/strong> Signal literacy reads patterns as early indicators of misalignment, in three places: the review (items carried forward, explanations replacing progress), the flow of work (slow hand-offs, queued approvals, multiplying workarounds) and conversation (people stop raising problems, or raise the same one repeatedly).<\/li><li><strong>Accurate classification: name the clog before intervening.<\/strong> The most common failure is applying the wrong lever to a correctly identified symptom, such as adding resources to what is a decision bottleneck. Leaders test the Clog Trace evidence against each clog, separate what is within the individual's control from what conditions impose, and name the primary clog (the one whose removal releases the others) with contributing clogs beside it.<\/li><li><strong>Targeted intervention: pull the right lever with precision.<\/strong> Match the lever to the root cause, often more than one lever per clog. Name what will change, who will change it and the evidence that will show the clog clearing, set before acting. Sequence the response: the lever that changes the condition usually comes first, then the lever that builds people's capability or confidence.<\/li><\/ul><p>The rhythm: <strong>Identify the Clog → Select the Lever → Targeted Intervention.<\/strong> Every response works on people performance and organisational performance at once.<\/p><h2>6. The Seven Strategic Unclogging Levers<\/h2><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Lever<\/strong><\/th><th><strong>Purpose<\/strong><\/th><th><strong>How it works<\/strong><\/th><th><strong>Best applied to<\/strong><\/th><\/tr><\/thead><tbody><tr><td>01 · Standardise<\/td><td>Ensure consistency<\/td><td>One agreed way of working where the strategy needs consistent results, with a measure and an owner, leaving local judgement where needed<\/td><td>Structural Misfit; Misaligned Metrics; Technology Lag<\/td><\/tr><tr><td>02 · Streamline<\/td><td>Increase speed<\/td><td>Remove steps, approvals and hand-offs that add time without adding control or value; keep controls at the point of greatest risk<\/td><td>Decision Bottlenecks; Structural Misfit<\/td><\/tr><tr><td>03 · Clarify<\/td><td>Eliminate confusion<\/td><td>Settle who owns each outcome, who decides, who is consulted and where work passes between teams<\/td><td>Decision Bottlenecks; Structural Misfit; Leadership Avoidance<\/td><\/tr><tr><td>04 · Upgrade<\/td><td>Remove bottlenecks<\/td><td>Replace or improve technology, infrastructure or capability that cannot carry the strategy's demands<\/td><td>Technology Lag; Capability Gaps<\/td><\/tr><tr><td>05 · Reinforce<\/td><td>Strengthen behaviour<\/td><td>Build the skills, habits and confidence the strategy requires through training, coaching, modelling and recognition<\/td><td>Capability Gaps; Cultural Resistance<\/td><\/tr><tr><td>06 · Realign<\/td><td>Focus on results<\/td><td>Change measures, targets and rewards so they reinforce the contributions the strategy needs, including shared results<\/td><td>Misaligned Metrics &amp; Incentives<\/td><\/tr><tr><td>07 · Rebuild Trust<\/td><td>Restore credibility<\/td><td>Acknowledge what went wrong, act on concerns, follow through and make the reasons for decisions visible<\/td><td>Cultural Resistance; Leadership Avoidance<\/td><\/tr><\/tbody><\/table><\/div><h2>7. Normalising the unclog<\/h2><p>Performance friction is a normal feature of organisational life. Normalising the unclog makes early detection and removal of constraints part of how the executive team operates: concerns are raised through evidence, conditions are examined together, and surfacing friction counts as a contribution, including when the condition sits in another executive's portfolio. <strong>Collective leadership principle:<\/strong> every executive is responsible for making emerging friction visible; the leaders who control the contributing conditions act together to remove it, with clear individual ownership for each commitment.<\/p><h2>8. The Unclogging Cycle: Review–Realign–Restore<\/h2><p>The executive team applies Review–Realign–Restore together to a clog that crosses executive portfolios. Each stage completes one part of the Unclogging Record.<\/p><ul><li><strong>REVIEW · establish the performance reality.<\/strong> Use the Clog Trace to confirm the outcome gap, the behaviour and the condition, examining evidence across portfolios. Complete when the team agrees the gap, the evidence and the clog.<\/li><li><strong>REALIGN · establish collective executive ownership.<\/strong> Three decisions: what must change (the arrangement, practice or decision sustaining the clog); who must act together (one coordinating executive and the contributing executives); what must be agreed (decisions, responsibilities, resources, timelines). Address both what must change for people (expectations, authority, capability, support) and for the organisation (structures, processes, systems, resources, decision rights, governance). Complete when the leaders have agreed what changes, who acts and what each delivers.<\/li><li><strong>RESTORE · activate the Unclogging Levers.<\/strong> Select the lever that addresses the confirmed clog, implement the agreed changes and verify recovery: evidence that the condition has changed, that people deliver under it, and that the Key Result moves. Sustained improvement is verified through the normal review rhythm.<\/li><\/ul><p>The Unclogging Record holds the gap, evidence and confirmed clog; the coordinating and contributing executives and agreed changes; and the lever, actions, owners, dates, evidence of recovery and next review date.<\/p><\/div>"},"u4m1_lens9":{"html":"<div class=\"usum\" data-unit=\"10\" data-title=\"ESRG ALIGNMENT\"><div class=\"usum-comp\"><div class=\"usum-comp-l\">COMPETENCE DEVELOPED<\/div><div class=\"usum-comp-n\">Organisational Capability Development<\/div><p>The competent leader configures the Environment, Systems, Resources and Governance that strategy needs. The organisation gains the capacity to deliver its commitments consistently.<\/p><\/div><h2>Demonstrable skills<\/h2><ol type=\"1\"><li>Assess ESRG conditions and correct for executive bias<\/li><li>Interpret ESRG results by execution capability<\/li><li>Translate ESRG results into alignment interventions through cross-functional review<\/li><\/ol><h2>The unit concept<\/h2><p>A strategic commitment can be delivered consistently only when the operating conditions it depends on can meet its performance demands. ESRG Alignment grounds organisational performance at the level of the Objective: before demand arrives, leaders specify what each component of the Environment, Systems, Resources and Governance must provide, test it once a year in the ESRG Annual Scan, and build the capability deliberately. Each domain enables execution through one capability: Operational Readiness, Operational Flow, Delivery Capacity and Decision Responsiveness. Each function reads these capabilities from its own position: its members’ scores are averaged and the function score sets its response, the functions combine and align their interventions, and the executive team prioritises the interventions by their impact on enterprise results.<\/p><h2>1. ESRG Alignment and Strategic Unclogging<\/h2><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><\/th><th><strong>Strategic Unclogging<\/strong><\/th><th><strong>ESRG Alignment<\/strong><\/th><\/tr><\/thead><tbody><tr><td>Level it works at<\/td><td>Key Result<\/td><td>Objective<\/td><\/tr><tr><td>Use it when<\/td><td>A Key Result is slowing in EPIC and friction shows in results or behaviour<\/td><td>Once a year at the ESRG Annual Scan of each Objective, and when an Objective is approved, launched or scaled<\/td><\/tr><tr><td>Question it answers<\/td><td>What is blocking this result, and how do we clear it?<\/td><td>Can our operating conditions carry this commitment, and where must we build capability?<\/td><\/tr><tr><td>What it covers<\/td><td>People and organisational performance<\/td><td>Organisational operating conditions (ESRG)<\/td><\/tr><tr><td>Leaders' response<\/td><td>Select an Unclogging Lever and run Review–Realign–Restore<\/td><td>Escalate, coordinate, align and prioritise targeted organisational alignment interventions<\/td><\/tr><\/tbody><\/table><\/div><p>The two feed each other: a Key Result shortfall traced to an organisational condition becomes an ESRG component to score at the next annual review; recurring clogs in one component reveal a capability gap; a component that scores low shows leaders where clogs are likely to form during the year.<\/p><h2>2. The four ESRG domains and twelve components<\/h2><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Domain<\/strong><\/th><th><strong>Concerns<\/strong><\/th><th><strong>Components and what to establish<\/strong><\/th><th><strong>Diagnostic question<\/strong><\/th><\/tr><\/thead><tbody><tr><td>Environment · FIT<\/td><td>The suitability and reliability of the physical and technological setting<\/td><td><strong>Facilities:<\/strong> locations and facilities functional and suited to the planned activity. <strong>Infrastructure:<\/strong> utilities, connectivity and supporting infrastructure reliably carry operational demand. <strong>Technology:<\/strong> available, reliable and fit for the required activity<\/td><td>Are our facilities, infrastructure and technology fit for the strategic requirement?<\/td><\/tr><tr><td>Systems · SIP<\/td><td>How work is defined, connected and performed across the enterprise<\/td><td><strong>Standardisation:<\/strong> recurring processes clearly defined and consistently applied. <strong>Integration:<\/strong> systems and handoffs connect across functions without avoidable breaks. <strong>Process Efficiency:<\/strong> output delivered without unnecessary steps, delay, duplication or waste<\/td><td>Are our operational processes standardised, integrated and efficient?<\/td><\/tr><tr><td>Resources · AIR<\/td><td>The availability, funding and productive deployment of operational assets<\/td><td><strong>Asset Availability:<\/strong> sufficient productive equipment and assets for the required output. <strong>Investment:<\/strong> adequate financial provision for the commitment. <strong>Resource Utilisation:<\/strong> assets and funding allocated and used productively against priorities<\/td><td>Are our assets and financial resources sufficient and effectively utilised?<\/td><\/tr><tr><td>Governance · PAR<\/td><td>How operational decisions are guided, authorised and risks managed<\/td><td><strong>Policies &amp; Procedures:<\/strong> suitable for the decisions and operations required. <strong>Authority:<\/strong> decision rights and approval pathways support timely decisions. <strong>Risk Management:<\/strong> material risks identified, assessed, mitigated and monitored<\/td><td>Is our organisational governance up to PAR?<\/td><\/tr><\/tbody><\/table><\/div><h2>3. The ESRG Ignition Point<\/h2><p>The Ignition Point is reached when operating conditions are aligned enough to support the performance demands of the strategy. Each domain makes a distinct, interdependent contribution:<\/p><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Domain<\/strong><\/th><th><strong>Execution-enabling capability<\/strong><\/th><th><strong>What it makes possible<\/strong><\/th><\/tr><\/thead><tbody><tr><td>Environment · FIT<\/td><td>Operational Readiness<\/td><td>A dependable operating setting that reduces interruptions and protects service or production availability<\/td><\/tr><tr><td>Systems · SIP<\/td><td>Operational Flow<\/td><td>Work that progresses predictably from initiation to completion, improving throughput and turnaround<\/td><\/tr><tr><td>Resources · AIR<\/td><td>Delivery Capacity<\/td><td>The required scale of delivery, preventing capacity shortages and avoidable underutilisation<\/td><\/tr><tr><td>Governance · PAR<\/td><td>Decision Responsiveness<\/td><td>Action that proceeds with clarity and control, reducing approval bottlenecks while protecting sound decisions<\/td><\/tr><\/tbody><\/table><\/div><p><strong>Ignition principle:<\/strong> a strategic commitment can be delivered consistently only when the operating conditions it depends on can meet its performance demands. An intervention must address the capability that is actually constraining delivery.<\/p><h2>4. The three levels of intelligence in the ESRG Annual Scan<\/h2><p>The ESRG Annual Scan is the leadership team’s yearly reading of the operating conditions that ground performance, at Objective level; Key Results are reviewed through EPIC across the year. Each function scores the components as they stand in its own environment; the executive team then brings the functional readings together and agrees the interventions for the year ahead.<\/p><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Dimension<\/strong><\/th><th><strong>What leaders look for<\/strong><\/th><th><strong>What the team establishes<\/strong><\/th><th><strong>Response discipline<\/strong><\/th><\/tr><\/thead><tbody><tr><td>Functional Intelligence<\/td><td>Function score: the average of the members’ scores for each component<\/td><td>How far the component carries the function’s delivery<\/td><td><strong>Escalate<\/strong> at 1.0–1.9, <strong>Coordinate<\/strong> at 2.0–3.9, <strong>Protect<\/strong> at 4.0–5.0<\/td><\/tr><tr><td>Cross-Functional Intelligence<\/td><td>Overlap and dependency: functional maps show the same intervention, or one function’s component relies on a capability another function supplies or controls<\/td><td>Interventions to combine across functions, and capabilities in one function that enable or constrain another<\/td><td><strong>Align:<\/strong> combine overlapping interventions into one, and agree the shared operating requirement, the order of action and what each function commits to the other<\/td><\/tr><tr><td>Enterprise Intelligence<\/td><td>Impact: the effect of each intervention on enterprise results<\/td><td>Which interventions most advance the enterprise’s strategic commitments<\/td><td><strong>Prioritise:<\/strong> agree the order of delivery and direct resources to the interventions with the greatest impact on enterprise results<\/td><\/tr><\/tbody><\/table><\/div><p>A low score does not by itself prove the cause: the evidence is tested before the response is agreed.<\/p><h2>5. The ESRG Annual Scan<\/h2><ol type=\"1\"><li><strong>The members of each function score its operating conditions.<\/strong> Each member scores the 12 components for the Objective on their own, from evidence of how policies, systems and plans perform in practice, on a 1–5 scale: <strong>1<\/strong> Critical constraint (materially prevents required performance); <strong>2<\/strong> Significant gap (regularly disrupts or limits performance); <strong>3<\/strong> Partially effective (supports basic operations, not strategic demand); <strong>4<\/strong> Effective (reliably supports current requirements); <strong>5<\/strong> Fully aligned (supports current and anticipated demand).<\/li><li><strong>Each function reads its scores (Functional Intelligence).<\/strong> The function averages its members’ scores for each component: Escalate at 1.0–1.9, Coordinate at 2.0–3.9, Protect at 4.0–5.0.<\/li><li><strong>The functions combine and align (Cross-Functional Intelligence).<\/strong> Overlapping interventions are combined into one; where one function relies on a capability another supplies or controls, the functions agree the shared operating requirement, the order of action and what each commits to the other.<\/li><li><strong>The executive team builds its ESRG Alignment Key (Enterprise Intelligence).<\/strong> It prioritises the interventions and the escalated constraints by their impact on enterprise results and names the lead executive for each. The Key is the commitment for the year.<\/li><\/ol><\/div>"},"u4m1_lens10":{"html":"<div class=\"usum\" data-unit=\"11\" data-title=\"CULTURE REINFORCEMENT &amp;amp; ORGANISATIONAL HEALTH\"><div class=\"usum-comp\"><div class=\"usum-comp-l\">COMPETENCE DEVELOPED<\/div><div class=\"usum-comp-n\">Culture and Organisational Health<\/div><p>The competent leader diagnoses organisational health and its effect on strategic performance. They set the behavioural standards and cultural norms that strengthen it.<\/p><\/div><h2>Demonstrable skills<\/h2><ol type=\"1\"><li>Diagnose organisational health and strengthen its weakest trait<\/li><li>Quantify people-performance losses<\/li><li>Build a Cultural Operating Code<\/li><\/ol><h2>The unit concept<\/h2><p>Values establish the principles that guide organisational behaviour. Culture reflects how those principles become established ways of working: the behaviours that have become normal, whatever the stated values say. Organisational health is the resulting condition, visible in five traits and formed from the inside outward through trust, experiences, beliefs and actions. Health acts as a multiplier on every strategic capability: as it deteriorates, execution friction rises and the cost of delivering strategy increases, through hidden costs that can be quantified. Leaders ground people performance with two instruments used together: the Organisational Health Thermometer shows where a trait is weakening and what it costs, and the Cultural Operating Code sets the norms every leader models, recognises and corrects.<\/p><h2>1. Organisational values<\/h2><p>Values are the fundamental principles that guide how an organisation conducts itself in pursuit of its purpose and strategic objectives. They serve two purposes: they <strong>establish behavioural expectations<\/strong> (how people interact, exercise authority, fulfil responsibilities and collaborate) and they <strong>provide a basis for accountability<\/strong> (how results are achieved, alongside the results themselves). Values influence conduct only when expressed as observable behaviours:<\/p><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Value<\/strong><\/th><th><strong>Expected behavioural standard<\/strong><\/th><\/tr><\/thead><tbody><tr><td>Integrity<\/td><td>Act honestly, communicate transparently and uphold ethical commitments<\/td><\/tr><tr><td>Accountability<\/td><td>Take ownership of responsibilities, honour commitments and report progress accurately<\/td><\/tr><tr><td>Respect<\/td><td>Treat others fairly, listen constructively and recognise different perspectives<\/td><\/tr><tr><td>Excellence<\/td><td>Maintain high standards, address performance gaps and pursue continuous improvement<\/td><\/tr><tr><td>Collaboration<\/td><td>Share information, coordinate efforts and contribute to collective outcomes<\/td><\/tr><\/tbody><\/table><\/div><p>Through consistent demonstration, reinforcement and upholding, values become culture.<\/p><h2>2. Organisational culture and the Cultural Operating Code<\/h2><p>Culture is the system of shared behavioural norms that determines how people conduct themselves and work together. Behaviours that are repeated become \"the way we do things around here\".<\/p><ul><li><strong>Why a Code is needed:<\/strong> most organisations have stated values; few have agreed what those values require people to do on an ordinary working day. Without that agreement, each leader interprets the values differently, people read the real standard from what is tolerated, and culture forms by default.<\/li><li><strong>The Code<\/strong> translates each value into a norm: <strong>Value → Norm (the expected behaviour) → Demonstrable behaviours.<\/strong><\/li><li><strong>The anatomy of a norm:<\/strong> the <strong>value<\/strong> (the principle); the <strong>definition<\/strong> (one line on what the value means for this organisation); the <strong>norm<\/strong> (three actions whose first letters form a short, memorable acronym); the <strong>norm statement<\/strong> (one sentence describing the norm in daily practice, specific enough to show which behaviour is recognised and which is corrected).<\/li><li><strong>What makes the Code real:<\/strong> Demonstrable (observable, specific behaviours); Assessed (the norms appear in 360-degree feedback); Enforced (consequences apply regardless of seniority); Maintained (explicit, modelled by executives, reinforced in reviews, revisited periodically).<\/li><li><strong>Where the Code is embedded:<\/strong> recruitment and onboarding; meetings and decision forums; recognition and promotion; career development; leadership development.<\/li><li><strong>Three tests for every norm:<\/strong> the <strong>New Employee Test<\/strong> (would a new employee know which behaviour will be recognised and which corrected?); the <strong>Pressure Test<\/strong> (does it hold when a senior leader breaches it, a high performer contradicts it, or truth is costly?); the <strong>Mirror Test<\/strong> (would every executive be comfortable being assessed against it in their own 360-degree feedback?).<\/li><\/ul><h2>3. Organisational health: the resulting condition<\/h2><p>Organisational health is the condition that results from how effectively values are lived within the culture. A healthy organisation is whole, consistent and complete, with management, operations, strategy and culture working together coherently (Lencioni).<\/p><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Health trait<\/strong><\/th><th><strong>Observable condition<\/strong><\/th><th><strong>Emerging signals of vulnerability<\/strong><\/th><\/tr><\/thead><tbody><tr><td>1 · Minimal Politics<\/td><td>Open collaboration with limited personal agendas, territorial behaviour and internal competition<\/td><td>Territorial behaviour, withheld information, personal agendas<\/td><\/tr><tr><td>2 · Minimal Confusion<\/td><td>People understand direction, priorities, responsibilities and expectations<\/td><td>Uncertain expectations, conflicting instructions, inconsistent accountability<\/td><\/tr><tr><td>3 · High Morale<\/td><td>Commitment, motivation and confidence in the working environment<\/td><td>Withdrawal, reduced initiative, disengagement<\/td><\/tr><tr><td>4 · High Productivity<\/td><td>Coordinated effort that translates into meaningful outcomes<\/td><td>Declining contribution, repeated missed commitments, reduced discretionary effort<\/td><\/tr><tr><td>5 · Low Turnover<\/td><td>Capable employees retained through an environment that supports commitment<\/td><td>Rising voluntary departures, loss of experienced employees<\/td><\/tr><\/tbody><\/table><\/div><h2>4. The Organisational Health Pyramid<\/h2><p>The visible traits are produced from the inside outward: <strong>Trust → Experiences → Beliefs → Actions → Results.<\/strong><\/p><ol type=\"1\"><li><strong>Trust (the foundation):<\/strong> built through consistent leadership conduct: keeping commitments, communicating transparently, acknowledging mistakes and treating people fairly.<\/li><li><strong>Experiences (shaped by trust):<\/strong> everyday interactions, meetings, performance conversations, decisions and recognition show what the organisation genuinely values.<\/li><li><strong>Beliefs (formed by experiences):<\/strong> repeated experiences form assumptions about whether leaders listen, commitments matter, effort is recognised and honesty is safe.<\/li><li><strong>Actions (driven by beliefs):<\/strong> beliefs determine whether people share ideas, collaborate, take initiative and own commitments.<\/li><li><strong>Results (the visible traits):<\/strong> the cumulative outcome of trust, experiences, beliefs and actions.<\/li><\/ol><p>When trust deteriorates, experiences create scepticism, beliefs become defensive, actions shift to self-protection and the traits weaken. A weak trait is strengthened at the layer where the weakness starts.<\/p><h2>5. How the Code strengthens organisational health<\/h2><p>The Code acts on the experiences layer of the Pyramid: when leaders model, recognise and correct against the same norms, people experience consistent standards, believe the values are real and act on that belief.<\/p><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Health trait<\/strong><\/th><th><strong>What the Code provides<\/strong><\/th><\/tr><\/thead><tbody><tr><td>Minimal Politics<\/td><td>Shared norms for raising issues, sharing information and resolving conflict openly<\/td><\/tr><tr><td>Minimal Confusion<\/td><td>An explicit expected behaviour for every value, applied the same way by every leader<\/td><\/tr><tr><td>High Morale<\/td><td>Consistent recognition of behaviour that matches the norms<\/td><\/tr><tr><td>High Productivity<\/td><td>Norms for ownership, coordination and follow-through<\/td><\/tr><tr><td>Low Turnover<\/td><td>Fair consequences applied consistently, regardless of seniority<\/td><\/tr><\/tbody><\/table><\/div><p>A weak health trait points to a norm that is missing, unclear or inconsistently applied.<\/p><h2>6. The Organisational Health Thermometer<\/h2><p>The common instrument for scoring the five traits. Each employee in a function rates 20 statements, four per trait, independently and confidentially, from 1 (Never) to 5 (Always): each trait scores out of 20, the total out of 100.<\/p><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Score<\/strong><\/th><th><strong>Temperature<\/strong><\/th><th><strong>What it signals<\/strong><\/th><\/tr><\/thead><tbody><tr><td>80–100<\/td><td>Healthy &amp; Thriving<\/td><td>Minimal politics, clear leadership, strong morale; maintain momentum through reinforcement<\/td><\/tr><tr><td>60–79<\/td><td>Stable but Uneven<\/td><td>Generally healthy with pockets of confusion or disengagement; targeted intervention required<\/td><\/tr><tr><td>40–59<\/td><td>Caution Zone<\/td><td>Mistrust, fatigue or unclear direction surfacing; immediate leadership attention needed<\/td><\/tr><tr><td>20–39<\/td><td>Unhealthy<\/td><td>High politics, low trust, rising turnover risk; leadership credibility at stake<\/td><\/tr><\/tbody><\/table><\/div><ul><li><strong>Functional Trait Score<\/strong> = sum of individual trait totals ÷ number of employees responding. <strong>Functional Health Score<\/strong> (/100) = sum of the five functional trait scores.<\/li><li><strong>Enterprise Health Score<\/strong> = Σ (Functional Score × Employees) ÷ Total Employees, placed in its band as the enterprise health temperature. An average can hide a function in the Caution Zone, so each function's trait profile is read alongside it.<\/li><li><strong>Safeguard:<\/strong> responses are confidential; executives receive consolidated function-level results only, with small teams aggregated to protect confidentiality.<\/li><li>The thermometer signals vulnerability; the cause and the cost need separate evidence.<\/li><\/ul><h2>7. Organisational health as a performance multiplier<\/h2><p>Health raises or lowers how much of each strategic capability converts into results, and how fast:<\/p><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Strategic capability<\/strong><\/th><th><strong>Influence of organisational health<\/strong><\/th><\/tr><\/thead><tbody><tr><td>Strategic Direction<\/td><td>Shared commitment strengthens alignment around priorities<\/td><\/tr><tr><td>Execution Accountability<\/td><td>Trust and ownership support consistent delivery of commitments<\/td><\/tr><tr><td>Performance Management<\/td><td>Openness enables constructive performance conversations and corrective action<\/td><\/tr><tr><td>Enterprise Collaboration<\/td><td>Shared responsibility strengthens coordination across functions<\/td><\/tr><tr><td>Organisational Adaptability<\/td><td>Confidence and collective commitment support responsiveness to change<\/td><\/tr><\/tbody><\/table><\/div><p>Health also sets <strong>execution velocity<\/strong>: in a healthy organisation, concerns are raised early, decisions are followed through, information moves across functions and engagement holds, so execution keeps its momentum. Sustained performance requires a culture that consistently reinforces collective execution behaviours, reducing dependence on constant leadership intervention.<\/p><h2>8. The price of poor organisational health<\/h2><p>Each hidden cost is the price of one weakened trait, and it stays hidden in operating expenses until it is calculated.<\/p><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Trait weakened<\/strong><\/th><th><strong>Hidden cost<\/strong><\/th><th><strong>How it shows<\/strong><\/th><th><strong>Performance consequence<\/strong><\/th><\/tr><\/thead><tbody><tr><td>Minimal Confusion<\/td><td>Lost Time<\/td><td>Repeated work, unclear communication, unnecessary meetings, unresolved disagreements<\/td><td>Reduced productivity and slower execution<\/td><\/tr><tr><td>High Productivity<\/td><td>Employee Disengagement<\/td><td>Reduced initiative and discretionary effort<\/td><td>Lower contribution and weakened momentum<\/td><\/tr><tr><td>Minimal Politics<\/td><td>Declining Trust<\/td><td>Defensive communication, withheld information, protected departmental interests<\/td><td>Reduced collaboration, slower problem resolution<\/td><\/tr><tr><td>High Morale<\/td><td>Emotional Fatigue<\/td><td>Persistent frustration, uncertainty, tension, self-protection<\/td><td>Reduced morale, commitment and effectiveness<\/td><\/tr><tr><td>Low Turnover<\/td><td>Talent Loss<\/td><td>Capable people leave unhealthy environments<\/td><td>Loss of knowledge, capability and continuity<\/td><\/tr><\/tbody><\/table><\/div><p>Quantifying the costs lets executives establish the financial impact, find the largest sources of loss, prioritise corrective action, build the business case and track value recovered. Each estimate needs evidence linking it to organisational health, defensible cost assumptions and reconciliation of overlapping categories; observed losses are separated from assumptions.<\/p><h2>9. The Cross-CXO Health Architecture<\/h2><p>The Thermometer and the Code are used together across the executive team. Each quarter, employees in every function complete the Thermometer independently; each executive interprets the consolidated score for their function, tests it against observable behaviour and the Pyramid, and quantifies the loss; the executive team consolidates the functional positions into an enterprise view and agrees the shared priorities. The Code then gives every leader the same norms to model, recognise and correct.<\/p><\/div>"},"u4m2_lens11":{"html":"<div class=\"usum\" data-unit=\"12\" data-title=\"SUSTAINING PERFORMANCE\"><div class=\"usum-comp\"><div class=\"usum-comp-l\">COMPETENCE DEVELOPED<\/div><div class=\"usum-comp-n\">Sustainable Performance<\/div><p>The competent leader builds lasting institutional capability that outlives short-term results. They keep enterprise performance in continuous sight and act early when it begins to drift.<\/p><\/div><h2>Demonstrable skills<\/h2><ol type=\"1\"><li>Maintain the Three Lines of Sight<\/li><li>Detect Performance Gravity and early drift<\/li><li>Reinforce recovery across people and organisational performance<\/li><\/ol><h2>The unit concept<\/h2><p>Achieving a result and holding it are two separate leadership tasks. Once achieved, results come under Performance Gravity: a steady pull back towards the historical average, working quietly while the conditions and behaviours behind the result weaken. Gravity shows first as drift on one of three lines of sight: the Behavioural line, read through the Organisational Health Thermometer for people performance, and the Strategic and Operational lines, read through EPIC for organisational performance. At each quarter end, the executive team reads the thermometer and restores the norms behind the lowest-scoring traits through Review–Realign–Restore. It gathers the quarter’s EPIC Restore decisions, tags each with its line of sight and RAG, and unblocks every Red decision. The two readings feed each other, and together they hold the result into the next quarter.<\/p><h2>1. Performance Gravity<\/h2><p>The strategy, contributions and performance system built across the programme produce results. Once achieved, those results are pulled back towards the historical average. Results often remain acceptable for several cycles while the conditions and behaviours that produced them weaken. By the time the decline shows in the result, the cost of correcting it is far higher than the cost of noticing it early.<\/p><h2>2. The Three Lines of Sight<\/h2><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Line of sight<\/strong><\/th><th><strong>The question each quarter<\/strong><\/th><th><strong>Where it is read<\/strong><\/th><th><strong>Performance<\/strong><\/th><\/tr><\/thead><tbody><tr><td>Strategic<\/td><td>Is the Key Result still moving towards its Success in Practice?<\/td><td>EPIC (Unit 8)<\/td><td>Organisational<\/td><\/tr><tr><td>Operational<\/td><td>Are the KPIs and conditions still enabling the people’s tasks?<\/td><td>EPIC (Unit 8)<\/td><td>Organisational<\/td><\/tr><tr><td>Behavioural<\/td><td>Are people still living the agreed norms?<\/td><td>Organisational Health Thermometer (Unit 11)<\/td><td>People<\/td><\/tr><\/tbody><\/table><\/div><h2>3. Sustaining people performance<\/h2><p><strong>Review:<\/strong> the enterprise and functional health scores in their bands (Healthy &amp; Thriving 80–100; Stable but Uneven 60–79; Caution Zone 40–59; Unhealthy 20–39), and the lowest-scoring traits this quarter as the priority traits. <strong>Realign:<\/strong> trace each priority trait to its norm (Minimal Politics: raising issues, sharing information and resolving conflict openly; Minimal Confusion: an explicit expected behaviour for every value, applied the same way by every leader; High Morale: consistent recognition of behaviour that matches the norms; High Productivity: ownership, coordination and follow-through; Low Turnover: fair consequences applied consistently), and find the cause through the Accountability Loop: Ownership, Capability, or Role or structural constraint. <strong>Restore:<\/strong> each owner commits to the corrective action and a review date; the next thermometer is the next Review.<\/p><h2>4. Sustaining organisational performance<\/h2><p>At quarter end, the executive team gathers the quarter’s EPIC Restore decisions, tags each with its line of sight (Strategic: keeps the Key Result moving towards its Success in Practice; Operational: restores a KPI or condition that delivers it) and gives each its EPIC RAG: Green, closed; Amber, on track within its date; Red, past its date with the gap still open. Each Red decision is unblocked through Strategic Unclogging, with its owner confirmed and a new date set.<\/p><h2>5. How the two tie together<\/h2><p>A cause found in the people reading that lies in an organisational condition goes to EPIC as a Restore decision. A Red EPIC decision held by Ownership or Capability goes to the people Restore.<\/p><h2>6. Why performance drifts, and why quarterly reinforcement holds it<\/h2><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Line<\/strong><\/th><th><strong>Drift<\/strong><\/th><th><strong>How the quarterly reinforcement counters it<\/strong><\/th><\/tr><\/thead><tbody><tr><td>Strategic<\/td><td>Momentum Illusion: the market moves while momentum carries results<\/td><td>Strategic Restore decisions keep the Key Result aligned to the market; Red decisions are unblocked before the waypoint is missed<\/td><\/tr><tr><td>Operational<\/td><td>Complexity Creep: structural responses accumulate and slow the organisation<\/td><td>Red decisions show the structures holding recoveries back, and unblocking removes them<\/td><\/tr><tr><td>Behavioural<\/td><td>Execution Regression: habits pull behaviour back once attention moves<\/td><td>The thermometer shows where norms are weakening; Review–Realign–Restore restores them before old habits take hold<\/td><\/tr><\/tbody><\/table><\/div><p>Execution Regression weakens the routines that detect drift on the other two lines; the quarterly reinforcement is that routine, kept in place every quarter.<\/p><\/div>"}};
