  .sheet .response-text{background:#faf8f1;}
  .sum-block,.response-label{break-inside:avoid;}

  var SB_URL="https://tayrxqbrttlrdowrzobm.supabase.co", SB_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRheXJ4cWJydHRscmRvd3J6b2JtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3ODAyOTUsImV4cCI6MjA5MjM1NjI5NX0.8eaQauK1GPI3OXyHLdRAfbSwLfaYLB3_amHt6FhZxG0";

  var supabaseClient=supabase.createClient(SB_URL,SB_ANON,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});

  var MICRO_CLIMB={"u1_foundations":{"html":"<div class=\"usum\" data-unit=\"1\" data-title=\"BEHAVIOURAL STRATEGY FUNDAMENTALS\"><div class=\"usum-comp\"><div class=\"usum-comp-l\">COMPETENCE DEVELOPED<\/div><div class=\"usum-comp-n\">Behavioural Strategic Decision-Making<\/div><p>The competent leader recognises how bias, emotion and functional perspective shape strategic choices. They bring diverse executive views together to reach sound enterprise judgement.<\/p><\/div><h2>Demonstrable skills<\/h2><ol type=\"1\"><li>Identify cognitive and functional bias in strategic decisions<\/li><li>Examine a strategic issue from each executive perspective<\/li><li>Apply institutional practices that build collective intelligence<\/li><\/ol><h2>The unit concept<\/h2><p>Strategy is a human process. People make strategic choices, and people interpret, respond to and execute those choices. The quality of a strategy depends on how leaders think, decide and behave, and on the thinking environment those behaviours create. Bias, functional perspective and emotional climate shape judgement at every phase of the strategy journey. Leaders protect that judgement by building collective intelligence into how strategy is conducted. Between 60% and 90% of strategies fail in delivery, and the failures fall into three areas: Direction failure (the strategy lacks clarity, coherence and enterprise perspective), Influence failure (people, decisions and conditions are not aligned behind it) and Grounding failure (intent does not become coordinated execution and sustained results).<\/p><h2>1. Behavioural strategy<\/h2><ul><li><strong>Definition (S2R®):<\/strong> the application of behavioural science to understand and improve how people think, decide and behave throughout the process of strategy, from shaping strategic choices to delivering results.<\/li><li><strong>The behavioural question:<\/strong> traditional strategy asks \"What should we do?\" Behavioural strategy asks first how the way we think shapes what we believe we should do, and what will shape how people respond and act.<\/li><li><strong>How we think:<\/strong> the assumptions, mental models and biases that shape what we notice and how we interpret it.<\/li><li><strong>How we decide:<\/strong> the judgements, trade-offs and influences that shape what we choose, prioritise and commit to.<\/li><li><strong>How we behave:<\/strong> how people respond, contribute, coordinate and act, which determines whether commitments reach the intended outcomes.<\/li><\/ul><h2>2. How judgement forms: the dual-process framework (Kahneman)<\/h2><ul><li><strong>System 1:<\/strong> fast, automatic, intuitive and pattern-based. It produces rapid, confident judgements, is vulnerable to bias and dominates under pressure.<\/li><li><strong>System 2:<\/strong> slow, deliberate and analytical. It is more reliable for complex problems, is easily overridden under time pressure and needs psychological safety to activate.<\/li><li>Recognising which system is dominant is the difference between a reactive impulse and a disciplined choice.<\/li><\/ul><h2>3. Functional bias and the Elephant Perspective<\/h2><ul><li><strong>Functional bias:<\/strong> the tendency to interpret a strategic issue, and what should be done about it, primarily from the perspective of our own function, expertise or area of responsibility.<\/li><li>Deep functional expertise creates invisible filters on what leaders notice, interpret, prioritise and believe needs doing. Left unexamined, these surface as execution friction: delayed decisions, misaligned KPIs and teams moving in different directions.<\/li><li><strong>The Elephant Perspective:<\/strong> each leader holds a partial truth. Strategic quality depends on the organisation's ability to surface partial truths, hold them in tension and integrate them into one understanding of reality.<\/li><\/ul><h2>4. The 20 cognitive biases<\/h2><p>A cognitive bias is a pattern in our thinking that systematically influences how we interpret information, make judgements and arrive at decisions.<\/p><h3>Action-Oriented Biases<\/h3><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Bias<\/strong><\/th><th><strong>Definition<\/strong><\/th><\/tr><\/thead><tbody><tr><td>Overconfidence<\/td><td>Over-estimating the accuracy of one's judgement or forecasts<\/td><\/tr><tr><td>Optimism<\/td><td>Expecting outcomes to be more positive than evidence supports<\/td><\/tr><tr><td>Illusion of Control<\/td><td>Believing outcomes are more controllable than they are<\/td><\/tr><tr><td>Planning Fallacy<\/td><td>Under-estimating the time, cost and complexity of execution<\/td><\/tr><tr><td>Confirmation<\/td><td>Seeking information that supports a preferred plan once momentum builds<\/td><\/tr><\/tbody><\/table><\/div><h3>Stability Biases<\/h3><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Bias<\/strong><\/th><th><strong>Definition<\/strong><\/th><\/tr><\/thead><tbody><tr><td>Anchoring<\/td><td>Over-reliance on initial numbers, assumptions or ideas<\/td><\/tr><tr><td>Status Quo<\/td><td>A preference for existing arrangements over change<\/td><\/tr><tr><td>Loss Aversion<\/td><td>Treating potential losses as more significant than equivalent gains<\/td><\/tr><tr><td>Sunk-Cost Fallacy<\/td><td>Continuing investment solely because of past effort or expense<\/td><\/tr><tr><td>Endowment Effect<\/td><td>Overvaluing assets or initiatives simply because they are \"ours\"<\/td><\/tr><\/tbody><\/table><\/div><h3>Interest Biases<\/h3><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Bias<\/strong><\/th><th><strong>Definition<\/strong><\/th><\/tr><\/thead><tbody><tr><td>Self-Interest<\/td><td>Favouring options that protect personal exposure or advantage<\/td><\/tr><tr><td>Functional / Silo<\/td><td>Viewing decisions mainly through a narrow departmental perspective<\/td><\/tr><tr><td>Incentive<\/td><td>Allowing reward structures to shape judgement without our noticing<\/td><\/tr><tr><td>Career-Risk<\/td><td>Avoiding decisions that could damage reputation or future prospects<\/td><\/tr><tr><td>Perspective<\/td><td>Interpreting strategy through the limited perspective of one's own expertise<\/td><\/tr><\/tbody><\/table><\/div><h3>Social Biases<\/h3><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Bias<\/strong><\/th><th><strong>Definition<\/strong><\/th><\/tr><\/thead><tbody><tr><td>Conformity<\/td><td>Aligning with the dominant group view to avoid friction<\/td><\/tr><tr><td>Authority<\/td><td>Deferring excessively to senior leaders or experts regardless of data<\/td><\/tr><tr><td>Groupthink<\/td><td>Prioritising group harmony over critical, objective evaluation<\/td><\/tr><tr><td>Availability<\/td><td>Giving undue weight to the most recent or vivid examples<\/td><\/tr><tr><td>Halo Effect<\/td><td>Allowing a person's reputation or status to influence judgement<\/td><\/tr><\/tbody><\/table><\/div><h2>5. What unexamined bias costs<\/h2><ul><li><strong>The White Space:<\/strong> the gap between what individual functions deliver and what the organisation needs those contributions to produce together. No one function is in charge there, and it is where the customer experience, the dependencies and the enterprise outcome come together.<\/li><li><strong>Three-point check:<\/strong> Functional Success (does my \"done\" create work or consequences for someone else?); White Space (if my dashboard is green and another part of the system is red, where is the disconnect?); Enterprise Consequence (when all contributions come together, has the enterprise won?).<\/li><li>Organisations with disciplined, bias-mitigating decision-making deliver returns about 6% higher than their peers (McKinsey). Poor behavioural awareness carries five hidden costs:<ul><li><strong>Misallocated Capital:<\/strong> Sunk-Cost and Endowment keep resources in legacy lines, while Overconfidence and Illusion of Control fuel ego acquisitions.<\/li><li><strong>Strategic Inertia:<\/strong> Anchoring, Status Quo and Loss Aversion hold the organisation to old models despite visible disruption.<\/li><li><strong>Execution Failure:<\/strong> Planning Fallacy, Optimism and Confirmation build plans that ignore internal friction.<\/li><li><strong>Innovation Suppression:<\/strong> Groupthink, Conformity and Career-Risk filter out transformative ideas and silence dissent.<\/li><li><strong>Purpose Drift:<\/strong> Self-Interest, Incentive and the Halo Effect of a quick win sacrifice long-term intent to short-term pressure.<\/li><\/ul><\/li><\/ul><h2>6. Where bias operates across the strategy journey<\/h2><p>Bias lives in processes as well as in people, wherever someone interprets information, imagines options, makes a choice or turns intent into action.<\/p><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Phase<\/strong><\/th><th><strong>Risk<\/strong><\/th><th><strong>Typical biases<\/strong><\/th><th><strong>Scanner question<\/strong><\/th><\/tr><\/thead><tbody><tr><td>Diagnosis<\/td><td>The wrong reality enters the strategy<\/td><td>Availability, Anchoring, Confirmation<\/td><td>If we stripped out everything we already believed, what would the remaining evidence tell us?<\/td><\/tr><tr><td>Option Generation<\/td><td>The solution space narrows before debate<\/td><td>Status Quo, Functional/Silo, Career-Risk, Groupthink, Conformity<\/td><td>What is the most disruptive option not yet on the table, and why is it not there?<\/td><\/tr><tr><td>Decision<\/td><td>The chosen path is flawed or skewed<\/td><td>Overconfidence, Loss Aversion, Authority, Halo Effect, Sunk-Cost, Endowment<\/td><td>If the proposer had no stake and no relationship with the team, would we make the same decision?<\/td><\/tr><tr><td>Execution<\/td><td>The strategy decays in delivery<\/td><td>Planning Fallacy, Confirmation, Incentive, Self-Interest, Functional<\/td><td>How are people interpreting what the strategy means for them, and are their contributions producing the intended enterprise outcome?<\/td><\/tr><\/tbody><\/table><\/div><h2>7. The emotional dimension of strategy<\/h2><ul><li><strong>Emotional climate as atmospheric pressure:<\/strong> the conditions around people shape their judgement. Emotional maturity is recognising and regulating your own responses so that pressure does not distort how you think, decide or engage. Managing the climate is a fiduciary responsibility of leadership.<\/li><li><strong>Three climates:<\/strong> Fear-Dominated (anxiety and defence → strategic paralysis; threat narrows thinking); Narcissism-Dominated (ego and validation → strategic delusion; thinking becomes one-sided); Grounded Confidence (curiosity and security → strategic agility; thinking stays open).<\/li><li><strong>Emotional alignment:<\/strong> name the state through which people experience the strategy, using Ekman's six emotions (Joy, Sadness, Anger, Fear, Disgust, Surprise), read through five factors: Engagement Energy, Morale Drain, Friction Load, Psychological Safety and Values Alignment. Unacknowledged emotional states silently override rational plans.<\/li><li><strong>Seven signals from emotion to evidence:<\/strong> name the emotional state; ask directly; observe behaviour; notice attention; watch energy and challenge; listen to the language; connect emotion to behaviour. Name → Observe → Connect.<\/li><\/ul><h2>8. Building collective intelligence<\/h2><p>The quality of strategy execution is a direct function of the quality of the thinking environment. Integration moves the leadership team from defending the part to designing the whole.<\/p><ul><li><strong>Six principles for debiasing strategy:<\/strong> separate ideation from evaluation; name the emotional temperature before the strategic content; assign a designated challenger; use pre-mortem analysis as standard; make the reference class visible; create after-action protocols.<\/li><li><strong>Three pillars of integration:<\/strong> Cognitive Integration (one version of the truth: every function explains how its information affects the others, the stress test); Behavioural Guardrails (friction built into decisions so the loudest or fastest voice does not win by default, the Challenge Clock); Emotional Stabilisation (moving the team from defensiveness to curiosity, with leaders admitting they do not have all the answers, naming the feeling).<\/li><li><strong>Ten institutional practices:<\/strong><ul><li><em>In the strategy room:<\/em> 72-Hour Pre-Read Mandate (Anchoring); Rotating Neutral Facilitation (Authority, Groupthink); Blind Ideation (Conformity, Halo Effect); the Challenge Clock (the action-oriented rush); Silent Deliberation (Availability).<\/li><li><em>In leadership culture:<\/em> Public Cognitive Humility (Overconfidence); Behavioural 360s (Self-Interest, Perspective); Debiasing Coaching (System 1 dominance); Safety Metrics (Innovation Suppression, Career-Risk); Strategic Post-Mortems (Hindsight Bias).<\/li><\/ul><\/li><\/ul><\/div>"},"u2m1_lens1":{"html":"<div class=\"usum\" data-unit=\"2\" data-title=\"STRATEGY VISIONING &amp;amp; SUCCESS IN PRACTICE (SiP)\"><div class=\"usum-comp\"><div class=\"usum-comp-l\">COMPETENCE DEVELOPED<\/div><div class=\"usum-comp-n\">Strategy Formulation<\/div><p>The competent leader designs a coherent strategy and gives the organisation one shared picture of success. Leaders across functions interpret it consistently and use it to guide decisions.<\/p><\/div><h2>Demonstrable skills<\/h2><ol type=\"1\"><li>Define a Strategy Architecture and create shared understanding of organisational position and direction<\/li><li>Crystallise a Strategy Intent Statement<\/li><li>Translate intent to future success and create one vision of Success in Practice<\/li><\/ol><h2>The unit concept<\/h2><p>A strategy becomes usable through three connected outputs. The Strategy Architecture holds the logic: the interconnected choices that determine what the organisation will do, why, how and when, how it creates, delivers and sustains value, for whom, and within what environment. The Strategy Intent Statement crystallises that architecture into one directional ambition. Success in Practice (SiP) makes the ambition observable by describing the organisational reality that must exist when the strategy is working. Once agreed, the Intent tests every initiative for strategic fit and SiP tests it for strategic contribution. Together they align leaders, filter decisions and keep execution coherent across functions.<\/p><h2>1. The S2R® definition of strategy<\/h2><p>\"Strategy is the output of iterative thinking, logic and process to determine what, why, how and when an organisation creates, delivers and sustains value to its stakeholders while navigating the forces within its operating environment.\" Every word carries strategic weight, and each concept in it is part of the architecture.<\/p><h2>2. The ten concepts in the definition<\/h2><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Concept<\/strong><\/th><th><strong>What it means<\/strong><\/th><th><strong>When it is missing<\/strong><\/th><\/tr><\/thead><tbody><tr><td>Output: a decided position<\/td><td>Strategy is a tangible, expressible, decided position<\/td><td>Strategy stays trapped in conversations and activity is mistaken for direction<\/td><\/tr><tr><td>Iterative: continuously refined<\/td><td>A hypothesis that loops: form, test against reality, revise, repeat<\/td><td>Strategy becomes doctrine, closed to evidence, until the organisation is blindsided<\/td><\/tr><tr><td>Thinking &amp; Logic: the cognitive engine<\/td><td>Divergent thinking explores; convergent logic tests what must be true. Both are needed in sequence<\/td><td>Wishful vision (thinking without logic) or analysis paralysis (logic without fresh thinking)<\/td><\/tr><tr><td>Process: the structured container<\/td><td>Converts ad hoc thinking into a repeatable, auditable method: who is involved, what inputs, what decisions at each stage<\/td><td>Strategy is brilliant but fragile and collapses when its carrier leaves<\/td><\/tr><tr><td>What · Why · How · When<\/td><td>The complete decision space: WHAT sets the domain, WHY the differentiating logic, HOW the operating model, WHEN the timing and sequencing<\/td><td>Structural incompleteness: WHAT and WHY without HOW and WHEN is vision without execution<\/td><\/tr><tr><td>Creates · Delivers · Sustains: the Value Triad<\/td><td>All three layers of value must be explicitly designed<\/td><td>Over-investment in creation and delivery, under-investment in the culture, financial health and relationships that make value durable<\/td><\/tr><tr><td>Stakeholders: broader than customers<\/td><td>Customers, employees, investors, communities, regulators and partners<\/td><td>Every ignored stakeholder group becomes a structural risk<\/td><\/tr><tr><td>Navigating<\/td><td>Deliberate, skilled reading of forces and intentional choice of how to move; a continuous discipline<\/td><td>The organisation becomes reactive and operates in permanent catch-up<\/td><\/tr><tr><td>The Forces<\/td><td>Five categories: competitive; macro-environmental; disruptive; social and environmental; internal (culture, habits, legacy identity, often working against the stated strategy)<\/td><td>Strategy is designed for a force environment that no longer exists<\/td><\/tr><tr><td>Operating Environment: the bounded context<\/td><td>The full system the organisation exists in: industry, economy, regulation, technology, social and physical environment<\/td><td>Strategy is treated as if it holds anywhere, and context shifts go unnoticed until results fall<\/td><\/tr><\/tbody><\/table><\/div><h2>3. The Strategy Architecture<\/h2><p>The 14 elements of the definition come together under five headings and are read as one strategic system:<\/p><ul><li><strong>Strategic Position:<\/strong> WHAT, WHY<\/li><li><strong>Strategic Model:<\/strong> HOW, WHEN<\/li><li><strong>Value Architecture:<\/strong> Creates Value, Delivers Value, Sustains Value, Stakeholders<\/li><li><strong>Strategic Navigation:<\/strong> Operating Environment, The Forces, Navigating<\/li><li><strong>Strategy Discipline:<\/strong> Thinking &amp; Logic, Iterative, Process<\/li><\/ul><p>The elements are interconnected: the value promised must be supported by the HOW, the WHEN must reflect the capabilities to be built, and the approach to sustaining value must respond to the forces in the environment. The architecture is read through one question: \"What is this architecture collectively saying about our organisation's strategy?\"<\/p><h2>4. The Strategy Intent Statement<\/h2><p>The Intent brings forward four dimensions from the architecture and crystallises them into one crisp, directional statement. The architecture holds the depth; the Intent gives the clarity.<\/p><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Dimension<\/strong><\/th><th><strong>Defines<\/strong><\/th><th><strong>Governs<\/strong><\/th><\/tr><\/thead><tbody><tr><td>WHAT · Scope &amp; Definition<\/td><td>The value the organisation has chosen to create and its field of play<\/td><td>Scope, portfolio, market choice, boundary-setting, capability focus<\/td><\/tr><tr><td>WHY · Purpose &amp; Rationale<\/td><td>The rationale for those choices and why they matter<\/td><td>Purpose, competitive differentiation, value proposition, identity<\/td><\/tr><tr><td>HOW · Mechanism &amp; Model<\/td><td>The operating model, capabilities and mechanisms that deliver the value<\/td><td>Operating model, processes, organisational design, technology, partnerships<\/td><\/tr><tr><td>WHEN · Timing &amp; Sequencing<\/td><td>The timing, sequencing and moves through which the ambition is pursued<\/td><td>Pacing, prioritisation, horizon planning, entry and exit decisions<\/td><\/tr><\/tbody><\/table><\/div><p>Test of the statement: \"Does this statement faithfully express the strategic ambition contained in our Architecture?\"<\/p><h2>5. Success in Practice (SiP)<\/h2><p>SiP defines what must be seen, experienced and executed for the Intent to become reality within a given time horizon. It is written from inside the future: \"If our Strategy Intent is successful, what should we see in practice?\" It describes observable reality and keeps initiatives, projects and activities out. Success is read across four domains:<\/p><ul><li><strong>D1 · Customer Experience &amp; Value:<\/strong> what customers and other value recipients experience when the intent is working.<\/li><li><strong>D2 · Operational Capability &amp; Execution Rhythm:<\/strong> how the organisation operates, coordinates, delivers and adapts.<\/li><li><strong>D3 · People &amp; Culture Dynamics:<\/strong> how people understand the intent, decide, collaborate, own and behave.<\/li><li><strong>D4 · Enterprise Value Creation:<\/strong> how the organisation benefits across its measures of enterprise success.<\/li><\/ul><h2>6. The three functions of Strategy Intent and SiP<\/h2><ul><li><strong>Strategic Alignment:<\/strong> the Intent anchors every leader to the same WHAT, WHY, HOW and WHEN; SiP gives one picture of the reality all functions work towards.<\/li><li><strong>Decision Filter:<\/strong> the Intent tests whether a choice is consistent with the strategic ambition; SiP tests whether it contributes to the conditions of success.<\/li><li><strong>Execution Coherence:<\/strong> the Intent anchors each mandate to the enterprise ambition; SiP shows what the combined contributions must produce.<\/li><\/ul><p>The Intent is the test of strategic fit. SiP is the test of strategic contribution.<\/p><h2>7. SiP observable indicators<\/h2><p>Each indicator is read in two positions: When Working (what is observed when the condition functions) and Signal of Absence (what becomes visible when it is weak or missing).<\/p><ul><li><strong>D1 · Customer Experience &amp; Value: the CARE Model.<\/strong> Customers meet the organisation through People, Processes, Products and Platforms and experience four forms of value: <strong>Connection<\/strong> (feeling understood, respected and supported), <strong>Access<\/strong> (quick, easy, reliable interaction through preferred channels), <strong>Results<\/strong> (solutions that solve their problems and perform as promised), <strong>Effort<\/strong> (simple, predictable processes, with complexity absorbed by the organisation).<\/li><li><strong>D2 · Operational Capability:<\/strong><strong>Priority Clarity<\/strong> (priorities explicit, stable and stated the same way by every leader); <strong>Decision Flow<\/strong> (decisions at the right level, with the right information, at the right speed); <strong>Cross-Functional Coordination<\/strong> (smooth hand-offs and governed white space); <strong>Delivery Rhythm<\/strong> (a predictable weekly, monthly and quarterly cadence).<\/li><li><strong>D3 · People &amp; Culture:<\/strong><strong>Cross-Boundary Collaboration<\/strong> (people solve problems that belong to no single function); <strong>Ownership Culture<\/strong> (people carry outcomes, beyond completing tasks); <strong>Strategic Alignment<\/strong> (people trace their daily actions to the strategic intent); <strong>Dialogue Quality<\/strong> (honest challenge surfaces before decisions are made).<\/li><li><strong>D4 · Enterprise Value:<\/strong><strong>Growth Trajectory<\/strong> (growth traceable to specific strategic choices); <strong>Profitability Quality<\/strong> (margin reflects deliberate value positioning); <strong>Market Position<\/strong> (stakeholders describe the organisation in the language the SiP predicted); <strong>Value Durability<\/strong> (talent, brand trust, infrastructure and relationships are reinvested in).<\/li><\/ul><h2>8. SiP Flammables: when the picture of success becomes distorted<\/h2><p>A Flammable arises when one legitimate perspective dominates and defines success for the whole organisation.<\/p><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Pattern<\/strong><\/th><th><strong>How the SiP reads<\/strong><\/th><th><strong>Strategic risk<\/strong><\/th><\/tr><\/thead><tbody><tr><td>D1 Dominant · Customer Only<\/td><td>A marketing aspiration: vivid on the customer, silent on how the experience is built and sustained<\/td><td>Execution capacity is underestimated; the promise outruns the capability, and cost to serve rises faster than revenue<\/td><\/tr><tr><td>D2 Dominant · Operations Only<\/td><td>A process optimisation plan: efficient and measurable, stripped of customer meaning and culture<\/td><td>The organisation improves its machine and loses sight of what the machine is for; people comply without owning outcomes<\/td><\/tr><tr><td>D3 Dominant · People Only<\/td><td>An organisational development narrative: rich in values, commercially unanchored<\/td><td>Culture work disconnects from commercial outcomes and becomes the first budget cut under pressure<\/td><\/tr><tr><td>D4 Dominant · Value Only<\/td><td>A financial target: measurable, motivationally thin<\/td><td>Leaders optimise metrics without creating the conditions that produce them; short-termism passes for strategic clarity<\/td><\/tr><\/tbody><\/table><\/div><p>A credible SiP shows observable evidence in every domain (depth) and holds the four domains in balance.<\/p><\/div>"},"u2m1_lens2":{"html":"<div class=\"usum\" data-unit=\"3\" data-title=\"SiP KISS MAPPING &amp;amp; OKR DEFINITION\"><div class=\"usum-comp\"><div class=\"usum-comp-l\">COMPETENCE DEVELOPED<\/div><div class=\"usum-comp-n\">Strategy Translation and Goal Setting<\/div><p>The competent leader turns strategic ambition into enterprise priorities and measurable results. Every priority has a clear line of sight to the intended future.<\/p><\/div><h2>Demonstrable skills<\/h2><ol type=\"1\"><li>Apply KISS to decide what to keep, improve, start and stop<\/li><li>Translate KISS decisions into Objectives and Key Results<\/li><li>Connect Key Results to Success in Practice<\/li><\/ol><h2>The unit concept<\/h2><p>Success in Practice describes the future organisation. Execution begins with an honest reading of the present against that future: what must change today to make it possible? KISS passes the SiP through four filters and names the changes the organisation must make. Objectives and Key Results (OKRs) turn those changes into measurable commitments. The sequence SiP → KISS → OKRs is what makes OKRs hold in execution: Objectives that rest on an honest assessment of operating reality, and Key Results that prove movement towards the SiP.<\/p><h2>1. KISS: Keep · Improve · Start · Stop<\/h2><p>KISS is the bridge between the future described in the SiP and the present operating reality. Every KISS reflection is anchored to the SiP statements.<\/p><ul><li><strong>KEEP:<\/strong> protect what is already working. Practices, capabilities and behaviours already moving the organisation towards the SiP.<\/li><li><strong>IMPROVE:<\/strong> strengthen what is partially working. Areas moving in the right direction where performance, coordination or capability must strengthen.<\/li><li><strong>START:<\/strong> introduce what does not yet exist. New practices, capabilities or initiatives the SiP requires.<\/li><li><strong>STOP:<\/strong> eliminate what contradicts the SiP. Activities, routines or commitments that consume energy without contributing to the future described.<\/li><\/ul><h2>2. The KISS questions across the four SiP domains<\/h2><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Domain<\/strong><\/th><th><strong>Anchor question<\/strong><\/th><th><strong>Keep<\/strong><\/th><th><strong>Improve<\/strong><\/th><th><strong>Start<\/strong><\/th><th><strong>Stop<\/strong><\/th><\/tr><\/thead><tbody><tr><td>Customer Experience &amp; Value<\/td><td>What should customers consistently experience?<\/td><td>Aspects of the customer experience that already move us towards the SiP<\/td><td>Good outcomes with recurring friction that weakens reliability or responsiveness<\/td><td>New practices or capabilities customers need to experience the SiP<\/td><td>Processes or behaviours that create friction and contradict the SiP<\/td><\/tr><tr><td>Operational Capability &amp; Execution Rhythm<\/td><td>How will the organisation operate differently?<\/td><td>Routines that already support the execution rhythm<\/td><td>Capability slowed by delays, coordination gaps or decision bottlenecks<\/td><td>New execution rhythms, coordination practices or decision frameworks<\/td><td>Processes, reports or meetings that consume effort without strengthening execution<\/td><\/tr><tr><td>People &amp; Culture Dynamics<\/td><td>How will leaders and teams work together?<\/td><td>Leadership behaviours and collaboration patterns that reinforce the culture<\/td><td>Positive teamwork with inconsistent accountability or unclear ownership<\/td><td>New leadership habits or collaboration norms<\/td><td>Behaviours, informal norms or practices that undermine alignment or trust<\/td><\/tr><tr><td>Enterprise Value Creation<\/td><td>What financial reality should we see?<\/td><td>Activities or revenue streams that already support value creation<\/td><td>Positive results with margin pressure or inefficient resource use<\/td><td>New investments, capabilities or revenue engines<\/td><td>Initiatives that consume resources without contributing to value creation<\/td><\/tr><\/tbody><\/table><\/div><h2>3. OKR anatomy<\/h2><ul><li><strong>Objectives<\/strong> define strategic ambition. They are qualitative, ambitious, action-oriented, inspirational and memorable: \"If you cannot wear it on a T-shirt, it is not worth pursuing.\"<\/li><li><strong>Key Results<\/strong> define measurable progress. Formula: <strong>Verb of Change + Metric + From X to Y + By Deadline.<\/strong> Example: Increase digital transaction completion rate from 40% to 75% of total transactions by Q4 2026.<ul><li><em>Verb of Change:<\/em> the direction of improvement (Increase, Reduce, Achieve, Improve, Maintain).<\/li><li><em>Metric:<\/em> a clear, measurable indicator.<\/li><li><em>From X to Y:<\/em> the baseline and the target; a starting point is always established.<\/li><li><em>Deadline:<\/em> when the result must be achieved.<\/li><\/ul><\/li><li><strong>Outcomes and tasks:<\/strong> OKRs define outcomes. A statement that can be checked off a task list (\"launch new platform\", \"run customer survey\") is an activity that supports a Key Result. Key Results describe the impact those activities must produce.<\/li><\/ul><h2>4. Five steps from KISS to OKRs<\/h2><ol type=\"1\"><li><strong>Find Themes.<\/strong> Read the KISS reflection one SiP domain at a time, reading each domain's Improve and Start entries together, and name the one shift the domain must make. A theme names a shift in a few words (\"Customer responsiveness\", \"Execution speed\"). Stop entries are once-off decisions acted on directly; Keep entries are what the organisation protects while it shifts; neither becomes a theme. One theme per domain gives four themes that cover the whole SiP.<\/li><li><strong>Inspiring Objectives.<\/strong> Translate each theme into a bold, qualitative statement of transformation that starts with a verb: \"If the organisation pulls this off, what will customers and competitors say it is known for?\" Ambitious, qualitative, memorable.<\/li><li><strong>Define Key Results.<\/strong> Two to three measurable results per Objective, each describing a meaningful shift in performance and following the Key Result formula.<\/li><li><strong>Alignment Test.<\/strong> Does this get the organisation closer to the shared SiP vision? Would fellow leaders see it as a win for the whole organisation or for one function? Does it visibly improve culture, operations or value creation? Is there clear accountability for delivering it?<\/li><li><strong>Prioritisation Matrix.<\/strong> Each initiative is placed by Impact (strategic value if achieved) and Effort (time, resources, coordination and change required).<\/li><\/ol><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><\/th><th><strong>Low effort<\/strong><\/th><th><strong>Medium effort<\/strong><\/th><th><strong>High effort<\/strong><\/th><\/tr><\/thead><tbody><tr><td><strong>High impact<\/strong><\/td><td>Strategic Catalysts: quick breakthroughs that accelerate momentum<\/td><td>Accelerated Enablers: need coordination, deliver strong value<\/td><td>Core Strategic Drivers: major transformations essential to the SiP<\/td><\/tr><tr><td><strong>Medium impact<\/strong><\/td><td>Quick Efficiency Plays: better performance for minimal effort<\/td><td>Targeted Growth Projects: contribute, but are not immediate priorities<\/td><td>Heavy Investment Candidates: significant resources, careful timing<\/td><\/tr><tr><td><strong>Low impact<\/strong><\/td><td>Supportive Enablers: helpful, non-critical<\/td><td>Marginal Utility Tasks: limited return for the effort<\/td><td>Resource Pitfalls: high energy, little strategic value<\/td><\/tr><\/tbody><\/table><\/div><p>Strategic Catalysts, Accelerated Enablers and Core Strategic Drivers carry the highest-leverage execution signals.<\/p><h2>5. Why the KISS-to-OKR sequence matters<\/h2><p>When leaders move straight from vision to hard targets, three human problems emerge:<\/p><ul><li><strong>Disconnected Targets:<\/strong> people chase numbers without acknowledging the hurdles that make them nearly impossible.<\/li><li><strong>Fragmented Efforts:<\/strong> functions row in different directions because they have not agreed what success looks like in practice.<\/li><li><strong>The Activity Trap:<\/strong> people measure busyness because they are unsure how to prove real outcomes.<\/li><\/ul><p>The organisation ends up measuring the finish line before it has mapped the terrain. The Strategy2Results® sequence prevents this: <strong>Success in Practice<\/strong> (where the organisation wants to be) → <strong>KISS<\/strong> (the honest look at the changes required) → <strong>OKRs<\/strong> (the measurable steps that prove movement). Respected in this order, OKRs become a way for the organisation to learn, align and prove progress.<\/p><\/div>"},"u2m1_lens3":{"html":"<div class=\"usum\" data-unit=\"4\" data-title=\"DIRECTION INTEGRITY (ABCV-MBT)\"><div class=\"usum-comp\"><div class=\"usum-comp-l\">COMPETENCE DEVELOPED<\/div><div class=\"usum-comp-n\">Strategic Validation and Risk Assessment<\/div><p>The competent leader tests strategic choices against customer reality, competitive conditions and critical assumptions. Weaknesses surface while direction can still be corrected.<\/p><\/div><h2>Demonstrable skills<\/h2><ol type=\"1\"><li>Test Key Results against Arena, Boundaries, Competition and Value Proposition<\/li><li>Recognise role-based ABCV blind spots and assign who verifies them<\/li><li>Recognise the Industry Illusion traps of familiarity, exclusion and complacency<\/li><\/ol><h2>The unit concept<\/h2><p>An Objective can be clear, measurable and ambitious and still rest on assumptions nobody has tested. Most strategies fail because of unnamed conditions that surface only once execution begins, when the cost of correction is highest. ABCV interrogates whether an agreed direction is sound enough to carry into execution, at four checkpoints: Arena, Boundaries, Competition and Value Proposition. At each checkpoint, MBT (Must-Be-True) names the load-bearing condition that must hold for the Objective to survive. Naming these conditions early creates an early-warning system. The Industry Illusion weakens this test by narrowing what leaders examine.<\/p><h2>1. ABCV-MBT: the four integrity checkpoints<\/h2><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Checkpoint<\/strong><\/th><th><strong>Question<\/strong><\/th><th><strong>Strategic logic<\/strong><\/th><\/tr><\/thead><tbody><tr><td>A · Arena (Customer End Game)<\/td><td>What is the customer ultimately trying to achieve?<\/td><td>We compete for a customer need. Defining the arena by our products or industry misses what the customer is trying to accomplish<\/td><\/tr><tr><td>B · Boundaries (Friction Architecture)<\/td><td>What could constrain our ability to deliver within this Arena?<\/td><td>Every arena has invisible walls. A strategy that ignores friction is a wish<\/td><\/tr><tr><td>C · Competition (The True Landscape)<\/td><td>Who or what else can satisfy the same Customer End Game?<\/td><td>Once the arena is defined by the customer's need, competitors include anyone who solves the same problem in a different way<\/td><\/tr><tr><td>V · Value Proposition (Coherent Advantage)<\/td><td>Why should the customer choose the value we create?<\/td><td>Strategy wins through distinctiveness. Every Objective should strengthen the organisation's distinctive edge<\/td><\/tr><\/tbody><\/table><\/div><p>The logic runs in sequence: define the Arena → understand the Boundaries → see the Competition → establish the Value Proposition, naming at each step what <strong>Must Be True (MBT)<\/strong>. ABCV asks whether the strategic logic underneath an Objective can survive reality.<\/p><p><strong>What the test secures:<\/strong> strategic priorities that are anchored in customer reality, designed to withstand operational constraints, positioned accurately against the competitive landscape and coherent with the organisation's core value.<\/p><h2>2. Arena: the Customer End Game<\/h2><p>The Industry tells you who you think you are competing with. The Arena tells you who you are actually competing with. The Customer End Game is interrogated at three depths:<\/p><ul><li><strong>Functional:<\/strong> what is the customer trying to achieve? The immediate practical outcome: what needs to get done, solved, accessed, changed or achieved. It prevents confusing what the organisation sells with what the customer needs accomplished.<\/li><li><strong>Experiential:<\/strong> what matters about how they achieve it? The conditions under which the outcome is achieved: speed, convenience, reliability, safety, flexibility, simplicity, confidence, accessibility, effort. Two organisations can solve the same functional problem while creating very different experiences.<\/li><li><strong>Consequential:<\/strong> what does achieving it ultimately enable? What becomes possible, better or different for the customer afterwards: the result behind the result.<\/li><\/ul><p>These are three depths of one need, read together to define the Customer End Game.<\/p><ul><li><strong>Arena MBT:<\/strong> what condition must remain true about customer need, behaviour or demand for this Arena to remain strategically relevant?<\/li><\/ul><h2>3. Boundaries: the friction architecture<\/h2><p>Defining the right Arena does not by itself mean the organisation can succeed in it. Boundaries are the conditions that enable, restrict or shape what can be delivered:<\/p><ul><li><strong>Regulatory:<\/strong> laws, licences, standards, accreditation.<\/li><li><strong>Operational:<\/strong> processes, infrastructure, capacity, supply chains.<\/li><li><strong>Technological:<\/strong> systems, data, interoperability, technical capability.<\/li><li><strong>Structural:<\/strong> governance, decision rights, organisational dependencies.<\/li><li><strong>Financial:<\/strong> capital, affordability, economics, funding.<\/li><li><strong>Behavioural:<\/strong> capability, incentives, resistance, habits, adoption.<\/li><\/ul><p>The focus is on boundaries material enough to affect the strategic outcome, with no long risk register. Each boundary is one of three kinds: a boundary we must <strong>accept<\/strong> (legislation), a boundary we can <strong>influence<\/strong> (an industry standard), or a boundary we <strong>created ourselves<\/strong> (an internal process, structure or policy), which is the one the organisation can change.<\/p><ul><li><strong>Boundary MBT:<\/strong> what condition must remain true operationally, structurally or regulatorily for this strategic direction to be deliverable?<\/li><\/ul><h2>4. Competition: alternatives to the end game<\/h2><p>Competition follows Arena. When the Arena is defined around the Customer End Game, the competitive field widens. A competitor does not have to look like us, sell the same product, use the same business model or belong to the same industry. It only needs to offer the customer a credible alternative route to the outcome. The question moves from \"Who sells something similar to us?\" to \"What alternatives does the customer have for achieving the end game?\" Alternatives include doing it internally, doing it themselves, using technology instead, postponing it, choosing a completely different solution, or doing nothing.<\/p><ul><li><strong>Competition MBT:<\/strong> what condition must remain true about our advantage relative to the customer's alternatives?<\/li><\/ul><h2>5. Value Proposition: coherent advantage<\/h2><p>Attributes such as high quality, customer focus, innovation, excellent service or experienced people are positive and do not by themselves establish strategic value. The interrogation is: what combination of value do we create that matters to this customer, in this Arena, relative to the alternatives available? Three tests:<\/p><ul><li><strong>Relevance:<\/strong> does it matter? It addresses something important in the Customer End Game.<\/li><li><strong>Distinctiveness:<\/strong> does it differentiate? Credible alternatives cannot make essentially the same claim.<\/li><li><strong>Deliverability:<\/strong> can we consistently produce it? The organisation has the capability and system to deliver it repeatedly.<\/li><\/ul><h2>Relevant + Distinctive + Deliverable = Strategic Value.<\/h2><ul><li><strong>Value Proposition MBT:<\/strong> what condition must remain true about our value architecture for this proposition to remain relevant, distinctive and economically sustainable?<\/li><\/ul><h2>6. Applying ABCV-MBT to an Objective<\/h2><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Checkpoint<\/strong><\/th><th><strong>Question for the Objective<\/strong><\/th><th><strong>Must-Be-True condition<\/strong><\/th><\/tr><\/thead><tbody><tr><td>Arena<\/td><td>Which part of the Customer End Game does this Objective serve: functional, experiential or consequential?<\/td><td>What must remain true about that need for the Objective to stay relevant?<\/td><\/tr><tr><td>Boundaries<\/td><td>What internal or external friction could slow this Objective down or stop it entirely?<\/td><td>What must remain true operationally or regulatorily for us to deliver it without breaking?<\/td><\/tr><tr><td>Competition<\/td><td>Who else is solving this problem, even if they look nothing like us?<\/td><td>What must remain true about our specific advantage compared to these options?<\/td><\/tr><tr><td>Value Proposition<\/td><td>Does this Objective sharpen our distinctive edge or add noise?<\/td><td>What must remain true about our value architecture for the Objective to stay coherent and profitable?<\/td><\/tr><\/tbody><\/table><\/div><p>Four checkpoints give four conditions. If one of them shifts or fails, the Objective becomes fragile by design.<\/p><h2>7. The Industry Illusion<\/h2><p>Industry knowledge is essential to strategy, and it also creates a frame through which leaders interpret their environment. The Industry Illusion occurs when that frame becomes so familiar that it is treated as the boundary of what is strategically relevant. It forms through three reinforcing traps:<\/p><ul><li><strong>Familiarity, \"We know this industry\":<\/strong> what we know becomes what we expect to keep seeing. Risk: the future is interpreted through patterns established by the past.<\/li><li><strong>Exclusion, \"We discount what doesn't fit it\":<\/strong> signals outside the familiar picture are seen and then excluded from serious consideration. Risk: what does not fit the industry frame gets underestimated.<\/li><li><strong>Complacency, \"We become confident in the world we can see\":<\/strong> current performance appears to validate the established view. Risk: evidence of current success becomes reassurance about future relevance.<\/li><\/ul><p>Familiarity → Exclusion → Complacency → <strong>Industry Illusion: the industry we understand becomes the boundary of the world we examine.<\/strong> Defining the market by customer outcomes widens the field of competition leaders see and test.<\/p><\/div>"},"u3m1_lens4":{"html":"<div class=\"usum\" data-unit=\"5\" data-title=\"ALIGNING HEART &amp;amp; MIND\"><div class=\"usum-comp\"><div class=\"usum-comp-l\">COMPETENCE DEVELOPED<\/div><div class=\"usum-comp-n\">Change Leadership and People Alignment<\/div><p>The competent leader builds the understanding and commitment that strategy needs from people. They lead change through readiness, resistance and adoption so that new behaviours last.<\/p><\/div><h2>Demonstrable skills<\/h2><ol type=\"1\"><li>Use the OCEAVL Assessment to adapt how you lead change<\/li><li>Lead change through the 4 Checks of Mind, Heart, Hands and Habit and move people from compliance to commitment<\/li><li>Align the leadership team to lead change with one voice<\/li><\/ol><h2>The unit concept<\/h2><p>Strategy enters an organisation through people. Before it becomes operational activity, it passes through two human filters: cognition (Mind), which shapes how people interpret it, and emotion (Heart), which shapes how they experience it. Together they decide whether strategy produces clarity or confusion, commitment or compliance, momentum or hesitation. Every Key Result that asks people to work differently brings a change with it, and a change creates value only when it moves from installed to adopted. Leaders carry people across that gap through four checks (Mind, Heart, Hands and Habit), each with one tool, and the leadership team protects all four checks by leading with one voice.<\/p><h2>1. The two human filters<\/h2><ul><li><strong>Cognition (Mind):<\/strong> how individuals interpret what the strategy means, shaped by professional expertise, mental shortcuts, past experience and risk perception.<\/li><li><strong>Emotion (Heart):<\/strong> how individuals experience the strategy, shaping engagement energy, morale, friction load, psychological safety and values alignment.<\/li><\/ul><p>Strategy is fundamentally a human interpretation problem: when perspectives diverge, capable executives pull the organisation in different directions.<\/p><h2>2. The five principles of aligning Heart and Mind<\/h2><ol type=\"1\"><li><strong>Strategy moves through people.<\/strong> It passes through a five-link chain: <strong>Interpretation<\/strong> (making sense of what the strategy means) → <strong>Experience<\/strong> (feeling it: energised, uncertain, threatened or hopeful) → <strong>Choices<\/strong> (deciding what to prioritise, resource, protect, stop or support) → <strong>Actions<\/strong> (follow-through, handovers, routines, ownership) → <strong>Results<\/strong> (which emerge when thinking is clear, feeling aligned, decisions coherent and behaviour disciplined). When any link is weak, execution leaks.<\/li><li><strong>Misalignment fragments effort.<\/strong> Three symptoms: <strong>Chinese Whispers<\/strong> (intent mutates as it travels down), <strong>Clarification Debt<\/strong> (60–80% of leadership time spent re-explaining and realigning) and <strong>Silent Disengagement<\/strong> (outward compliance, inward withdrawal). Low-alignment organisations show 41% lower productivity and 48% higher turnover (Gallup; PMI).<\/li><li><strong>Alignment must be designed.<\/strong> Structured interventions make interpretation and emotional climate visible: the <strong>OCEAVL Assessment<\/strong> (psychological tendencies in executive decision-making) and the <strong>Emotional Climate Assessment<\/strong> (the prevailing state across Joy, Sadness, Anger, Fear, Disgust, Surprise).<\/li><li><strong>Human reactions are predictable.<\/strong> The brain processes social change with the same threat circuitry as physical danger, so any new goal, system or way of working is evaluated emotionally before rationally (SCARF Model, David Rock).<\/li><li><strong>Execution must be visible in behaviour.<\/strong> Alignment becomes visible, measurable and sustainable through behavioural standards: the five ACE-IT behaviours.<\/li><\/ol><h2>3. Change management: the event and the transition<\/h2><p>Change management is the leadership discipline of moving people from current practice to the practice the strategy requires.<\/p><ul><li><strong>The event<\/strong> is the change announced on a date. It belongs to the organisation.<\/li><li><strong>The transition<\/strong> is what each affected person goes through afterwards: letting go of a familiar practice, working out what the new one asks, and becoming able to do it. It belongs to the person.<\/li><\/ul><p>Leaders complete their own transition before the announcement; for the people who carry the change, it begins on that day. This gap in timing explains much of the friction after an announcement: leaders grow impatient, and people read the impatience as pressure.<\/p><h2>4. The 4 Checks of Mind, Heart, Hands and Habit<\/h2><p>A change is adopted when it passes four checks for the people it affects.<\/p><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Check<\/strong><\/th><th><strong>Question<\/strong><\/th><th><strong>Tool<\/strong><\/th><th><strong>Leader's job<\/strong><\/th><th><strong>Complete when<\/strong><\/th><\/tr><\/thead><tbody><tr><td>Mind<\/td><td>Do they understand the change, why it matters and what they do differently?<\/td><td>3S<\/td><td>Explain<\/td><td>Three people from the affected group give the same Shift, Stake and Step<\/td><\/tr><tr><td>Heart<\/td><td>Do they want it to succeed?<\/td><td>SCARF<\/td><td>Involve<\/td><td>The people affected can point to a part of the change they shaped<\/td><\/tr><tr><td>Hands<\/td><td>Are they able to do it?<\/td><td>STAT<\/td><td>Equip<\/td><td>A person performs the new practice end to end without asking permission or using a workaround<\/td><\/tr><tr><td>Habit<\/td><td>Has it become the way they work?<\/td><td>ACE-IT<\/td><td>Reinforce<\/td><td>The practice holds through a full review period with the leader absent<\/td><\/tr><\/tbody><\/table><\/div><p><strong>Why the order matters:<\/strong> each check depends on the one before it. A change stalls at the first check it fails, and that check is where effort belongs. A team that understands a change and resents it has stalled at Heart; more explanation will not move it. A team that wants it and lacks authority has stalled at Hands; more encouragement will not move it. A team that drifted back after a month has stalled at Habit; a relaunch will not hold it. Industry parallel: the Prosci ADKAR® Model (Awareness, Desire, Knowledge, Ability, Reinforcement).<\/p><h2>5. The 3S Check: the Mind tool<\/h2><p>Each person rebuilds the leader's message through their own expertise, shortcuts, experience and sense of risk. Mind passes when people can state three things in their own words.<\/p><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Element<\/strong><\/th><th><strong>Question<\/strong><\/th><th><strong>What it is<\/strong><\/th><th><strong>Execution cost when missing<\/strong><\/th><\/tr><\/thead><tbody><tr><td>Shift<\/td><td>What is changing?<\/td><td>The practice that ends and the practice that begins, for a named group, from a named date<\/td><td>Chinese Whispers: each function executes its own version<\/td><\/tr><tr><td>Stake<\/td><td>What do we gain if we change, and what do we lose if we stay as we are?<\/td><td>Why the change matters, stated as gain and loss together in the group's own terms, because people weigh a loss more heavily than an equal gain<\/td><td>Compliance without conviction: carried out while watched, set aside under pressure<\/td><\/tr><tr><td>Step<\/td><td>What do I do differently?<\/td><td>The person's own part, in the first person, small enough to do next week, with a Step for each affected role<\/td><td>Agreement without movement: endorsed in meetings, absent from daily work<\/td><\/tr><\/tbody><\/table><\/div><h2>6. The SCARF Model: the Heart tool<\/h2><p>People value five things at work. When a change puts one at risk, the brain reads it as a threat and the person holds back energy, even while understanding the change.<\/p><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Threat<\/strong><\/th><th><strong>The person asks<\/strong><\/th><th><strong>Set off by<\/strong><\/th><th><strong>Execution cost<\/strong><\/th><th><strong>Counter<\/strong><\/th><\/tr><\/thead><tbody><tr><td>Status<\/td><td>Will this reduce my importance?<\/td><td>New leaders, KPIs exposing performance, systems shifting expertise, changed reporting lines<\/td><td>Political friction, slowed decisions<\/td><td>Acknowledge existing standing; involve senior people in designing the new structures<\/td><\/tr><tr><td>Certainty<\/td><td>Do I know what success looks like?<\/td><td>New goals, ambiguous ownership, changing metrics or timelines<\/td><td>Loss of momentum, paralysis, risk avoidance<\/td><td>Set visible early milestones<\/td><\/tr><tr><td>Autonomy<\/td><td>Am I losing control of my work?<\/td><td>New systems, standardised processes, centralised decision rights, more oversight<\/td><td>Low energy, mechanical execution<\/td><td>Fix the what; offer a bounded choice on the how<\/td><\/tr><tr><td>Relatedness<\/td><td>Do I still belong here?<\/td><td>Restructuring, new hires, cross-functional initiatives, hybrid shifts<\/td><td>Trust erosion, coordination breakdown<\/td><td>Keep teams connected through regular shared touchpoints<\/td><\/tr><tr><td>Fairness<\/td><td>Is this being applied equitably?<\/td><td>Uneven workload, selective enforcement, inconsistent rewards, unclear rationale<\/td><td>Morale drain, cultural decay<\/td><td>Explain the reasons behind decisions, especially uneven ones<\/td><\/tr><\/tbody><\/table><\/div><h2>7. The STAT Check: the Hands tool<\/h2><p>Hands depends mostly on conditions leaders set. A person unable to perform a change looks like one who is unwilling, and persuasion will not close a missing decision right or a system that still fits the old way.<\/p><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Element<\/strong><\/th><th><strong>Question<\/strong><\/th><th><strong>Execution cost when missing<\/strong><\/th><th><strong>Leader's move<\/strong><\/th><\/tr><\/thead><tbody><tr><td>Skill<\/td><td>Do they know how to do it?<\/td><td>Quality falls when the change needs to prove itself, and the old way looks safer<\/td><td>Teach, practise on real work and coach on the job<\/td><\/tr><tr><td>Time<\/td><td>Do they have the hours to do it?<\/td><td>The change lives in quiet weeks and disappears in busy ones<\/td><td>Take old work away before adding new work<\/td><\/tr><tr><td>Authority<\/td><td>Are they allowed to decide and act?<\/td><td>The change runs slower than the practice it replaced, and the leader becomes the bottleneck<\/td><td>Set the decision limit, state it openly, back the first decisions<\/td><\/tr><tr><td>Tools<\/td><td>Do they have the systems and resources?<\/td><td>Two versions of the truth, extra effort, hidden errors<\/td><td>Provide access and budget before the start date; retire the old route<\/td><\/tr><\/tbody><\/table><\/div><p>One missing element is enough to stop people who understand and want the change.<\/p><h2>8. ACE-IT: the Habit tool<\/h2><p>A practice becomes habit when it is repeated, noticed and expected. ACE-IT turns reinforcement into five observable behaviours, each closing one route by which the old way returns.<\/p><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Behaviour<\/strong><\/th><th><strong>Definition<\/strong><\/th><th><strong>Gap it closes<\/strong><\/th><th><strong>What to decide for each new practice<\/strong><\/th><\/tr><\/thead><tbody><tr><td>Accountability<\/td><td>Taking full ownership for results; acknowledging missteps and driving corrective action<\/td><td>A practice with no owner<\/td><td>Who owns the practice and its result, and what the owner does when it slips<\/td><\/tr><tr><td>Commitment<\/td><td>Staying anchored to agreed intent when pressure rises; following through despite discomfort<\/td><td>A practice dropped under pressure<\/td><td>What must hold when pressure rises, and which work gives way<\/td><\/tr><tr><td>Engagement<\/td><td>Involving self and others in sense-making, dialogue and execution; listening to understand<\/td><td>Problems nobody raises<\/td><td>Where and how often the people doing the practice raise problems and improve it<\/td><\/tr><tr><td>Integrity<\/td><td>Acting consistently with values, facts and truth, even when inconvenient<\/td><td>Slips that are hidden<\/td><td>How slips are reported, by whom and how early<\/td><\/tr><tr><td>Transparency<\/td><td>Making reasoning, progress and constraints visible to all stakeholders<\/td><td>Results nobody can see<\/td><td>Where the result is shown, how often and to whom<\/td><\/tr><\/tbody><\/table><\/div><p>ACE-IT definitions are independent of the organisation's stated values: they are the minimum behavioural standard for any leadership team serious about execution.<\/p><h2>9. Why Heart and Mind alignment determines execution<\/h2><ul><li><strong>Potential and kinetic energy:<\/strong> a strategy holds potential energy on paper. It becomes kinetic energy only when people put effort into the work. The <strong>ignition point<\/strong> is the moment a person decides: \"This matters to me, and I will put my effort into making it succeed.\" Mind makes the direction clear enough to act on; Heart makes it matter enough to act on.<\/li><li><strong>Compliance and commitment:<\/strong> compliance (Mind only) means people act because authority, rules or monitoring require it; progress is mechanical and brittle and stalls when attention moves. Commitment (Mind and Heart) means people understand, believe and own their part; progress is self-driven and resilient and continues when leaders are absent.<\/li><li><strong>The payoff:<\/strong> aligned people act with ownership, functions coordinate around shared Key Results, rework and escalation fall, and leadership capacity is preserved for decisions that need it.<\/li><\/ul><h2>10. From installed to adopted<\/h2><ul><li><strong>Installed:<\/strong> the new system, structure or measure exists and people have been told. It delivers cost. Installation is a project task.<\/li><li><strong>Adopted:<\/strong> people work the new way every day without being watched. It delivers value. Adoption is a change in behaviour, group by group.<\/li><li><strong>The adoption gap<\/strong> is the time between the two: the organisation carries two ways of working, leaders spend more time checking compliance, the expected benefits are not earned, and people learn that a change can be waited out.<\/li><\/ul><p>Three steps close the gap: (1) name the new practice, the old practice it replaces and every group that must adopt it; (2) take each group through Mind, Heart and Hands, starting at the first check it has not passed; (3) reinforce with ACE-IT in every review until the practice holds without the leader. 81% of those who planned for reinforcement met or exceeded their project objectives (Prosci).<\/p><h2>11. The OCEAVL Assessment<\/h2><p>A 360-degree reflection of the leadership team's behavioural dynamics across seven dimensions, and a guardrail for strategic risk. Every level of every trait carries a risk if left unmanaged.<\/p><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Dimension<\/strong><\/th><th><strong>Low: strategic risk<\/strong><\/th><th><strong>Balanced: strategic risk<\/strong><\/th><th><strong>High: strategic risk<\/strong><\/th><\/tr><\/thead><tbody><tr><td>Openness (curiosity, creativity, adaptability)<\/td><td>Decisions stall waiting for certainty; legacy approaches; market shifts seen late<\/td><td>Discomfort avoided; evidence-heavy culture slows experiments; incremental gains only<\/td><td>Too many ideas fragment focus; initiatives start without finishing<\/td><\/tr><tr><td>Conscientiousness (discipline, planning, follow-through)<\/td><td>Commitments missed; quality varies; outcomes lack ownership<\/td><td>Sustained load erodes reliability; steps skipped under pressure<\/td><td>Over-planning delays action; perfectionism blocks \"good enough\"<\/td><\/tr><tr><td>Extraversion (outward energy, communication)<\/td><td>Insights stay unspoken; stress causes withdrawal<\/td><td>Meetings drift; consensus delays decisions<\/td><td>Dominant voices crowd out data; action runs ahead of evidence<\/td><\/tr><tr><td>Agreeableness (harmony, conflict management)<\/td><td>Conflict turns defensive; ego overrides outcomes<\/td><td>Feedback delayed; harmony masks unresolved risk<\/td><td>Agreement without commitment; over-commitment; hidden resentment<\/td><\/tr><tr><td>Emotional Stability (composure under pressure)<\/td><td>Impulsive decisions; errors hidden out of fear<\/td><td>Emotional signals missed; calm misread as indifference<\/td><td>Calm read as distance; problems overlooked; frontline disconnect<\/td><\/tr><tr><td>Values Alignment (stated values and lived behaviour)<\/td><td>Personal preference overrides shared values; trust erodes<\/td><td>Values set aside under pressure; applied inconsistently<\/td><td>Conviction slows adaptation; outside views excluded<\/td><\/tr><tr><td>Learning Orientation (growth mindset, feedback)<\/td><td>Capabilities decay; feedback resisted<\/td><td>Learning shallow; training does not change behaviour<\/td><td>Experimentation diffuses focus; learning not institutionalised<\/td><\/tr><\/tbody><\/table><\/div><p>Each level has a response and three routines that keep the response going. The level held by most members is the team's level for that dimension.<\/p><h2>12. Leading change with one voice<\/h2><p>Every Key Result reaches people through several leaders at once. Where their versions of the change differ, people act on the version that asks least of them. A leadership team that integrates its functional views into one reading of the strategy before anyone speaks has Collective Intelligence. Four commitments, each protecting one check across the organisation:<\/p><ul><li><strong>One message (protects Mind):<\/strong> every leader gives the same Shift, Stake and Step; the team runs the 3S Check on itself before anyone briefs their people.<\/li><li><strong>One example (protects Heart):<\/strong> leaders show the ACE-IT behaviours the change needs before asking for them.<\/li><li><strong>One sequence (protects Hands):<\/strong> leaders pool their changes, count the load landing on each group and agree order and pace. Willingness to support enterprise change fell from 74% to 43% between 2016 and 2022 while planned changes per employee rose from two to ten (Gartner, HBR 2023).<\/li><li><strong>One owner (protects Habit):<\/strong> each transition has one named leader who answers for adoption through to Habit. Projects with extremely effective sponsors were 79% likely to meet objectives, against 27% with extremely ineffective sponsors (Prosci).<\/li><\/ul><\/div>"},"u3m1_lens5":{"html":"<div class=\"usum\" data-unit=\"6\" data-title=\"PERFORMANCE MANAGEMENT SETUP\"><div class=\"usum-comp\"><div class=\"usum-comp-l\">COMPETENCE DEVELOPED<\/div><div class=\"usum-comp-n\">Performance Management<\/div><p>The competent leader connects enterprise results to the contributions of people and the organisation. Performance arrangements then support strategy, accountability and sound decisions.<\/p><\/div><h2>Demonstrable skills<\/h2><ol type=\"1\"><li>Build an S2R® Contribution Map™ from a Key Result<\/li><li>Apply the FACES Framework to drive collective success<\/li><li>Align your performance scorecard to your contribution to Key Results<\/li><\/ol><h2>The unit concept<\/h2><p>Performance management is the system by which the organisation checks, period after period, whether the direction is being delivered and whether the change is holding. Enterprise performance is the combined result of what people contribute and the conditions the organisation provides for those contributions to produce results. A complete system therefore manages two connected operating systems: the Human Operating System and the Organisational Operating System. The S2R® Contribution Map™ connects each Key Result to the functional, human and organisational contributions it requires. FACES defines the five management functions that keep those contributions delivered. Four execution bridges sustain the connection between strategy and results throughout execution, and a commitment-driven architecture makes people co-owners of the result.<\/p><h2>1. The design sequence<\/h2><ol type=\"1\"><li><strong>Define success:<\/strong> agree the result the organisation must achieve.<\/li><li><strong>Design how performance will be managed:<\/strong> agree the conversations, decisions, actions and accountability that will respond to the evidence.<\/li><li><strong>Identify the evidence management decisions require:<\/strong> collect the data those decisions need.<\/li><li><strong>Use the evidence:<\/strong> recognise contribution, correct constraints and improve delivery.<\/li><\/ol><p>Reports become useful because the organisation has decided who will act on them and how.<\/p><h2>2. Two operating systems behind enterprise performance<\/h2><ul><li><strong>The Human Operating System:<\/strong> what individuals and teams contribute. Two dimensions: <strong>performance against KPIs and objectives<\/strong> (what is delivered: OKRs, KPIs and performance commitments) and <strong>performance against behavioural expectations<\/strong> (how it is delivered: collaboration, accountability, values, responsiveness, ethical conduct, leadership). It answers: are individuals and teams delivering their expected results and demonstrating the behaviours required?<\/li><li><strong>The Organisational Operating System:<\/strong> whether the organisation is equipped and configured to deliver, examined through ESRG:<ul><li><strong>E · Environment (FIT):<\/strong> Facilities, Infrastructure, Technology.<\/li><li><strong>S · Systems (SIP):<\/strong> Standardisation, Integration, Process Efficiency.<\/li><li><strong>R · Resources (AIR):<\/strong> Asset Availability, Investment, Resource Utilisation.<\/li><li><strong>G · Governance (PAR):<\/strong> Policies &amp; Procedures, Authority, Risk Management.<\/li><\/ul><\/li><\/ul><p>It answers: does the organisation have the environment, systems, resources and governance to deliver its expected results consistently?<\/p><ul><li><strong>How they interact:<\/strong> a disappointing result can come from a human performance shortfall or from an organisational constraint, and each needs a different response. An integrated system distinguishes the two, establishes accountability fairly, directs interventions appropriately and avoids holding individuals responsible for conditions outside their control.<\/li><li><strong>The Enterprise Performance Principle:<\/strong> organisational performance emerges from the interaction between what people contribute and how effectively ESRG enables those contributions. Two lines of accountability, Human Performance and Organisational Performance, must both be visible, measured, reviewed and managed.<\/li><\/ul><h2>3. The S2R® Contribution Map™<\/h2><p>A strategy-to-execution tool that identifies the interconnected contributions required from business functions, people and organisational conditions to achieve an enterprise outcome. It addresses a common weakness: each department measures its own KPIs and reports satisfactory performance while the organisation misses its strategic targets. The map follows three steps:<\/p><ol type=\"1\"><li><strong>OKR:<\/strong> what must the organisation achieve? The enterprise Objective and its Key Result.<\/li><li><strong>Required Functional Contributions:<\/strong> what must each function deliver, reflecting the interdependencies between functions?<\/li><li><strong>Human and Organisational Contributions:<\/strong> for each function, the <strong>people performance<\/strong> required (results and behaviours, with measurable commitments wherever practical) and the <strong>organisational performance<\/strong> required (the ESRG conditions that enable delivery, with a measure or evidence of readiness).<\/li><\/ol><p>Only the organisational conditions that materially affect delivery are included, and not every condition needs a numerical metric: some need evidence that an arrangement exists and functions. The central principle: enterprise results are achieved through connected human and organisational contributions, supported by clear functional accountability.<\/p><h2>4. The FACES Framework<\/h2><p>Five functions every Enterprise Performance Management system must fulfil, each applied to people and organisational performance.<\/p><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Function<\/strong><\/th><th><strong>People performance<\/strong><\/th><th><strong>Organisational performance<\/strong><\/th><\/tr><\/thead><tbody><tr><td>F · Foster a Results Culture<\/td><td>People own their targets and commitments; leaders give feedback, recognise dependable contributors and respond consistently to underperformance. Results achieved through behaviour that undermines others are not acceptable performance<\/td><td>Leaders take the same responsibility for operating conditions that they expect from employees. Recurring system failures, inadequate resources or governance delays are not tolerated while people are held accountable for missed results<\/td><\/tr><tr><td>A · Align Performance<\/td><td>Strategic priorities translate into meaningful KPIs, OKRs and behavioural expectations; people see how their work contributes, including cross-functional dependencies<\/td><td>Environment, systems, resources and governance are configured to support the results the organisation intends to achieve<\/td><\/tr><tr><td>C · Create Measurement Transparency<\/td><td>KPIs, targets, weightings, behavioural standards and rating criteria are clear; assessment rests on observable evidence<\/td><td>Evidence on system availability, process efficiency, capacity against demand, coordination and decision turnaround shows why a gap exists and where to intervene<\/td><\/tr><tr><td>E · Embed Shared Accountability<\/td><td>Individuals own their KPIs, OKRs and behaviours; managers own expectations, feedback and response; each person's part in team results is clear<\/td><td>Each organisational condition has an accountable leader; dependencies between functions, owners and escalation routes are explicit<\/td><\/tr><tr><td>S · Support Continuous Development<\/td><td>Performance evidence identifies development needs, with clear objectives and follow-up<\/td><td>Recurring constraints trigger improvements to workflows, technology, resources or governance, monitored for effect<\/td><\/tr><\/tbody><\/table><\/div><p>The Contribution Map sets out what must be delivered and enabled; FACES sets out the management disciplines through which those contributions are aligned, evaluated, acted on and strengthened.<\/p><h2>5. Performance management as the execution bridge<\/h2><p>Strategy is delivered over time. Four bridges keep strategy connected to performance throughout delivery:<\/p><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Bridge<\/strong><\/th><th><strong>Why it matters<\/strong><\/th><th><strong>When it weakens<\/strong><\/th><\/tr><\/thead><tbody><tr><td>1 · Decomposing the Big Picture<\/td><td>Keeps the line of sight between objectives, individual expectations and the organisational conditions they need<\/td><td>Functions focus on their own targets; individual performance looks satisfactory while the collective contribution weakens<\/td><\/tr><tr><td>2 · Defining the Logic of Success<\/td><td>Gives a shared understanding of successful delivery for results, behaviours and enabling conditions<\/td><td>Functions interpret success differently; people are rated positively while organisational constraints stay unresolved<\/td><\/tr><tr><td>3 · Calibrating the Rhythm<\/td><td>Makes changes in performance, demand and conditions visible early enough to influence the outcome<\/td><td>Deterioration is recognised too late, with little room for recovery<\/td><\/tr><tr><td>4 · Structuring the Dialogue<\/td><td>Turns performance evidence into decisions, owners and coordinated action<\/td><td>Reviews become reporting exercises and the same gaps recur<\/td><\/tr><\/tbody><\/table><\/div><h2>6. Compliance and commitment architecture<\/h2><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Dimension<\/strong><\/th><th><strong>Compliance-driven<\/strong><\/th><th><strong>Commitment-driven<\/strong><\/th><\/tr><\/thead><tbody><tr><td>Purpose<\/td><td>Ensure minimum standards are met and deviations corrected<\/td><td>Generate shared ownership of results and continuous improvement<\/td><\/tr><tr><td>Ownership<\/td><td>Leader holds accountability; team is subject to it<\/td><td>Team co-owns accountability; leader facilitates<\/td><\/tr><tr><td>Tone<\/td><td>Assessment and judgement; hierarchical<\/td><td>Inquiry and problem-solving; collaborative<\/td><\/tr><tr><td>Experience<\/td><td>Anxiety-producing; done to the individual<\/td><td>Energy-generating; done with the individual<\/td><\/tr><\/tbody><\/table><\/div><p>The distinction applies to both operating systems. A commitment-driven approach keeps the expectations, strengthens ownership and examines whether organisational arrangements actually support the result. When performance falls short, a credible system distinguishes inadequate follow-through from an organisational constraint before deciding the response. Commitment strengthens accountability when employees remain responsible for their contributions and leaders remain equally responsible for the enabling conditions within their authority.<\/p><h2>7. The performance scorecard<\/h2><p>The scorecard is where enterprise results reach the individual: the measures on which a role is assessed and the weight each carries.<\/p><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Category<\/strong><\/th><th><strong>What it measures<\/strong><\/th><th><strong>Question<\/strong><\/th><th><strong>Typical weighting<\/strong><\/th><th><strong>Review rhythm<\/strong><\/th><\/tr><\/thead><tbody><tr><td>Strategy (OKRs)<\/td><td>Strategic OKRs connected to the multi-year strategy<\/td><td>Are we progressing on what matters most for where we are going?<\/td><td>30–50% at senior levels; lower for frontline roles<\/td><td>Quarterly<\/td><\/tr><tr><td>Operational (KPIs)<\/td><td>Departmental KPIs: efficiency, output, quality, service<\/td><td>Are operations performing at the standard the strategy needs?<\/td><td>30–50%; highest for frontline and specialist roles<\/td><td>Monthly or fortnightly<\/td><\/tr><tr><td>Behavioural<\/td><td>Values and leadership behaviours, through 360° feedback and peer observation<\/td><td>How are our results being achieved?<\/td><td>20–40%; higher for leadership and customer-facing roles<\/td><td>Bi-annually<\/td><\/tr><\/tbody><\/table><\/div><p>Developing a scorecard: start from the Key Results the role contributes to (from the Contribution Map); add the Operational KPIs; add the Behavioural measures; weight the three categories to total 100%, reflecting the role's level and influence on the strategy; make the whole scorecard transparent to the role holder. At executive level, the leader is measured on the cumulative outcome the team's activities produce. How results are achieved matters as much as what results are achieved.<\/p><h2>8. Executive performance integration: Unity in Diversity<\/h2><p>Functional bias shapes what executives notice, what they prioritise and how they interpret performance evidence. Unity in Diversity means integrating different executive performance perspectives into one collective understanding of enterprise progress. The executive team examines people performance (whether agreed KPIs, OKRs and behaviours are delivered and coordinated across functions) and organisational performance (whether the relevant conditions enable those contributions, with owners resolving constraints), then brings the evidence together to decide whether functional performance supports the enterprise result, where human contribution or organisational capability is weakening delivery, and which executive decisions are required.<\/p><h2>9. The continuous performance management shift<\/h2><div class=\"usum-tw\"><table class=\"usum-t\"><thead><tr><th><strong>Shift<\/strong><\/th><th><strong>Traditional orientation<\/strong><\/th><th><strong>Evolving orientation<\/strong><\/th><\/tr><\/thead><tbody><tr><td>Annual to continuous<\/td><td>Formal evaluation at annual or biannual intervals<\/td><td>Regular check-ins and timely feedback throughout execution<\/td><\/tr><tr><td>Rating-centric to development-centric<\/td><td>Conversations centre on ratings and past achievement<\/td><td>Evidence informs development and improvement of both people and organisational conditions<\/td><\/tr><tr><td>Individual to team<\/td><td>Assessment concentrates on individual achievement<\/td><td>Individual accountability complemented by team and cross-functional contribution<\/td><\/tr><\/tbody><\/table><\/div><p>Continuous performance management strengthens the organisation's ability to recognise and respond to performance conditions while there is still time to influence
